workflows:
  swipess-ios-testflight:
    name: Swipess iOS Release -> TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Source of truth: every push to GitHub main can produce the exact iOS
    # TestFlight binary. Cancel stale queued builds so an older commit can never
    # arrive in TestFlight after a newer one.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      # One-time Codemagic setup: create this exact variable group and add the
      # existing App Store Connect API key values to it.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.swipess.mobile
        APP_STORE_APPLE_ID: 6779810584
        SUPABASE_URL: https://vplgtcguxujxwrgguxqq.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_FA0BseFSS6zM7Y8K3w8zLQ_d8BXqEuV
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prove GitHub source and branch
        script: |
          set -eu
          echo "Codemagic branch: ${CM_BRANCH:-<unset>}"
          echo "Codemagic commit: ${CM_COMMIT:-<unset>}"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Checked-out HEAD: $HEAD_SHA"

          if [ "${CM_BRANCH:-}" != "main" ]; then
            echo "REFUSING RELEASE: iOS TestFlight releases must come from main."
            exit 1
          fi
          if [ -z "${CM_COMMIT:-}" ] || [ "$HEAD_SHA" != "$CM_COMMIT" ]; then
            echo "REFUSING RELEASE: checkout SHA does not equal Codemagic CM_COMMIT."
            exit 1
          fi

          IOS_BUILD_NAME="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$IOS_BUILD_NAME" ]; then
            echo "Could not resolve Flutter build name from pubspec.yaml."
            exit 1
          fi

          echo "IOS_BUILD_NAME=$IOS_BUILD_NAME" >> "$CM_ENV"
          echo "SWIPESS_BUILD_SHA=$CM_COMMIT" >> "$CM_ENV"
          echo "SWIPESS_BUILD_CHANNEL=CM-main" >> "$CM_ENV"

      - name: Check App Store Connect credentials
        script: |
          set -eu
          for name in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "MISSING_CODEMAGIC_CREDENTIAL: $name"
              exit 1
            fi
          done
          echo "App Store Connect credentials are present."

      - name: Resolve next TestFlight build number
        script: |
          set -eu
          LATEST_BUILD="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          case "$LATEST_BUILD" in
            ''|*[!0-9]*)
              echo "Unexpected TestFlight build number: $LATEST_BUILD"
              exit 1
              ;;
          esac
          IOS_BUILD_NUMBER=$((LATEST_BUILD + 1))
          echo "Latest TestFlight build: $LATEST_BUILD"
          echo "This Codemagic build: $IOS_BUILD_NAME ($IOS_BUILD_NUMBER)"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "SWIPESS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      - name: Configure native Google Sign-In
        script: |
          if [ -n "${GOOGLE_IOS_CLIENT_ID:-}" ] || [ -n "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            if [ -z "${GOOGLE_IOS_CLIENT_ID:-}" ] || [ -z "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
              echo "Both GOOGLE_IOS_CLIENT_ID and GOOGLE_SERVER_CLIENT_ID must be set for native Google Sign-In."
              exit 1
            fi
            case "$GOOGLE_IOS_CLIENT_ID" in
              *.apps.googleusercontent.com) ;;
              *) echo "GOOGLE_IOS_CLIENT_ID is not a Google OAuth client ID."; exit 1 ;;
            esac
            GOOGLE_REVERSED_CLIENT_ID="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes:1" ios/Runner/Info.plist >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleTypeRole string Editor" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string google-sign-in" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string $GOOGLE_REVERSED_CLIENT_ID" ios/Runner/Info.plist
            echo "Native Google Sign-In callback configured."
          else
            echo "Google OAuth env vars are not set; native Google Sign-In will remain unavailable in this archive."
          fi

      - name: Force Flutter/Xcode release configuration
        script: |
          flutter build ios --config-only --release --no-codesign \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=SWIPESS_BUILD_SHA="$SWIPESS_BUILD_SHA" \
            --dart-define=SWIPESS_BUILD_NUMBER="$SWIPESS_BUILD_NUMBER" \
            --dart-define=SWIPESS_BUILD_CHANNEL="$SWIPESS_BUILD_CHANNEL"
          grep -E '^(FLUTTER_BUILD_MODE|FLUTTER_BUILD_NAME|FLUTTER_BUILD_NUMBER)=' ios/Flutter/Generated.xcconfig

      - name: Fetch App Store signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed RELEASE IPA from exact commit
        script: |
          set -eu
          flutter clean
          flutter pub get
          flutter build ios --config-only --release --no-codesign \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=SWIPESS_BUILD_SHA="$SWIPESS_BUILD_SHA" \
            --dart-define=SWIPESS_BUILD_NUMBER="$SWIPESS_BUILD_NUMBER" \
            --dart-define=SWIPESS_BUILD_CHANNEL="$SWIPESS_BUILD_CHANNEL"

          flutter build ipa --release \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=SWIPESS_BUILD_SHA="$SWIPESS_BUILD_SHA" \
            --dart-define=SWIPESS_BUILD_NUMBER="$SWIPESS_BUILD_NUMBER" \
            --dart-define=SWIPESS_BUILD_CHANNEL="$SWIPESS_BUILD_CHANNEL" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify IPA identity and release mode
        script: |
          set -eu
          rm -rf /tmp/swipess_ipa
          mkdir -p /tmp/swipess_ipa
          unzip -q build/ios/ipa/*.ipa -d /tmp/swipess_ipa
          APP_PATH=/tmp/swipess_ipa/Payload/Runner.app

          sh ios/ci_scripts/verify_release_bundle.sh "$APP_PATH"

          ACTUAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          if [ "$ACTUAL_NAME" != "$IOS_BUILD_NAME" ] || [ "$ACTUAL_BUILD" != "$IOS_BUILD_NUMBER" ]; then
            echo "REFUSING UPLOAD: IPA identity mismatch."
            echo "Expected: $IOS_BUILD_NAME ($IOS_BUILD_NUMBER)"
            echo "Actual:   $ACTUAL_NAME ($ACTUAL_BUILD)"
            exit 1
          fi

          mkdir -p build/ios/ipa
          cat > build/ios/ipa/SWIPESS_PROVENANCE.txt <<EOF
          channel=$SWIPESS_BUILD_CHANNEL
          branch=$CM_BRANCH
          commit=$CM_COMMIT
          version=$ACTUAL_NAME
          build=$ACTUAL_BUILD
          EOF

          echo "VERIFIED IPA: $ACTUAL_NAME ($ACTUAL_BUILD) from $CM_BRANCH@$CM_COMMIT"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/SWIPESS_PROVENANCE.txt
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

  swipess-android-playstore:
    name: Swipess Android Release -> Play Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - keys
      vars:
        PACKAGE_NAME: com.swipess.mobile
        SUPABASE_URL: https://vplgtcguxujxwrgguxqq.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_FA0BseFSS6zM7Y8K3w8zLQ_d8BXqEuV
      flutter: stable
      java: 17
    scripts:
      - name: Set up keystore
        script: |
          echo $KEYSTORE | base64 --decode > /tmp/keystore.keystore
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOL
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/keystore.keystore
          EOL
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
