# Web access-code gate runs before login, so anonymous visitors must reach it.
# The function only compares a submitted code to server-held secrets.
[functions.validate-access-code]
verify_jwt = false

# The video worker cannot use an end-user JWT. This function authenticates
# internal starts with x-job-secret and worker callbacks with one-time job tokens.
[functions.video-pipeline]
verify_jwt = false

# HLS upload authorization is protected by the same one-time per-job worker token.
[functions.video-hls-control]
verify_jwt = false
