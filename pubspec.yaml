  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.10.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/filters/
    - assets/sounds/
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/map/
    - assets/data/

  fonts:
    - family: SwipessIcons
      fonts:
        - asset: assets/fonts/SwipessIcons.ttf
