name: flutter_swipes
description: "Swipess — swipe-first discovery for homes, events, and local services."
publish_to: 'none'
version: 1.2.36+620

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0
  supabase_flutter: ^2.17.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  video_player: ^2.11.0
  chewie: ^1.13.0
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  mapbox_maps_flutter: 3.0.0-alpha.27
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4
  package_info_plus: ^9.0.0
  purchases_flutter: ^9.10.6
  in_app_purchase: ^3.2.3
  pay: ^3.2.1
  device_info_plus: ^12.3.0
  image_cropper: ^11.0.0
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  flutter_tts: ^4.2.5
  speech_to_text: ^7.3.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  just_audio: ^0.10.5
  camera: ^0.11.2+1
  photo_manager: ^3.7.1
  flutter_cache_manager: ^3.4.1
  flutter_image_compress: ^2.4.0
  crypto: ^3.0.7
  http: ^1.6.0
  path: ^1.9.1
  uuid: ^4.5.2
  connectivity_plus: ^7.0.0
  firebase_analytics: ^12.1.0
  collection: ^1.19.1
  flutter_keyboard_visibility: ^6.0.0
  mime: ^2.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  animations: ^2.0.11
  visibility_detector: ^0.4.0+2
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  riverpod_generator: ^4.0.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.3
  mockito: ^5.6.3
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/brand/
    - assets/images/
    - assets/videos/
    - assets/icons/
    - assets/audio/

flutter_native_splash:
  color: "#05060A"
  image: assets/brand/swipess_logo.png
  android_12:
    color: "#05060A"
    image: assets/brand/swipess_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/swipess_app_icon.png"
  remove_alpha_ios: true
