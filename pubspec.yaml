name: flutter_swipes
description: "Swipess — swipe-first discovery for homes, events, and local services."
publish_to: 'none'
version: 1.2.36+622

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_card_swiper: ^7.2.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  supabase_flutter: ^2.17.1
  http: ^1.2.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  signature: ^6.3.0
  video_player: ^2.10.1
  path: ^1.9.1
  url_launcher: ^6.3.2
  cross_file: ^0.3.4
  flutter_map: ^8.3.1
  mapbox_maps_flutter: 3.0.0-alpha.27
  latlong2: ^0.10.1
  intl: ^0.20.2
  record: ^6.1.2
  qr_flutter: ^4.1.0
  flutter_tts: ^4.2.3
  geolocator: ^14.0.2
  local_auth: ^2.3.0
  share_plus: ^11.0.0
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.4.0
  in_app_purchase: ^3.2.3
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  package_info_plus: ^8.3.1
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  collection: ^1.19.1
  universal_html: ^2.2.4
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  mime: ^2.0.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/brand/
    - assets/filters/
    - assets/i18n/
    - assets/mock/
    - assets/mock/events/
    - assets/mock/profiles/
    - assets/mock/properties/
    - assets/mock/services/
    - assets/mock/vehicles/
    - assets/sounds/
    - assets/video/
    - assets/videos/
    - assets/.well-known/
