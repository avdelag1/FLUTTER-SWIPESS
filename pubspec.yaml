name: flutter_swipes
description: "Swipess — swipe-first discovery for homes, events, and local services."
publish_to: 'none'
version: 1.2.44+640
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_card_swiper: ^7.2.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  supabase_flutter: ^2.17.1
  http: ^1.2.2
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  signature: ^6.3.0
  video_player: ^2.10.1
  path: ^1.9.1
  url_launcher: ^6.3.2
  cross_file: ^0.3.4
  flutter_map: ^8.3.1
  mapbox_maps_flutter: 3.0.0-alpha.27
  latlong2: ^0.10.1
  intl: ^0.20.2
  record: ^6.1.2
  speech_to_text: ^7.4.0
  qr_flutter: ^4.1.0
  flutter_tts: ^4.2.3
  geolocator: ^14.0.2
  local_auth: ^2.3.0
  share_plus: ^11.0.0
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  in_app_review: ^2.0.12
  in_app_purchase: ^3.2.3
  app_badge_plus: ^1.3.4
  liquid_pull_to_refresh: ^3.0.1
  mobile_scanner: ^7.4.0

dependency_overrides:
  mapbox_maps_flutter_mobile: 3.0.0-alpha.27
  mapbox_maps_flutter_platform_interface: 3.0.0-alpha.27
  mapbox_maps_flutter_web: 3.0.0-alpha.27

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  network_image_mock: ^2.1.1
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/onboarding/
    - assets/brand/
    - assets/filters/
    - assets/i18n/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  image_path_ios: "assets/app_icon.png"
  android: true
  ios: true