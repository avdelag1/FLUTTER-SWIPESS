name: Fix dashboard AI scroll isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dashboard-ai-scroll-ghost.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isolate nested AI scrolling and add ghost transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          shell_path = Path('lib/src/features/dashboard/presentation/screens/dashboard_shell.dart')
          shell = shell_path.read_text()
          old_condition = """              if (!isEvents &&
                  !isProfile &&
                  notification is ScrollUpdateNotification) {"""
          new_condition = """              if (!isEvents &&
                  !isProfile &&
                  notification.depth == 0 &&
                  notification.metrics.axis == Axis.vertical &&
                  notification is ScrollUpdateNotification) {"""
          if old_condition not in shell:
              raise SystemExit('dashboard shell scroll condition not found')
          shell = shell.replace(old_condition, new_condition, 1)
          shell_path.write_text(shell)

          bento_path = Path('lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart')
          bento = bento_path.read_text()
          pattern = re.compile(
              r"""              SliverToBoxAdapter\(\s*child: Padding\(\s*// SafeArea already accounts for the status bar\..*?\n            \),\n            SliverPadding\(""",
              re.S,
          )
          replacement = """              SliverToBoxAdapter(
                child: Consumer(
                  builder: (context, ref, child) {
                    final showChrome = ref.watch(chromeVisibilityProvider);
                    return TweenAnimationBuilder<double>(
                      tween: Tween<double>(
                        begin: 1,
                        end: showChrome ? 1 : 0,
                      ),
                      duration: Duration(
                        milliseconds: showChrome ? 420 : 560,
                      ),
                      curve: Curves.easeInOutCubic,
                      child: GlowSearchBar(
                        hint: market != null &&
                                (!market.effectiveOpen ||
                                    !market.featureEnabled('ai'))
                            ? 'AI is not active in this market'
                            : 'What are you looking for?',
                        onTap: () => _openAiSearch(),
                        controller: _aiSearchController,
                        onSubmitted: (val) => _openAiSearch(val),
                        locationLabel: discovery.city,
                        dateLabel: discovery.dateLabel,
                        guestLabel:
                            '${discovery.guests} ${discovery.guests == 1 ? 'guest' : 'guests'}',
                        onLocationTap: _pickCity,
                        onDatesTap: _pickDates,
                        onGuestsTap: _pickGuests,
                      ),
                      builder: (context, reveal, child) {
                        final progress = reveal.clamp(0.0, 1.0).toDouble();
                        return IgnorePointer(
                          ignoring: progress < .08,
                          child: Padding(
                            padding: EdgeInsets.fromLTRB(
                              16,
                              48 * progress,
                              16,
                              8 * progress,
                            ),
                            child: ClipRect(
                              child: Align(
                                alignment: Alignment.topCenter,
                                heightFactor: progress,
                                child: Opacity(
                                  opacity: progress,
                                  child: Transform.translate(
                                    offset: Offset(
                                      0,
                                      -12 * (1 - progress),
                                    ),
                                    child: Transform.scale(
                                      scale: .985 + (.015 * progress),
                                      alignment: Alignment.topCenter,
                                      child: child,
                                    ),
                                  ),
                                ),
                              ),
                            ),
                          ),
                        );
                      },
                    );
                  },
                ),
              ),
            SliverPadding("""
          bento, count = pattern.subn(replacement, bento, count=1)
          if count != 1:
              raise SystemExit(f'dashboard AI chrome block match count={count}')
          bento_path.write_text(bento)

          # Guard the exact regression: only the root vertical dashboard scroll
          # may hide global chrome; the AI panel's nested scroll must not.
          assert 'notification.depth == 0' in shell
          assert 'notification.metrics.axis == Axis.vertical' in shell
          assert 'TweenAnimationBuilder<double>' in bento
          assert 'heightFactor: progress' in bento
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched files
        run: dart format lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze touched dashboard code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart

      - name: Verify persistent chrome guard
        run: flutter test test/persistent_chrome_overlap_guard_test.dart --reporter expanded

      - name: Commit fix
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(dashboard): isolate AI scroll and soften chrome exit"
          git pull --rebase origin main
          git push origin HEAD:main
