name: Apply quick-filter edge taps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quick-filter-edge-taps-20260903.yml'
      - 'tool/apply_quick_filter_edge_taps_20260903.py'

permissions:
  contents: write

concurrency:
  group: apply-quick-filter-edge-taps-20260903
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply edge-tap patch
        run: python3 tool/apply_quick_filter_edge_taps_20260903.py

      - name: Setup Dart formatter
        uses: dart-lang/setup-dart@v1

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart \
            lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'intercepting: kIsWeb' lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q 'flex: 20' lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q 'PointerInterceptor' lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          grep -q 'x < width \* .40' lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          grep -q 'x > width \* .60' lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'swipess-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart \
            lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          git commit -m 'Fix quick-filter left right taps for all media'
          git push origin HEAD:main
