name: Apply profile header spacing tweak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-header-spacing-once.yml'

permissions:
  contents: write

jobs:
  patch-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten profile/header spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/profile/presentation/screens/profile_screen.dart')
          text = path.read_text()

          replacements = [
              ('edgeOffset: safe.top + 66,', 'edgeOffset: safe.top + 48,'),
              ('displacement: safe.top + 84,', 'displacement: safe.top + 66,'),
              ('                safe.top + 84,\n                16,', '                safe.top + 64,\n                16,'),
              ("                    IconButton(\n                      tooltip: 'AI listing builder',", "                    IconButton(\n                      padding: EdgeInsets.zero,\n                      constraints: const BoxConstraints.tightFor(\n                        width: 40,\n                        height: 44,\n                      ),\n                      visualDensity: VisualDensity.compact,\n                      tooltip: 'AI listing builder',"),
              ("                    IconButton(\n                      tooltip: 'Add listing manually',", "                    IconButton(\n                      padding: EdgeInsets.zero,\n                      constraints: const BoxConstraints.tightFor(\n                        width: 40,\n                        height: 44,\n                      ),\n                      visualDensity: VisualDensity.compact,\n                      tooltip: 'Add listing manually',"),
              ("                    IconButton(\n                      tooltip: 'More',", "                    IconButton(\n                      padding: EdgeInsets.zero,\n                      constraints: const BoxConstraints.tightFor(\n                        width: 40,\n                        height: 44,\n                      ),\n                      visualDensity: VisualDensity.compact,\n                      tooltip: 'More',"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected profile spacing pattern not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit profile tweak and remove one-shot workflow
        run: |
          git config user.name "swipess-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/profile-header-spacing-once.yml
          git add lib/src/features/profile/presentation/screens/profile_screen.dart
          git commit -m "Tighten profile header spacing"
          git push origin HEAD:main
