name: Patch listing media editor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-listing-media-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - name: Patch create and edit media UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          add = Path('lib/src/features/add/presentation/screens/add_listing_screen.dart')
          text = add.read_text()
          imp = "import 'package:flutter_swipes/src/features/add/presentation/widgets/listing_video_soundtrack_picker.dart';\n"
          new_imp = imp + "import 'package:flutter_swipes/src/features/add/presentation/widgets/listing_video_inline_preview.dart';\n"
          if 'listing_video_inline_preview.dart' not in text:
              if imp not in text:
                  raise SystemExit('add screen soundtrack import marker missing')
              text = text.replace(imp, new_imp, 1)

