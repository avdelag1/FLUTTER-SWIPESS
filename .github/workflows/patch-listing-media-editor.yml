          PY
      - name: Format
        run: dart format lib/src/features/add/presentation/screens/add_listing_screen.dart lib/src/features/add/presentation/screens/edit_listing_screen.dart lib/src/features/add/presentation/providers/edit_listing_provider.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze touched listing media code
        run: flutter analyze --no-fatal-warnings lib/src/features/add/presentation/screens/add_listing_screen.dart lib/src/features/add/presentation/screens/edit_listing_screen.dart lib/src/features/add/presentation/providers/edit_listing_provider.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart
      - name: Listing media tests
        run: flutter test test/listing_video_audio_test.dart
      - name: Web compile guard
        run: flutter build web --release
      - name: Commit verified patch and remove workflow
        run: |
          rm -f .github/workflows/patch-listing-media-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/add/presentation/screens/add_listing_screen.dart \
                  lib/src/features/add/presentation/screens/edit_listing_screen.dart \
                  lib/src/features/add/presentation/providers/edit_listing_provider.dart \
                  lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart \
                  .github/workflows/patch-listing-media-editor.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Preview listing videos and drag-reorder photos"
          git push origin HEAD:main
