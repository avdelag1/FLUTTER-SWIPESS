          preview = "        if (draft.video != null) ...[\n          const SizedBox(height: 8),\n          ListingVideoInlinePreview(\n            file: draft.video,\n            muted: !draft.videoAudioEnabled,\n            height: 280,\n          ),\n          const SizedBox(height: 10),\n"
          if 'ListingVideoInlinePreview(\n            file: draft.video' not in text:
              if marker not in text:
                  raise SystemExit('add video block marker missing')
              text = text.replace(marker, preview, 1)

          photos_header = "          const SizedBox(height: 10),\n          GridView.builder(\n"
