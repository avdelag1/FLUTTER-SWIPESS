name: Patch listing media editor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-listing-media-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Patch create and edit media UI
        run: python3 .github/patches/patch_listing_media_editor.py
      - name: Format
        run: dart format lib/src/features/add/presentation/screens/add_listing_screen.dart lib/src/features/add/presentation/screens/edit_listing_screen.dart lib/src/features/add/presentation/providers/edit_listing_provider.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze touched listing media code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/src/features/add/presentation/screens/add_listing_screen.dart lib/src/features/add/presentation/screens/edit_listing_screen.dart lib/src/features/add/presentation/providers/edit_listing_provider.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart
      - name: Listing media tests
        run: flutter test test/listing_video_audio_test.dart
      - name: Web compile guard
        run: flutter build web --release
      - name: Commit verified patch and cleanup
        run: |
          rm -f .github/workflows/patch-listing-media-editor.yml
          rm -f .github/patches/patch_listing_media_editor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/add/presentation/screens/add_listing_screen.dart \
                  lib/src/features/add/presentation/screens/edit_listing_screen.dart \
                  lib/src/features/add/presentation/providers/edit_listing_provider.dart \
                  lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart \
                  .github/workflows/patch-listing-media-editor.yml \
                  .github/patches/patch_listing_media_editor.py
          git commit -m "Preview listing videos and drag-reorder photos"
          git push origin HEAD:main
