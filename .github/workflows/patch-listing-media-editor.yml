          if 'Long-press any photo' not in text:
              if photos_header not in text:
                  raise SystemExit('add photo grid marker missing')
              text = text.replace(photos_header, photos_header_new, 1)

          old_tile = """              final photo = draft.photos[index];
              return Stack(
                fit: StackFit.expand,
                children: [
                  ClipRRect(
                    borderRadius: BorderRadius.circular(18),
                    child: FutureBuilder(
                      future: photo.readAsBytes(),
                      builder: (context, snap) {
                        if (!snap.hasData) {
                          return const ColoredBox(color: Color(0xFF16161C));
                        }
                        return Image.memory(snap.data!, fit: BoxFit.cover);
                      },
                    ),
                  ),
                  Positioned(
                    top: 4,
                    right: 4,
                    child: GestureDetector(
                      onTap: () => ref
                          .read(addListingProvider.notifier)
                          .removePhoto(index),
                      child: const CircleAvatar(
                        radius: 12,
                        backgroundColor: Colors.black54,
                        child: Icon(Icons.close, size: 14, color: Colors.white),
                      ),
                    ),
                  ),
                  if (index == 0 && draft.video == null)
                    Positioned(
                      left: 6,
                      bottom: 6,
                      child: Container(
                        padding: const EdgeInsets.symmetric(
                          horizontal: 7,
                          vertical: 3,
                        ),
                        decoration: BoxDecoration(
                          color: Colors.black54,
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: Text(
                          'COVER',
                          style: GoogleFonts.plusJakartaSans(
                            color: Colors.white,
                            fontSize: 9,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                      ),
                    ),
                ],
              );
"""
          new_tile = """              final photo = draft.photos[index];
              final tile = _buildPhotoTile(ref, photo, index);
              return DragTarget<int>(
