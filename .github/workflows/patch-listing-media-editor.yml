  List<String> get resolvedPhotoOrder => photoOrder.isNotEmpty
      ? photoOrder
      : <String>[
          for (final url in existingImages) 'existing:$url',
          for (final file in newPhotos) 'new:${file.path}',
        ];
""",
              1,
          )
          p = p.replace(
              "    List<XFile>? newPhotos,\n    String? existingVideoUrl,",
              "    List<XFile>? newPhotos,\n    List<String>? photoOrder,\n    String? existingVideoUrl,",
