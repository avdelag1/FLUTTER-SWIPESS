name: Verify Admin-style listing video route

on:
  push:
    branches:
      - fix-admin-style-listing-video-route-20260903
    paths:
      - '.github/workflows/verify-admin-style-listing-video-route-20260903.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply model route patch
        run: python3 tool/patch_admin_style_listing_video_route_20260903.py
      - name: Format
        run: dart format lib/src/features/swipes/domain/models/listing.dart lib/src/features/swipes/data/repositories/listing_repository.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview_io.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview_html.dart lib/src/features/camera/data/video_upload_optimizer_html.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build web release
        run: flutter build web --release
      - name: Commit validated app files
        run: |
          git config user.name "swipess-video-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/swipes/domain/models/listing.dart lib/src/features/swipes/data/repositories/listing_repository.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview_io.dart lib/src/features/add/presentation/widgets/listing_video_inline_preview_html.dart lib/src/features/camera/data/video_upload_optimizer_html.dart
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "fix(video): Mirror Admin Events upload and playback on web"
            git push origin HEAD:fix-admin-style-listing-video-route-20260903
          fi
