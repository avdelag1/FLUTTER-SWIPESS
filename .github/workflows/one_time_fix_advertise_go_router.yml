name: One-time fix advertise GoRouter compile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[advertise-router-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Add missing GoRouter import and remove one-time workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/src/features/profile/presentation/screens/advertise_screen.dart')
          text = p.read_text()
          imp = "import 'package:go_router/go_router.dart';\n"
          if imp not in text:
              anchor = "import 'package:google_fonts/google_fonts.dart';\n"
              if anchor not in text:
                  raise SystemExit('Could not find import anchor in advertise_screen.dart')
              text = text.replace(anchor, anchor + imp, 1)
              p.write_text(text)
              print('Added go_router import')
          else:
              print('go_router import already present')
          Path('.github/workflows/one_time_fix_advertise_go_router.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "Swipess Build Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: import GoRouter in Promote Event [advertise-router-fixed]"
          git pull --rebase origin main
          git push origin HEAD:main
