name: Hotfix web build and header menu

on:
  push:
    paths:
      - '.github/workflows/hotfix-web-build-menu-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch compile blocker and menu hit target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          video = Path('lib/src/features/camera/data/video_recut_v3_html.dart')
          s = video.read_text()
          old = "if (videoJs.hasProperty('requestVideoFrameCallback'.toJS)) {"
          new = "if (videoJs.hasProperty('requestVideoFrameCallback'.toJS).toDart) {"
          if old not in s and new not in s:
              raise SystemExit('video JSBoolean guard not found')
          s = s.replace(old, new, 1)
          video.write_text(s)

          header = Path('lib/src/core/widgets/app_top_bar.dart')
          s = header.read_text()
          old = """          child: _HudButton(
            semanticLabel: 'Open menu',
            onTap: () {},
            child: Icon(Icons.menu_rounded, size: 28, color: ink),
          ),
"""
          new = """          child: IgnorePointer(
            child: _HudButton(
              semanticLabel: 'Open menu',
              onTap: () {},
              child: Icon(Icons.menu_rounded, size: 28, color: ink),
            ),
          ),
"""
          if old not in s and new not in s:
              raise SystemExit('header menu child block not found')
          s = s.replace(old, new, 1)
          header.write_text(s)
          PY

      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/camera/data/video_recut_v3_html.dart lib/src/core/widgets/app_top_bar.dart
          git commit -m "fix(web): compile video cadence patch and restore header menu"
          git push origin HEAD:main
