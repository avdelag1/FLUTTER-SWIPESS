name: Bootstrap video worker lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/bootstrap-video-worker-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock video worker dependencies'
          git pull --rebase origin main
          git push origin HEAD:main
