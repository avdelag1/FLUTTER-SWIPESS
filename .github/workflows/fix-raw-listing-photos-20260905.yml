name: Force portrait swipe photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-raw-listing-photos-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-portrait-swipe-photos-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Force swipe media to fill portrait card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart')
          text = path.read_text()
          if 'SizedBox.expand(child: _primaryMedia(current))' in text:
              print('portrait fill already applied')
              raise SystemExit(0)

          pattern = re.compile(
              r'(child:\s*ProtectedMedia\(\s*watermark:\s*true,\s*absorbLongPress:\s*false,\s*)child:\s*_primaryMedia\(current\),',
              re.S,
          )
          replacement = (
              r'\1// Force the media surface to the full portrait swipe-card bounds.\n'
              r'                  // The original photo stays untouched; BoxFit.cover only crops visually.\n'
              r'                  child: SizedBox.expand(child: _primaryMedia(current)),'
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('could not locate ProtectedMedia primary-media child')
          path.write_text(updated)
          print('forced swipe photo media to full portrait bounds')
          PY

      - name: Validate portrait media
        run: |
          git diff --check
          grep -q "SizedBox.expand(child: _primaryMedia(current))" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          grep -q "fit: BoxFit.cover" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          grep -q "width: double.infinity" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "height: double.infinity" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "fit: BoxFit.cover" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze portrait media surfaces
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart

      - name: Commit to main
        run: |
          if git diff --quiet -- lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart; then
            echo "Portrait fill already present"
            exit 0
          fi
          git config user.name "swipess-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          git commit -m "fix(swipes): force photos to fill portrait card"
          git restore .
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git reset --hard HEAD
            sleep 2
          done
          exit 1
