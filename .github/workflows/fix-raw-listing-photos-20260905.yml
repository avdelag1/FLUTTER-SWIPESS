name: Harden swipe media

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-raw-listing-photos-20260905.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 .github/scripts/harden_swipe_media_20260905.py

      - name: Validate diff
        run: |
          git diff --check
          grep -q "SizedBox.expand(child: _primaryMedia(current))" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          grep -q "_imageFailureFallback" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          grep -q "_videoPlaceholder" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          grep -q "video_poster_url" lib/src/features/swipes/domain/models/listing.dart
          grep -q "Duration(milliseconds: durationMs)" lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart
          grep -q "const topDim = 0.0" lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze changed files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/swipes/domain/models/listing.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart

      - name: Commit to main
        run: |
          git restore pubspec.lock || true
          if git diff --quiet -- lib/src/features/swipes/domain/models/listing.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart; then
            echo "already applied"
            exit 0
          fi
          git config user.name "swipess-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/swipes/domain/models/listing.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart
          git commit -m "fix(swipes): harden media and vertical snap"
          git restore .
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1
