name: One-shot map popup like fix

on:
  push:
    paths:
      - '.github/workflows/one_shot_map_popup_like_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply popup patch
        run: python3 tool/one_shot_map_popup_like_fix.py

      - name: Commit map fix
        run: |
          git config user.name "swipess-map-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/map/presentation/screens/web_discovery_mapbox_v3.dart
          git diff --cached --check
          git commit -m "fix(map): keep liked popup visible until dismissed"
          git push origin HEAD:main
