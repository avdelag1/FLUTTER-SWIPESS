name: One-shot map popup like fix

on:
  push:
    paths:
      - '.github/workflows/one_shot_map_popup_like_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch persistent Mapbox popup/like behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/map/presentation/screens/web_discovery_mapbox_v3.dart')
          s = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          """  final _searchController = TextEditingController();
          final _cards = ScrollController();
          final Set<String> _sessionHidden = <String>{};

          double get _trayHeight""",
          """  final _searchController = TextEditingController();
          final _cards = ScrollController();
          final Set<String> _sessionHidden = <String>{};
          final Set<String> _justLiked = <String>{};

          double get _trayHeight""",
          'add just-liked state')

          replace_once(
          """    final all = <_Item>[
            for (final listing in listings)
              if (!likedListings.contains(listing.id)) _listingItem(listing, loc),
            for (final profile in profiles)
              if (!likedPeople.contains(profile.id)) _profileItem(profile, loc),
            for (final event in events)
              if (!likedEvents.contains(event.id)) _eventItem(event, loc),
          ];""",
          """    final all = <_Item>[
            for (final listing in listings)
              if (!likedListings.contains(listing.id) ||
                  (_selectedKey ==
                          '${_listingKind(listing).name}:${listing.id}' &&
                      _justLiked.contains(_selectedKey)))
                _listingItem(listing, loc),
            for (final profile in profiles)
              if (!likedPeople.contains(profile.id) ||
                  (_selectedKey == 'person:${profile.id}' &&
                      _justLiked.contains(_selectedKey)))
                _profileItem(profile, loc),
            for (final event in events)
              if (!likedEvents.contains(event.id) ||
                  (_selectedKey == 'event:${event.id}' &&
                      _justLiked.contains(_selectedKey)))
                _eventItem(event, loc),
          ];""",
          'keep newly-liked selected item visible')

          replace_once(
          """  void _select(_Item item, List<_Item> items) {
            AppHaptics.selection();
            setState(() => _selectedKey = item.key);""",
          """  void _retireSelectedLike({String? exceptKey}) {
            final key = _selectedKey;
            if (key == null || key == exceptKey || !_justLiked.contains(key)) return;
            _justLiked.remove(key);
            _sessionHidden.add(key);
          }

          void _select(_Item item, List<_Item> items) {
            AppHaptics.selection();
            _retireSelectedLike(exceptKey: item.key);
            setState(() => _selectedKey = item.key);""",
          'retire liked item when moving to another pin')

          replace_once(
          """  void _dismissSelection() {
            if (_selectedKey == null && !_menuOpen) return;
            setState(() {
              _selectedKey = null;
              _menuOpen = false;
            });
          }""",
          """  void _dismissSelection() {
            if (_selectedKey == null && !_menuOpen) return;
            _retireSelectedLike();
            setState(() {
              _selectedKey = null;
              _menuOpen = false;
            });
            _scheduleProjection();
          }""",
          'dismiss liked preview cleanly')

          replace_once(
          """  Future<void> _like(_Item item) async {
            if (_sessionHidden.contains(item.key)) return;
            AppHaptics.medium();
            setState(() {
              _sessionHidden.add(item.key);
              if (_selectedKey == item.key) _selectedKey = null;
            });
            _scheduleProjection();
            try {
              final repo = ref.read(likesRepositoryProvider);""",
          """  Future<void> _like(_Item item) async {
            if (_sessionHidden.contains(item.key) || _justLiked.contains(item.key)) {
              return;
            }
            AppHaptics.medium();
            setState(() => _justLiked.add(item.key));
            try {
              final repo = ref.read(likesRepositoryProvider);""",
          'do not disappear immediately after heart tap')

          replace_once(
          """    } catch (_) {
              if (!mounted) return;
              setState(() => _sessionHidden.remove(item.key));
              _scheduleProjection();
            }
          }

          Future<void> _submitSearch()""",
          """    } catch (_) {
              if (!mounted) return;
              setState(() => _justLiked.remove(item.key));
              _scheduleProjection();
            }
          }

          Future<void> _submitSearch()""",
          'rollback optimistic heart only')

          replace_once(
          """      setState(() {
                _query = '';
                _selectedKey = null;
              });""",
          """      _retireSelectedLike();
              setState(() {
                _query = '';
                _selectedKey = null;
              });""",
          'retire selected like on place search')

          replace_once(
          """  void _closeMap() {
            final close = widget.onClose;""",
          """  void _closeMap() {
            _retireSelectedLike();
            final close = widget.onClose;""",
          'retire selected like on map close')

          replace_once(
          """      if (previous.latitude != next.latitude ||
                  previous.longitude != next.longitude ||
                  previous.radiusKm != next.radiusKm) {
                setState(() => _selectedKey = null);""",
          """      if (previous.latitude != next.latitude ||
                  previous.longitude != next.longitude ||
                  previous.radiusKm != next.radiusKm) {
                _retireSelectedLike();
                setState(() => _selectedKey = null);""",
          'retire selected like on map location change')

          replace_once(
          """                          onChanged: (value) => setState(() {
                                _query = value;
                                _selectedKey = null;
                              }),""",
          """                          onChanged: (value) => setState(() {
                                _retireSelectedLike();
                                _query = value;
                                _selectedKey = null;
                              }),""",
          'retire selected like while typing search')

          replace_once(
          """                    onFilter: (value) {
                          setState(() {
                            _filter = value;
                            _selectedKey = null;
                          });""",
          """                    onFilter: (value) {
                          setState(() {
                            _retireSelectedLike();
                            _filter = value;
                            _selectedKey = null;
                          });""",
          'retire selected like when filter changes')

          replace_once(
          """                      onHideControls: () => setState(() {
                            _controlsVisible = false;
                            _menuOpen = false;
                            _searchOpen = false;
                            _selectedKey = null;
                          }),""",
          """                      onHideControls: () => setState(() {
                            _retireSelectedLike();
                            _controlsVisible = false;
                            _menuOpen = false;
                            _searchOpen = false;
                            _selectedKey = null;
                          }),""",
          'retire selected like when controls hide')

          preview_old = """              // Preview paints after ALL markers. It therefore cannot be hidden
              // behind a cluster of pins, regardless of marker list order.
              if (selected != null && selectedPixel != null)
                Positioned(
                  left: (selectedPixel.dx - 118)
                      .clamp(8.0, math.max(8.0, constraints.maxWidth - 244))
                      .toDouble(),
                  top: (selectedPixel.dy - 150)
                      .clamp(8.0, math.max(8.0, constraints.maxHeight - 104))
                      .toDouble(),
                  child: _Preview(
                    item: selected,
                    onOpen: () => _open(selected!),
                    onLike: () => _like(selected!),
                    onClose: _dismissSelection,
                  ),
                ),

"""
          if s.count(preview_old) != 1:
              raise SystemExit(f'remove old preview layer: expected 1 match, found {s.count(preview_old)}')
          s = s.replace(preview_old, '', 1)

          replace_once(
          """                      items: items,
                      selectedKey: _selectedKey,
                      controller: _cards,""",
          """                      items: items,
                      selectedKey: _selectedKey,
                      likedKeys: _justLiked,
                      controller: _cards,""",
          'pass liked state into tray')

          final_preview = """

              // The preview is intentionally the FINAL Stack child. It must
              // float above pins, filter chips, menu controls and the listing
              // tray, exactly like a premium map callout.
              if (selected != null && selectedPixel != null)
                Positioned(
                  left: (selectedPixel.dx - 118)
                      .clamp(8.0, math.max(8.0, constraints.maxWidth - 244))
                      .toDouble(),
                  top: (selectedPixel.dy - 150)
                      .clamp(8.0, math.max(8.0, constraints.maxHeight - 104))
                      .toDouble(),
                  child: _Preview(
                    item: selected,
                    liked: _justLiked.contains(selected.key),
                    onOpen: () => _open(selected!),
                    onLike: () => _like(selected!),
                    onClose: _dismissSelection,
                  ),
                ),
"""
          replace_once(
          """                  child: _FloatingIcon(
                    label: 'Show controls',
                    icon: Icons.visibility_rounded,
                    onTap: () => setState(() => _controlsVisible = true),
                  ),
                ),
            ],""",
          """                  child: _FloatingIcon(
                    label: 'Show controls',
                    icon: Icons.visibility_rounded,
                    onTap: () => setState(() => _controlsVisible = true),
                  ),
                ),""" + final_preview + """            ],""",
          'put preview above every map control')

          replace_once(
          """  const _Preview({
            required this.item,
            required this.onOpen,
            required this.onLike,
            required this.onClose,
          });

          final _Item item;
          final VoidCallback onOpen;""",
          """  const _Preview({
            required this.item,
            required this.liked,
            required this.onOpen,
            required this.onLike,
            required this.onClose,
          });

          final _Item item;
          final bool liked;
          final VoidCallback onOpen;""",
          'preview liked state')

          replace_once(
          """                child: _BareIcon(
                  icon: Icons.favorite_border_rounded,
                  label: 'Like',
                  onTap: onLike,
                ),""",
          """                child: _BareIcon(
                  icon: liked
                      ? Icons.favorite_rounded
                      : Icons.favorite_border_rounded,
                  label: liked ? 'Saved' : 'Like',
                  color: liked ? const Color(0xFFE53935) : Colors.black87,
                  onTap: onLike,
                ),""",
          'filled heart in preview')

          replace_once(
          """  const _BareIcon({
            required this.icon,
            required this.label,
            required this.onTap,
          });

          final IconData icon;
          final String label;
          final VoidCallback onTap;""",
          """  const _BareIcon({
            required this.icon,
            required this.label,
            required this.onTap,
            this.color = Colors.black87,
          });

          final IconData icon;
          final String label;
          final VoidCallback onTap;
          final Color color;""",
          'bare icon supports heart color')

          replace_once(
          """            child: Icon(icon, color: Colors.black87, size: 18),""",
          """            child: Icon(icon, color: color, size: 18),""",
          'render bare icon color')

          replace_once(
          """    required this.items,
            required this.selectedKey,
            required this.controller,""",
          """    required this.items,
            required this.selectedKey,
            required this.likedKeys,
            required this.controller,""",
          'tray ctor liked keys')

          replace_once(
          """  final List<_Item> items;
          final String? selectedKey;
          final ScrollController controller;""",
          """  final List<_Item> items;
          final String? selectedKey;
          final Set<String> likedKeys;
          final ScrollController controller;""",
          'tray liked keys field')

          replace_once(
          """                          return _MiniCard(
                            item: item,
                            selected: item.key == selectedKey,
                            onTap: () => onSelect(item),""",
          """                          return _MiniCard(
                            item: item,
                            selected: item.key == selectedKey,
                            liked: likedKeys.contains(item.key),
                            onTap: () => onSelect(item),""",
          'pass liked state into mini card')

          replace_once(
          """    required this.item,
            required this.selected,
            required this.onTap,""",
          """    required this.item,
            required this.selected,
            required this.liked,
            required this.onTap,""",
          'mini card ctor liked state')

          replace_once(
          """  final _Item item;
          final bool selected;
          final VoidCallback onTap;""",
          """  final _Item item;
          final bool selected;
          final bool liked;
          final VoidCallback onTap;""",
          'mini card liked field')

          # This is the second heart occurrence after the preview heart was
          # already replaced above.
          replace_once(
          """                          _BareIcon(
                            icon: Icons.favorite_border_rounded,
                            label: 'Like',
                            onTap: onLike,
                          ),""",
          """                          _BareIcon(
                            icon: liked
                                ? Icons.favorite_rounded
                                : Icons.favorite_border_rounded,
                            label: liked ? 'Saved' : 'Like',
                            color: liked
                                ? const Color(0xFFE53935)
                                : Colors.black87,
                            onTap: onLike,
                          ),""",
          'filled heart in mini card')

          path.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "swipess-map-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/map/presentation/screens/web_discovery_mapbox_v3.dart
          git diff --cached --check
          git commit -m "fix(map): keep liked popup visible until dismissed"
          git push origin HEAD:main
