name: Patch profile previews and video-first listing media

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_profile_preview_video_first.py'
      - '.github/workflows/patch-profile-preview-video-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply profile and quick-filter media fixes
        run: python3 .github/scripts/patch_profile_preview_video_first.py
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/features/profile/presentation/screens/profile_screen.dart \
            lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart \
            lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          git commit -m 'Fix profile previews and make listing video first'
          git push origin HEAD:main