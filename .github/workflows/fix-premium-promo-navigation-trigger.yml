name: Premium promo patch trigger
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-premium-promo-navigation-trigger.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_premium_promo_navigation.py
      - run: dart format lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v4.dart lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart lib/src/core/widgets/app_top_bar.dart lib/src/core/widgets/cap_back_button.dart || true
      - run: |
          grep -q 'visiblePromoSpots = 100' lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v4.dart
          grep -q 'PROMO SPOTS LEFT' lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart
          grep -q 'router.push(AppPaths.subscriptionPackages)' lib/src/core/widgets/app_top_bar.dart
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v4.dart lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart lib/src/core/widgets/app_top_bar.dart lib/src/core/widgets/cap_back_button.dart
          git rm .github/scripts/fix_premium_promo_navigation.py .github/workflows/fix-premium-promo-navigation.yml .github/workflows/fix-premium-promo-navigation-trigger.yml .github/promo-nav-trigger.txt .github/workflows/ref-trigger-marker.txt .github/workflows/ref-trigger-marker-2.txt .github/workflows/ref-trigger-marker-3.txt || true
          git commit -m 'Fix Founding 100 promo and normal back navigation'
          git pull --rebase origin main
          git push origin HEAD:main
# real-ref-trigger
