name: Apply dashboard runtime hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dashboard-runtime-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/dashboard_runtime_hotfix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/widgets/voice_language_selector.dart lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/map/presentation/screens/platform_discovery_map_screen.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze changed files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/widgets/voice_language_selector.dart lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/map/presentation/screens/platform_discovery_map_screen.dart

      - name: Commit and push
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/widgets/voice_language_selector.dart lib/src/features/dashboard/presentation/screens/dashboard_shell.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/map/presentation/screens/platform_discovery_map_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: live dashboard voice and instant navigation"
          git push origin HEAD:main
