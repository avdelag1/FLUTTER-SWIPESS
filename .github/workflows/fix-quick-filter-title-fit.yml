name: Fix quick filter title fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-quick-filter-title-fit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make quick filter titles always fit one line
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart')
          text = path.read_text()

          old = """                      Text(
                        widget.title,
                        style: AppTheme.displayItalic.copyWith(
                          fontSize: 12,
                          letterSpacing: 1.6,
                          height: 1.1,
                        ),
                      ),"""

          new = """                      FittedBox(
                        fit: BoxFit.scaleDown,
                        alignment: Alignment.centerLeft,
                        child: Text(
                          widget.title,
                          maxLines: 1,
                          softWrap: false,
                          style: AppTheme.displayItalic.copyWith(
                            fontSize: 12,
                            letterSpacing: 1.6,
                            height: 1.1,
                          ),
                        ),
                      ),"""

          if old not in text:
              raise SystemExit('Expected quick-filter title block not found')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit app fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-quick-filter-title-fit.yml
          git add lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git commit -m 'Make quick filter titles responsive on narrow phones'
          git push origin main
