name: Patch paid video and dashboard sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-paid-video-dashboard-sync.yml'
      - '.github/scripts/patch_paid_video_dashboard_sync.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply product patch
        run: python3 .github/scripts/patch_paid_video_dashboard_sync.py
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/features/subscriptions/presentation/providers/subscription_provider.dart \
            lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart \
            lib/src/features/payments/domain/iap_catalog.dart \
            lib/src/features/add/presentation/screens/add_listing_screen.dart \
            lib/src/features/add/presentation/providers/add_listing_provider.dart \
            lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart \
            lib/src/features/add/presentation/providers/edit_listing_provider.dart \
            lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart \
            lib/src/features/dashboard/domain/bento_media_pools.dart \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/swipes/presentation/providers/swipe_providers.dart \
            lib/src/features/events/presentation/providers/events_provider.dart \
            lib/src/core/performance/app_refresh_service.dart \
            lib/src/core/native/app_lifecycle_service.dart \
            test/dashboard_parity_test.dart \
            test/listing_video_audio_test.dart
          git commit -m 'Make listing video paid Premium and refresh dashboard data'
          git push origin HEAD:main
