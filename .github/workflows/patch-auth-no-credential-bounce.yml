name: Patch auth no credential bounce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-auth-no-credential-bounce.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make successful auth leave credential screens immediately
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('lib/src/features/auth/presentation/screens/auth_screen.dart')
          text = auth.read_text()

          old_import = "import 'package:flutter_swipes/src/core/routing/app_paths.dart';\n"
          new_import = old_import + "import 'package:flutter_swipes/src/core/routing/pending_deep_link.dart';\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('auth import anchor not found')
              text = text.replace(old_import, new_import, 1)

          oauth_old = """    if (success) {\n      return;\n    }\n\n    final state = ref.read(authControllerProvider);\n"""
          oauth_new = """    if (success) {\n      _finishSuccessfulAuth();\n      return;\n    }\n\n    final state = ref.read(authControllerProvider);\n"""
          if oauth_old not in text:
              raise SystemExit('OAuth success anchor not found')
          text = text.replace(oauth_old, oauth_new, 1)

          submit_old = """    if (success) {\n      return;\n    }\n\n    final state = ref.read(authControllerProvider);\n"""
          submit_new = """    if (success) {\n      _finishSuccessfulAuth();\n      return;\n    }\n\n    final state = ref.read(authControllerProvider);\n"""
          if submit_old not in text:
              raise SystemExit('email auth success anchor not found')
          text = text.replace(submit_old, submit_new, 1)

          helper_anchor = """  Future<void> _resetPassword() async {\n"""
          helper = """  void _finishSuccessfulAuth() {\n    if (!mounted) return;\n    FocusManager.instance.primaryFocus?.unfocus();\n    final pending = ref.read(pendingDeepLinkProvider).take();\n    context.go(pending ?? AppPaths.clientDashboard);\n  }\n\n  Future<void> _resetPassword() async {\n"""
          if '_finishSuccessfulAuth() {' not in text:
              if helper_anchor not in text:
                  raise SystemExit('helper insertion anchor not found')
              text = text.replace(helper_anchor, helper, 1)

          auth.write_text(text)

          router = Path('lib/src/core/routing/app_router.dart')
          r = router.read_text()
          old = "      final signedIn = ref.read(currentUserProvider) != null;\n"
          new = """      final signedIn =\n          ref.read(currentUserProvider) != null ||\n          Supabase.instance.client.auth.currentSession != null;\n"""
          if old not in r:
              if new not in r:
                  raise SystemExit('router signedIn anchor not found')
          else:
              r = r.replace(old, new, 1)
          router.write_text(r)
          PY

          git diff --check
          git diff -- lib/src/features/auth/presentation/screens/auth_screen.dart lib/src/core/routing/app_router.dart

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Auth routing tests
        shell: bash
        run: |
          if [[ -f test/app_redirect_test.dart ]]; then
            flutter test test/app_redirect_test.dart --reporter expanded
          fi
          if [[ -f test/auth_controller_test.dart ]]; then
            flutter test test/auth_controller_test.dart --reporter expanded
          fi

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-auth-no-credential-bounce.yml
          git add lib/src/features/auth/presentation/screens/auth_screen.dart lib/src/core/routing/app_router.dart
          git diff --cached --check
          git commit -m "Prevent auth credential screen bounce after sign-in"
          git push origin HEAD:main
