name: Apply Instagram-style listing verified badge

on:
  push:
    paths:
      - '.github/workflows/patch-instagram-verified-badge.yml'

permissions:
  contents: write

jobs:
  patch-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move verified badge beside listing price
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart')
          lines = path.read_text().splitlines()

          # Remove the old floating VERIFIED glass pill, keeping the match meter.
          out = []
          removed = False
          i = 0
          while i < len(lines):
              if (
                  not removed
                  and lines[i].strip() == 'if (widget.listing.hasVerifiedDocuments)'
                  and any('top: 66' in line for line in lines[max(0, i - 12):i])
              ):
                  j = i + 1
                  while j < len(lines) and lines[j].strip() != 'Builder(':
                      j += 1
                  if j >= len(lines):
                      raise SystemExit('Could not locate match meter Builder after verified pill')
                  i = j
                  removed = True
                  continue
              out.append(lines[i])
              i += 1

          if not removed:
              raise SystemExit('Old floating verified pill was not found')

          lines = out

          # Remove the old extra vertical spacing that only existed for the pill.
          for i in range(len(lines) - 2):
              if (
                  lines[i].strip() == 'padding: EdgeInsets.only('
                  and 'widget.listing.hasVerifiedDocuments ? 8 : 0' in lines[i + 1]
                  and lines[i + 2].strip() == '),'
              ):
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  lines[i:i + 3] = [indent + 'padding: EdgeInsets.zero,']
                  break

          # Replace the price text with price + Instagram-style blue check.
          price_replaced = False
          i = 0
          while i < len(lines) - 7:
              if (
                  lines[i].strip() == 'Text('
                  and lines[i + 1].strip() == 'widget.listing.formattedPrice,'
              ):
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  u = indent + '  '
                  v = u + '  '
                  w = v + '  '
                  lines[i:i + 8] = [
                      indent + 'Row(',
                      u + 'children: [',
                      v + 'Flexible(',
                      w + 'child: Text(',
                      w + '  widget.listing.formattedPrice,',
                      w + '  maxLines: 1,',
                      w + '  overflow: TextOverflow.ellipsis,',
                      w + '  style: GoogleFonts.plusJakartaSans(',
                      w + '    color: Colors.white,',
                      w + '    fontSize: 22,',
                      w + '    fontWeight: FontWeight.w900,',
                      w + '  ),',
                      w + '),',
                      v + '),',
                      v + 'if (widget.listing.hasVerifiedDocuments) ...[',
                      w + 'const SizedBox(width: 7),',
                      w + 'const Icon(',
                      w + '  Icons.verified_rounded,',
                      w + '  size: 19,',
                      w + '  color: Color(0xFF1687FF),',
                      w + '),',
                      v + '],',
                      u + '],',
                      indent + '),',
                  ]
                  price_replaced = True
                  break
              i += 1

          if not price_replaced:
              raise SystemExit('Price block was not found')

          path.write_text('\n'.join(lines) + '\n')

          # One-shot workflow: remove itself in the patch commit.
          Path('.github/workflows/patch-instagram-verified-badge.yml').unlink()

      - name: Commit patch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move verified badge beside listing price"
          git push origin main
