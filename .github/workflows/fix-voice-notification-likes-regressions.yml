name: Fix voice notification likes regressions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-voice-notification-likes-regressions.yml
      - .github/scripts/fix_voice_notification_likes_regressions.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 .github/scripts/fix_voice_notification_likes_regressions.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched Dart files
        run: dart format lib/src/features/ai/presentation/services/live_voice_input.dart lib/src/core/native/local_notifications_service.dart lib/src/features/likes/presentation/providers/likes_provider.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze touched code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/ai/presentation/services/live_voice_input.dart lib/src/core/native/local_notifications_service.dart lib/src/features/likes/presentation/providers/likes_provider.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart

      - name: Run regression test
        run: flutter test test/persistent_chrome_overlap_guard_test.dart --reporter expanded

      - name: Verify behavioral guards
        shell: bash
        run: |
          grep -q "_handleNativeError" lib/src/features/ai/presentation/services/live_voice_input.dart
          if grep -A6 "Future<void> scheduleReengagement" lib/src/core/native/local_notifications_service.dart | grep -q "ensurePermission"; then exit 1; fi
          grep -q "_fetchLikedTargetIds('event')" lib/src/features/likes/presentation/providers/likes_provider.dart
          grep -q "eventLikesStillLoading" lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart
          grep -q "Notification permission is foreground-only" AGENTS.md

      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add AGENTS.md lib/src/features/ai/presentation/services/live_voice_input.dart lib/src/core/native/local_notifications_service.dart lib/src/features/likes/presentation/providers/likes_provider.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(native): stabilize voice countdown and likes lifecycle"
          git pull --rebase origin main
          git push origin HEAD:main
