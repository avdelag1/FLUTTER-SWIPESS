name: Fix listing video cadence 20260904

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-listing-video-cadence-20260904.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch listing video cadence
        run: python3 tool/fix_listing_video_cadence_20260904.py

      - name: Verify patch
        run: |
          node --check api/video-transcode.js
          test -z "$(grep -n "setsar=1,fps=30" api/video-transcode.js || true)"
          grep -q "bool _portraitCrop = false" lib/src/features/camera/presentation/screens/video_cropper_screen_v2.dart
          grep -q "canUseSourceDirectly" lib/src/features/camera/presentation/screens/video_cropper_screen_v2.dart

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/video-transcode.js lib/src/features/camera/presentation/screens/video_cropper_screen_v2.dart
          git commit -m "fix(video): preserve listing motion cadence"
          git push origin HEAD:main
