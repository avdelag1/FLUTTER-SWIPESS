name: Remove Popular quick filter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-remove-popular-quick-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Popular quick filter
        run: python .github/patches/remove_popular_quick_filter.py

      - name: Commit dashboard cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-remove-popular-quick-filter.yml
          git rm .github/patches/remove_popular_quick_filter.py
          git add lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git add lib/src/features/dashboard/domain/bento_media_pools.dart
          git add lib/src/features/swipes/presentation/providers/swipe_providers.dart
          git add lib/src/core/performance/app_performance_bootstrap.dart
          git commit -m "Remove Popular and keep quality recommendations"
          git push origin HEAD:main
