name: Fix continuous voice AI handoff

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/fix_ios_voice_ai_handoff.py
      - .github/workflows/fix-ios-voice-ai-handoff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded continuous voice patch
        run: python3 .github/scripts/fix_ios_voice_ai_handoff.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/ai/presentation/services/browser_live_speech_stub.dart \
            lib/src/features/ai/presentation/services/browser_live_speech_web.dart \
            lib/src/features/ai/presentation/services/live_voice_input.dart \
            lib/src/core/widgets/glow_search_bar.dart \
            lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze voice paths
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/ai/presentation/services/browser_live_speech_stub.dart \
            lib/src/features/ai/presentation/services/browser_live_speech_web.dart \
            lib/src/features/ai/presentation/services/live_voice_input.dart \
            lib/src/core/widgets/glow_search_bar.dart \
            lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart

      - name: Run voice and chrome regression tests
        run: |
          flutter test test/voice_countdown_guard_test.dart --reporter expanded
          flutter test test/persistent_chrome_overlap_guard_test.dart --reporter expanded

      - name: Verify resumed-speech guards
        shell: bash
        run: |
          grep -q "BrowserSpeechActivityCallback" lib/src/features/ai/presentation/services/browser_live_speech_stub.dart
          grep -q "case 'speech'" lib/src/features/ai/presentation/services/browser_live_speech_web.dart
          grep -q "onSpeechActivity" lib/src/features/ai/presentation/services/live_voice_input.dart
          grep -q "onSpeechActivity: _handleSpeechActivity" lib/src/core/widgets/glow_search_bar.dart
          grep -q "onSpeechActivity:" lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart
          grep -q "push('speech', 'start')" web/index.html
          grep -q "recognition.onspeechend" web/index.html
          grep -q "restartAfterSilence: true" lib/src/core/widgets/glow_search_bar.dart
          ! grep -q "widget.controller?.clear();" lib/src/core/widgets/glow_search_bar.dart

      - name: Commit continuous voice fix to main
        shell: bash
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add \
            AGENTS.md \
            web/index.html \
            lib/src/features/ai/presentation/services/browser_live_speech_stub.dart \
            lib/src/features/ai/presentation/services/browser_live_speech_web.dart \
            lib/src/features/ai/presentation/services/live_voice_input.dart \
            lib/src/core/widgets/glow_search_bar.dart \
            lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(voice): cancel auto-send when speech resumes"
          git pull --rebase origin main
          git push origin HEAD:main
