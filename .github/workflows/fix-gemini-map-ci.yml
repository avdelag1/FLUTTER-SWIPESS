name: Repair Gemini map regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gemini-map-ci.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair map listing card types and people marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/map/presentation/screens/real_mapbox_screen.dart')
          text = path.read_text()

          replacements = {
              "      price = pin.listing!.price ?? '';":
                  "      price = pin.listing!.formattedPrice;",
              "      if (pin.listing!.images != null && pin.listing!.images!.isNotEmpty) {\n        imageUrl = pin.listing!.images!.first.url;\n      }":
                  "      if (pin.listing!.images.isNotEmpty) {\n        imageUrl = pin.listing!.images.first;\n      }",
              "      icon: Icons.music_note_rounded,":
                  "      icon: Icons.person_rounded,",
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected source fragment not found: {old!r}')

          if changed:
              path.write_text(text)
          else:
              print('Map regression already repaired; no source changes needed.')
          PY

      - name: Commit repair to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/map/presentation/screens/real_mapbox_screen.dart
          git commit -m "fix: repair map cards after Gemini redesign"
          git push origin HEAD:main
