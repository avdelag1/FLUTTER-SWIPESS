name: One-time release cleanup 2026-08-23

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[release-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=1, required=True):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f"Expected patch target missing in {path}: {old[:120]!r}")
                  return False
              p.write_text(text.replace(old, new, count))
              print(f"patched {path}")
              return True

          # 1) Vercel release blocker: RoundedRectangleBorder takes a BorderSide via `side`, not Border via `border`.
          replace(
              'lib/src/features/admin/presentation/screens/admin_geo_markets_screen.dart',
              '''shape: RoundedRectangleBorder(\n                      borderRadius: BorderRadius.circular(999),\n                      border: Border.all(''',
              '''shape: RoundedRectangleBorder(\n                      borderRadius: BorderRadius.circular(999),\n                      side: BorderSide(''',
          )

          # 2) Support dialog: persist real authenticated tickets instead of a fake delay/success.
          support = 'lib/src/features/profile/presentation/widgets/support_dialog.dart'
          replace(
              support,
              "import 'package:google_fonts/google_fonts.dart';",
              "import 'package:google_fonts/google_fonts.dart';\nimport 'package:supabase_flutter/supabase_flutter.dart';",
          )
          replace(
              support,
              '''  Future<void> _submit() async {\n    if (_subject.text.trim().isEmpty || _message.text.trim().isEmpty) return;\n    AppHaptics.medium();\n    setState(() => _sending = true);\n    await Future<void>.delayed(const Duration(milliseconds: 600));\n    // Bases: insert into support_tickets via repository.\n    if (!mounted) return;\n    setState(() {\n      _sending = false;\n      _sent = true;\n      _subject.clear();\n      _message.clear();\n    });\n  }''',
              '''  Future<void> _submit() async {\n    final subject = _subject.text.trim();\n    final message = _message.text.trim();\n    if (subject.isEmpty || message.isEmpty || _sending) return;\n\n    final user = Supabase.instance.client.auth.currentUser;\n    if (user == null) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(content: Text('Please sign in to contact support.')),\n      );\n      return;\n    }\n\n    AppHaptics.medium();\n    setState(() => _sending = true);\n    try {\n      final role =\n          user.appMetadata['role']?.toString() ??\n          user.userMetadata?['role']?.toString() ??\n          'client';\n      await Supabase.instance.client.from('support_tickets').insert({\n        'user_id': user.id,\n        'subject': subject,\n        'message': message,\n        'category': _category,\n        'priority': _priority,\n        'user_email': user.email ?? '',\n        'user_role': role,\n        'source': 'support_dialog',\n      });\n      if (!mounted) return;\n      setState(() {\n        _sending = false;\n        _sent = true;\n        _subject.clear();\n        _message.clear();\n      });\n    } catch (error) {\n      if (!mounted) return;\n      setState(() => _sending = false);\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text('Could not create support ticket: $error')),\n      );\n    }\n  }''',
          )
          replace(
              support,
              'border: Border.all(color: Colors.white, width: 1.5),',
              'border: Border.all(color: Colors.transparent),',
          )

          # 3) Contact support: save an in-app ticket before opening the email composer.
          contact = 'lib/src/features/profile/presentation/screens/contact_support_screen.dart'
          replace(
              contact,
              "import 'package:url_launcher/url_launcher.dart';",
              "import 'package:url_launcher/url_launcher.dart';\nimport 'package:supabase_flutter/supabase_flutter.dart';",
          )
          replace(
              contact,
              "  String _topic = 'account';",
              "  String _topic = 'account';\n  bool _sending = false;",
          )
          replace(
              contact,
              '''                  BrandPrimaryButton(\n                    label: 'Email Support',\n                    icon: Icons.mail_rounded,\n                    onPressed: _emailSupport,\n                  ),''',
              '''                  BrandPrimaryButton(\n                    label: _sending ? 'Saving request…' : 'Email Support',\n                    icon: Icons.mail_rounded,\n                    loading: _sending,\n                    onPressed: _sending ? null : _emailSupport,\n                  ),''',
          )
          replace(
              contact,
              '''  Future<void> _emailSupport() async {\n    final body = [\n      'Topic: $_topic',\n      if (_message.text.trim().isNotEmpty) '',\n      if (_message.text.trim().isNotEmpty) _message.text.trim(),\n    ].join('\\n');\n    final uri = Uri(\n      scheme: 'mailto',\n      path: _email,\n      queryParameters: {\n        'subject': 'Swipess support — $_topic',\n        if (body.trim().isNotEmpty) 'body': body,\n      },\n    );\n    await launchUrl(uri);\n  }''',
              '''  Future<void> _emailSupport() async {\n    if (_sending) return;\n    final message = _message.text.trim();\n    final body = [\n      'Topic: $_topic',\n      if (message.isNotEmpty) '',\n      if (message.isNotEmpty) message,\n    ].join('\\n');\n    final uri = Uri(\n      scheme: 'mailto',\n      path: _email,\n      queryParameters: {\n        'subject': 'Swipess support — $_topic',\n        if (body.trim().isNotEmpty) 'body': body,\n      },\n    );\n\n    setState(() => _sending = true);\n    final user = Supabase.instance.client.auth.currentUser;\n    if (user != null) {\n      try {\n        final role =\n            user.appMetadata['role']?.toString() ??\n            user.userMetadata?['role']?.toString() ??\n            'client';\n        await Supabase.instance.client.from('support_tickets').insert({\n          'user_id': user.id,\n          'subject': 'Support · $_topic',\n          'message': message.isEmpty\n              ? 'Support request opened from the Contact page.'\n              : message,\n          'category': _topic,\n          'priority': 'medium',\n          'user_email': user.email ?? '',\n          'user_role': role,\n          'source': 'contact_support',\n        });\n      } catch (error) {\n        if (mounted) {\n          ScaffoldMessenger.of(context).showSnackBar(\n            SnackBar(content: Text('Could not save support request: $error')),\n          );\n        }\n      }\n    }\n    if (mounted) setState(() => _sending = false);\n    await launchUrl(uri);\n  }''',
          )

          # 4) Profile: use registered GoRouter routes so full pages do not sit under dashboard chrome.
          profile = 'lib/src/features/profile/presentation/screens/profile_screen.dart'
          for imp in [
              "import 'package:flutter_swipes/src/features/likes/presentation/screens/who_liked_you_screen.dart';\n",
              "import 'package:flutter_swipes/src/features/profile/presentation/screens/advertise_screen.dart';\n",
              "import 'package:flutter_swipes/src/features/profile/presentation/screens/settings_screen.dart';\n",
              "import 'package:flutter_swipes/src/features/subscriptions/presentation/screens/subscription_packages_screen.dart';\n",
          ]:
              replace(profile, imp, '', required=False)

          replace(
              profile,
              '''                              onTap: () =>\n                                  Navigator.of(\n                                    context,\n                                    rootNavigator: true,\n                                  ).push(\n                                    MaterialPageRoute(\n                                      builder: (_) => const WhoLikedYouScreen(),\n                                    ),\n                                  ),''',
              '''                              onTap: () =>\n                                  context.push(AppPaths.clientWhoLikedYou),''',
          )
          replace(
              profile,
              '''                              onTap: () =>\n                                  Navigator.of(\n                                    context,\n                                    rootNavigator: true,\n                                  ).push(\n                                    MaterialPageRoute(\n                                      builder: (_) => const AdvertiseScreen(),\n                                    ),\n                                  ),''',
              '''                              onTap: () =>\n                                  context.push(AppPaths.clientAdvertise),''',
          )
          replace(
              profile,
              '''                              onTap: () =>\n                                  Navigator.of(\n                                    context,\n                                    rootNavigator: true,\n                                  ).push(\n                                    MaterialPageRoute(\n                                      builder: (_) => SettingsScreen(\n                                        audience: profile?.role == 'owner'\n                                            ? 'owner'\n                                            : 'client',\n                                      ),\n                                    ),\n                                  ),''',
              '''                              onTap: () => context.push(\n                                profile?.role == 'owner'\n                                    ? AppPaths.ownerSettings\n                                    : AppPaths.clientSettings,\n                              ),''',
          )
          replace(
              profile,
              '''                        onTap: () =>\n                            Navigator.of(context, rootNavigator: true).push(\n                              MaterialPageRoute(\n                                builder: (_) =>\n                                    const SubscriptionPackagesScreen(),\n                              ),\n                            ),''',
              '''                        onTap: () =>\n                            context.push(AppPaths.subscriptionPackages),''',
          )

          replace(
              profile,
              '''  Future<void> _submitFeedback() async {\n    final msg = _feedbackCtrl.text.trim();\n    final cat = _feedbackCategory;\n    if (msg.isEmpty || cat == null) return;\n    setState(() => _feedbackSending = true);\n    try {\n      final user = Supabase.instance.client.auth.currentUser;\n      await Supabase.instance.client.from('user_feedback').insert({\n        'user_id': user?.id,\n        'email': user?.email,\n        'category': cat,\n        'message': msg,\n      });\n    } catch (_) {\n      // Best-effort like Capacitor — still show thank you.\n    }\n    if (!mounted) return;\n    setState(() {\n      _feedbackSending = false;\n      _feedbackDone = true;\n    });\n  }''',
              '''  Future<void> _submitFeedback() async {\n    final msg = _feedbackCtrl.text.trim();\n    final cat = _feedbackCategory;\n    if (msg.isEmpty || cat == null || _feedbackSending) return;\n    final user = Supabase.instance.client.auth.currentUser;\n    if (user == null) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(content: Text('Please sign in to send feedback.')),\n      );\n      return;\n    }\n\n    setState(() => _feedbackSending = true);\n    try {\n      final role =\n          user.appMetadata['role']?.toString() ??\n          user.userMetadata?['role']?.toString() ??\n          'client';\n      await Supabase.instance.client.from('support_tickets').insert({\n        'user_id': user.id,\n        'subject': 'Feedback · $cat',\n        'message': msg,\n        'category': 'feedback_$cat',\n        'priority': 'low',\n        'user_email': user.email ?? '',\n        'user_role': role,\n        'source': 'profile_feedback',\n      });\n    } catch (error) {\n      if (!mounted) return;\n      setState(() => _feedbackSending = false);\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text('Could not send feedback: $error')),\n      );\n      return;\n    }\n    if (!mounted) return;\n    setState(() {\n      _feedbackSending = false;\n      _feedbackDone = true;\n    });\n  }''',
          )

          # 5) Promote Event: bright readable dark UI; no gray perimeter frames; reliable route-aware Done actions.
          advertise = 'lib/src/features/profile/presentation/screens/advertise_screen.dart'
          replace(advertise, 'color: i <= active ? Colors.white : Colors.white12,', 'color: Colors.white,')
          replace(advertise, 'color: i <= active ? Colors.white : Colors.white10,', "color: i <= active ? Colors.white : const Color(0xFF171A20),")
          replace(advertise, 'border: Border.all(color: Colors.white24),', 'border: Border.all(color: Colors.transparent),', count=2)
          replace(
              advertise,
              '''          color: selected && selectable ? Colors.white : Colors.transparent,\n          borderRadius: BorderRadius.circular(20),\n          border: Border.all(\n            color: selected && selectable ? Colors.white : Colors.white24,\n            width: selected && selectable ? 2 : 1,\n          ),''',
              '''          color: selected && selectable\n              ? Colors.white\n              : const Color(0xFF111319),\n          borderRadius: BorderRadius.circular(20),\n          border: Border.all(color: Colors.transparent),''',
          )
          replace(advertise, 'selected && selectable ? Colors.black54 : p.color', 'selected && selectable ? Colors.black : p.color')
          replace(advertise, '? Colors.black54\n                          : Colors.white,', '? Colors.black\n                          : Colors.white,')
          replace(advertise, 'color: selected && selectable ? Colors.black54 : Colors.white,', 'color: selected && selectable ? Colors.black : Colors.white,')
          replace(advertise, '? Colors.black87\n                              : Colors.white,', '? Colors.black\n                              : Colors.white,')
          replace(advertise, "onPressed: () => Navigator.pop(context),\n        child: const Text('Done'),", "onPressed: () {\n          if (context.canPop()) {\n            context.pop();\n          } else {\n            context.go(AppPaths.clientProfile);\n          }\n        },\n        child: const Text('Done'),")
          replace(advertise, "_primaryBtn(label: 'Done', onPressed: () => Navigator.pop(context)),", "_primaryBtn(\n        label: 'Done',\n        onPressed: () {\n          if (context.canPop()) {\n            context.pop();\n          } else {\n            context.go(AppPaths.clientProfile);\n          }\n        },\n      ),")

          # 6) Events: remove bounce/wobble and implicit-scroll overhead from the vertical story deck.
          events = 'lib/src/features/events/presentation/screens/events_screen.dart'
          replace(
              events,
              '''                scrollDirection: Axis.vertical,\n                allowImplicitScrolling: true,''',
              '''                scrollDirection: Axis.vertical,\n                physics: const PageScrollPhysics(\n                  parent: ClampingScrollPhysics(),\n                ),\n                allowImplicitScrolling: false,''',
          )

          # 7) Surface malformed JSON instead of silently hiding critical identity fallbacks.
          listing = 'lib/src/features/swipes/domain/models/listing.dart'
          replace(listing, '/// Domain model for a listing in the Swipess ecosystem.', "import 'package:flutter/foundation.dart';\n\n/// Domain model for a listing in the Swipess ecosystem.")
          replace(
              listing,
              '''  factory Listing.fromJson(Map<String, dynamic> json) {\n    final rawVerificationStatus =''',
              '''  factory Listing.fromJson(Map<String, dynamic> json) {\n    final parsedId = json['id']?.toString() ?? '';\n    if (parsedId.isEmpty) {\n      debugPrint('[Listing.fromJson] Missing listing id; keys=${json.keys.toList()}');\n    }\n    final rawVerificationStatus =''',
          )
          replace(listing, "      id: json['id']?.toString() ?? '',", '      id: parsedId,')

          roommate = 'lib/src/features/roommates/domain/roommate_profile.dart'
          replace(roommate, 'class RoommateProfile {', "import 'package:flutter/foundation.dart';\n\nclass RoommateProfile {")
          replace(
              roommate,
              '''  factory RoommateProfile.fromJson(Map<String, dynamic> json) {\n    final images = json['profile_images'];\n    return RoommateProfile(\n      userId: json['user_id'] as String,\n      name: (json['name'] as String?)?.trim().isNotEmpty == true\n          ? json['name'] as String\n          : 'Swipess member',''',
              '''  factory RoommateProfile.fromJson(Map<String, dynamic> json) {\n    final images = json['profile_images'];\n    final userId = json['user_id']?.toString() ?? json['id']?.toString() ?? '';\n    final rawName = json['name']?.toString().trim() ?? '';\n    if (userId.isEmpty) {\n      debugPrint('[RoommateProfile.fromJson] Missing user id; keys=${json.keys.toList()}');\n    }\n    if (rawName.isEmpty) {\n      debugPrint('[RoommateProfile.fromJson] Missing name for user=$userId');\n    }\n    return RoommateProfile(\n      userId: userId,\n      name: rawName.isNotEmpty ? rawName : 'Swipess member',''',
          )

          # Remove this one-time workflow from the resulting release commit.
          Path('.github/workflows/one_time_release_cleanup_20260823.yml').unlink(missing_ok=True)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/admin/presentation/screens/admin_geo_markets_screen.dart \
            lib/src/features/profile/presentation/widgets/support_dialog.dart \
            lib/src/features/profile/presentation/screens/contact_support_screen.dart \
            lib/src/features/profile/presentation/screens/profile_screen.dart \
            lib/src/features/profile/presentation/screens/advertise_screen.dart \
            lib/src/features/events/presentation/screens/events_screen.dart \
            lib/src/features/swipes/domain/models/listing.dart \
            lib/src/features/roommates/domain/roommate_profile.dart

      - name: Flutter analyze
        run: flutter analyze

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "Swipess Release Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: release cleanup audit [release-cleanup]"
          git pull --rebase origin main
          git push origin HEAD:main
