name: Fix settings back release guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-settings-back-release-guard.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use shared reliable back control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/src/features/profile/presentation/screens/settings_screen.dart')
          s = p.read_text()
          old = """                      child: _RoundBack(
                        onTap: () => NavBack.popOrGo(context),
                      ),"""
          new = """                      child: const CapBackButton(),"""
          if old not in s:
              raise SystemExit('settings back control block not found')
          s = s.replace(old, new, 1)
          s, count = re.subn(
              r"\nclass _RoundBack extends StatelessWidget \{.*?\n\}\s*$",
              "\n",
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'_RoundBack class removal count={count}')
          p.write_text(s)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/src/features/profile/presentation/screens/settings_screen.dart

      - name: Dependencies
        run: flutter pub get

      - name: Verify settings/back guards
        run: flutter test test/persistent_chrome_overlap_guard_test.dart test/global_back_test.dart test/cap_back_button_navigation_test.dart --reporter expanded

      - name: Analyze touched screen
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/profile/presentation/screens/settings_screen.dart

      - name: Commit fix
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git add lib/src/features/profile/presentation/screens/settings_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(nav): restore Settings shared back control"
          git pull --rebase origin main
          git push origin HEAD:main
