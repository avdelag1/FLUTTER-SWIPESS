name: Fix City Hint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-city-hint.yml'

permissions:
  contents: write

jobs:
  fix-city-hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace city example placeholder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart')
          text = path.read_text()
          old = "hint: 'City, e.g. Tulum',"
          new = "hint: 'City',"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one city hint, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart
          git commit -m "fix(ai listing): simplify city placeholder"
          git push origin main
