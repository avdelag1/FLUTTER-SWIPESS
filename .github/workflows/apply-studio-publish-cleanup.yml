name: Apply Studio publish cleanup

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - .github/workflows/apply-studio-publish-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0
      - name: Patch provider
        run: |
          echo '' | base64 -d > /tmp/studio_cleanup_patch.py
          python3 /tmp/studio_cleanup_patch.py
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/add/presentation/providers/add_listing_provider.dart
          git rm .github/workflows/apply-studio-publish-cleanup.yml
          git commit -m "fix(studio): clean generated media when publish fails"
          git push origin HEAD:feat/studio-photo-video
