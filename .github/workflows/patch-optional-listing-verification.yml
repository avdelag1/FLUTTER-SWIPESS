name: Patch optional listing verification

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/patch_optional_listing_verification.py
      - .github/workflows/patch-optional-listing-verification.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded optional verification patch
        run: python3 .github/scripts/patch_optional_listing_verification.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/add/domain/listing_draft.dart \
            lib/src/features/add/presentation/providers/add_listing_provider.dart \
            lib/src/features/add/presentation/screens/add_listing_screen.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze listing creation paths
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/add/domain/listing_draft.dart \
            lib/src/features/add/presentation/providers/add_listing_provider.dart \
            lib/src/features/add/presentation/screens/add_listing_screen.dart

      - name: Verify optional verification behavior
        shell: bash
        run: |
          grep -q "supportsLegalVerification" lib/src/features/add/domain/listing_draft.dart
          grep -q "captureLegalDocument" lib/src/features/add/presentation/providers/add_listing_provider.dart
          grep -q "No document? No problem" lib/src/features/add/presentation/screens/add_listing_screen.dart
          ! grep -q "Verification required before publishing" lib/src/features/add/presentation/providers/add_listing_provider.dart

      - name: Commit optional verification UX to main
        shell: bash
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add \
            lib/src/features/add/domain/listing_draft.dart \
            lib/src/features/add/presentation/providers/add_listing_provider.dart \
            lib/src/features/add/presentation/screens/add_listing_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make listing verification optional and category-aware"
          git pull --rebase origin main
          git push origin HEAD:main
