name: Final profile visibility and video-first media patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_profile_video_first_followup.py'
      - '.github/workflows/patch-profile-video-first-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply follow-up patch
        run: python3 .github/scripts/patch_profile_video_first_followup.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "_visibleFallback" lib/src/features/profile/presentation/screens/profile_screen.dart
          grep -q "Processed/playback media wins" lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          grep -q "A video listing never flashes its photo/poster first" lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          grep -q "Never substitute a listing photo/poster" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "Video is media #1" lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/features/profile/presentation/screens/profile_screen.dart \
            lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart \
            lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          git commit -m 'Keep profile previews visible and show listing video first'
          git push origin HEAD:main