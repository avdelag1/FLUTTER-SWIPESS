name: Safe voice normalization cleanup

on:
  push:
    branches:
      - fix/dashboard-whisper-accuracy
    paths:
      - .github/workflows/one-shot-safe-voice-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-whisper-accuracy
          fetch-depth: 0

      - name: Remove unsafe transcript guesses
        run: python3 .github/patch_voice_normalization.py

      - name: Commit source cleanup
        run: |
          git config user.name "Swipess Voice Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(voice): preserve authoritative Whisper transcript"
          git push origin HEAD:fix/dashboard-whisper-accuracy
