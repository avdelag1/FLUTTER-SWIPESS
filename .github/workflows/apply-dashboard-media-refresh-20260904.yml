name: Apply staged dashboard media patch

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-media-refresh-20260904.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tool/fix_dashboard_media_refresh_marquee_20260904.py
      - name: Check patch
        run: git diff --check
      - name: Commit source patch
        run: |
          git config user.name swipess-fix-bot
          git config user.email woorkify@gmail.com
          git add lib/src/core/providers/header_menu_open_provider.dart
          git add lib/src/core/performance/app_refresh_service.dart
          git add lib/src/core/widgets/app_top_bar.dart
          git add lib/src/core/widgets/glow_search_bar.dart
          git add lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          git add lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          git add lib/src/features/camera/data/video_recut_v3_html.dart
          git add test/persistent_chrome_overlap_guard_test.dart
          git commit -m 'fix(dashboard): restore live events refresh and readable AI prompts'
          git push origin HEAD:main
