name: Apply final dashboard ticker and fallback hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-dashboard-final-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply precise UI hotfix
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing target for {label}: {path}')
              p.write_text(text.replace(old, new, 1))

          # Listing quick filters: when the live preview resolves empty, show an
          # editorial category backdrop instead of a dead black card. These media
          # have no listing ID, so they never impersonate inventory.
          replace_once(
              'lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart',
              """        : isListingPreviewQuickFilter
        ? (previewResolved ? listingPreviewMedia : const <String>[])
        : BentoMediaPools.forId(item.id);""",
              """        : isListingPreviewQuickFilter
        ? (previewResolved
              ? (listingPreviewMedia.isNotEmpty
                    ? listingPreviewMedia
                    : BentoMediaPools.forId(item.id))
              : const <String>[])
        : BentoMediaPools.forId(item.id);""",
              'listing quick-filter visual fallback',
          )

          # Slow, human-readable continuous marquee. The next phrase is already
          # following the current one, so it naturally enters from the right as
          # the current phrase leaves instead of blinking/swapping in place.
          replace_once(
              'lib/src/core/widgets/glow_search_bar.dart',
              'const Duration(milliseconds: 5200)',
              'const Duration(milliseconds: 8300)',
              'prompt cadence',
          )

          old = """                                  final painter = TextPainter(
                                    text: TextSpan(text: displayHint, style: promptStyle),
                                    maxLines: 1,
                                    textDirection: Directionality.of(context),
                                  )..layout();
                                  final travel = math.max(
                                    painter.width + 18,
                                    constraints.maxWidth + 18,
                                  );
                                  return ClipRect(
                                    child: TweenAnimationBuilder<double>(
                                      key: ValueKey<String>(displayHint),
                                      tween: Tween<double>(begin: 0, end: 1),
                                      duration: const Duration(milliseconds: 5000),
                                      curve: Curves.linear,
                                      builder: (context, progress, child) {
                                        return Transform.translate(
                                          offset: Offset(-travel * progress, 0),
                                          child: child,
                                        );
                                      },
                                      child: Text(
                                        displayHint,
                                        maxLines: 1,
                                        softWrap: false,
                                        overflow: TextOverflow.visible,
                                        style: promptStyle,
                                      ),
                                    ),
                                  );"""

          new = """                                  final nextHint = prompts[
                                    (_promptIndex + 1) % prompts.length
                                  ];
                                  const separator = '      •      ';
                                  final currentRun = '$displayHint$separator';
                                  final tickerText = '$currentRun$nextHint';
                                  final painter = TextPainter(
                                    text: TextSpan(text: currentRun, style: promptStyle),
                                    maxLines: 1,
                                    textDirection: Directionality.of(context),
                                  )..layout();
                                  final travel = painter.width;
                                  return ClipRect(
                                    child: TweenAnimationBuilder<double>(
                                      key: ValueKey<String>(displayHint),
                                      tween: Tween<double>(begin: 0, end: 1),
                                      duration: const Duration(milliseconds: 8200),
                                      curve: Curves.linear,
                                      builder: (context, progress, child) {
                                        return Transform.translate(
                                          offset: Offset(-travel * progress, 0),
                                          child: child,
                                        );
                                      },
                                      child: Text(
                                        tickerText,
                                        maxLines: 1,
                                        softWrap: false,
                                        overflow: TextOverflow.visible,
                                        style: promptStyle,
                                      ),
                                    ),
                                  );"""
          replace_once(
              'lib/src/core/widgets/glow_search_bar.dart',
              old,
              new,
              'continuous AI marquee',
          )
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Format touched Dart
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart lib/src/features/dashboard/domain/bento_media_pools.dart lib/src/features/swipes/data/market_swipe_repository.dart

      - name: Analyze touched surfaces
        run: flutter analyze lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart lib/src/features/dashboard/domain/bento_media_pools.dart lib/src/features/swipes/data/market_swipe_repository.dart

      - name: Commit hotfix to main
        run: |
          git config user.name "Swipess Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(dashboard): slow AI ticker and restore empty-card visuals"
          git push origin HEAD:main
