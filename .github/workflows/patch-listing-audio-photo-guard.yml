name: Patch listing soundtrack photo guard

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/listing_audio_photo_guard.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply guard
        run: python3 .github/patches/listing_audio_photo_guard.py
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart test/listing_video_audio_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart test/listing_video_audio_test.dart
      - name: Test
        run: flutter test test/listing_video_audio_test.dart --reporter expanded
      - name: Commit verified guard
        run: |
          rm -f .github/patches/listing_audio_photo_guard.py .github/workflows/patch-listing-audio-photo-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep listing soundtracks tied to video frames'
          git push origin HEAD:main
