name: Fix voice restart throw guard

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/fix_voice_restart_throw.py
      - .github/workflows/fix-voice-restart-throw.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_voice_restart_throw.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format
        run: dart format lib/src/features/ai/presentation/services/live_voice_input.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/ai/presentation/services/live_voice_input.dart
      - name: Test regression
        run: flutter test test/persistent_chrome_overlap_guard_test.dart --reporter expanded
      - name: Commit
        shell: bash
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add lib/src/features/ai/presentation/services/live_voice_input.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(voice): retry recognizer restart throws during countdown"
          git pull --rebase origin main
          git push origin HEAD:main
