name: Verify map markers and AI shine

on:
  push:
    branches:
      - fix/map-markers-ai-shine

permissions:
  contents: write

concurrency:
  group: map-ai-polish
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply UI fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # AI search: smoother prompt transition + moving shine on text.
          p = Path('lib/src/core/widgets/glow_search_bar.dart')
          s = p.read_text()
          s = s.replace(
              'class _GlowSearchBarState extends State<GlowSearchBar> {',
              'class _GlowSearchBarState extends State<GlowSearchBar> with SingleTickerProviderStateMixin {',
              1,
          )
          s = s.replace(
              '  Timer? _promptTimer;\n  int _promptIndex = 0;\n',
              '  Timer? _promptTimer;\n  int _promptIndex = 0;\n  late final AnimationController _shineController;\n',
              1,
          )
          s = s.replace(
              '  void initState() {\n    super.initState();\n    _startPromptRotation();\n  }',
              '''  void initState() {\n    super.initState();\n    _shineController = AnimationController(\n      vsync: this,\n      duration: const Duration(milliseconds: 2400),\n    )..repeat();\n    _startPromptRotation();\n  }''',
              1,
          )
          s = s.replace(
              '  void dispose() {\n    _promptTimer?.cancel();\n    super.dispose();\n  }',
              '''  void dispose() {\n    _promptTimer?.cancel();\n    _shineController.dispose();\n    super.dispose();\n  }''',
              1,
          )
          old = '''                              child: AnimatedSwitcher(\n                                duration: const Duration(milliseconds: 360),\n                                switchInCurve: Curves.easeOutCubic,\n                                switchOutCurve: Curves.easeInCubic,\n                                transitionBuilder: (child, animation) {\n                                  final slide = Tween<Offset>(\n                                    begin: const Offset(0, .12),\n                                    end: Offset.zero,\n                                  ).animate(animation);\n                                  return FadeTransition(\n                                    opacity: animation,\n                                    child: SlideTransition(\n                                      position: slide,\n                                      child: child,\n                                    ),\n                                  );\n                                },\n                                child: Text(\n                                  displayHint,\n                                  key: ValueKey(_promptIndex),\n                                  maxLines: 1,\n                                  overflow: TextOverflow.ellipsis,\n                                  style: GoogleFonts.plusJakartaSans(\n                                    color: ink.withAlpha(145),\n                                    fontWeight: FontWeight.w600,\n                                    fontSize: 15,\n                                  ),\n                                ),\n                              ),'''
          new = '''                              child: AnimatedSwitcher(\n                                duration: const Duration(milliseconds: 650),\n                                reverseDuration: const Duration(milliseconds: 420),\n                                switchInCurve: Curves.easeOutCubic,\n                                switchOutCurve: Curves.easeInCubic,\n                                transitionBuilder: (child, animation) {\n                                  final slide = Tween<Offset>(\n                                    begin: const Offset(0, .18),\n                                    end: Offset.zero,\n                                  ).animate(animation);\n                                  final scale = Tween<double>(\n                                    begin: .985,\n                                    end: 1,\n                                  ).animate(animation);\n                                  return FadeTransition(\n                                    opacity: animation,\n                                    child: SlideTransition(\n                                      position: slide,\n                                      child: ScaleTransition(\n                                        scale: scale,\n                                        alignment: Alignment.centerLeft,\n                                        child: child,\n                                      ),\n                                    ),\n                                  );\n                                },\n                                child: AnimatedBuilder(\n                                  key: ValueKey(_promptIndex),\n                                  animation: _shineController,\n                                  child: Text(\n                                    displayHint,\n                                    maxLines: 1,\n                                    overflow: TextOverflow.ellipsis,\n                                    style: GoogleFonts.plusJakartaSans(\n                                      color: Colors.white,\n                                      fontWeight: FontWeight.w600,\n                                      fontSize: 15,\n                                      letterSpacing: .05,\n                                    ),\n                                  ),\n                                  builder: (context, child) {\n                                    final sweep = _shineController.value;\n                                    return ShaderMask(\n                                      blendMode: BlendMode.srcIn,\n                                      shaderCallback: (bounds) {\n                                        final x = -1.8 + (sweep * 3.6);\n                                        return LinearGradient(\n                                          begin: Alignment(x - .8, 0),\n                                          end: Alignment(x + .8, 0),\n                                          colors: [\n                                            ink.withAlpha(135),\n                                            const Color(0xFF93C5FD),\n                                            Colors.white,\n                                            const Color(0xFF60A5FA),\n                                            ink.withAlpha(135),\n                                          ],\n                                          stops: const [0, .32, .5, .68, 1],\n                                        ).createShader(bounds);\n                                      },\n                                      child: child,\n                                    );\n                                  },\n                                ),\n                              ),'''
          if old not in s:
              raise SystemExit('GlowSearchBar transition anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Mapbox: create annotation managers only after style load and make controls clear.
          p = Path('lib/src/features/map/presentation/screens/real_mapbox_screen.dart')
          s = p.read_text()

          old_setup = '''  Future<void> _setupMap(MapboxMap map) async {\n    _map = map;\n    _listingManager = await map.annotations.createCircleAnnotationManager();\n    _peopleManager = await map.annotations.createCircleAnnotationManager();\n\n    _listingManager?.tapEvents(onTap: (annotation) {\n      final p = annotation.geometry.coordinates;\n      _selectNearest(p.lat.toDouble(), p.lng.toDouble(), listingOnly: true);\n    });\n    _peopleManager?.tapEvents(onTap: (annotation) {\n      final p = annotation.geometry.coordinates;\n      _selectNearest(p.lat.toDouble(), p.lng.toDouble(), peopleOnly: true);\n    });\n\n    await _flyTo(ref.read(discoveryLocationProvider));\n  }'''
          new_setup = '''  Future<void> _setupMap(MapboxMap map) async {\n    _map = map;\n    await _flyTo(ref.read(discoveryLocationProvider));\n  }\n\n  Future<void> _prepareAnnotationManagers() async {\n    final map = _map;\n    if (map == null) return;\n\n    // Creating annotation managers before the Mapbox style finishes loading\n    // can leave them attached to the old style on web. Build them here instead.\n    _listingManager = await map.annotations.createCircleAnnotationManager();\n    _peopleManager = await map.annotations.createCircleAnnotationManager();\n\n    _listingManager?.tapEvents(onTap: (annotation) {\n      final p = annotation.geometry.coordinates;\n      _selectNearest(p.lat.toDouble(), p.lng.toDouble(), listingOnly: true);\n    });\n    _peopleManager?.tapEvents(onTap: (annotation) {\n      final p = annotation.geometry.coordinates;\n      _selectNearest(p.lat.toDouble(), p.lng.toDouble(), peopleOnly: true);\n    });\n  }'''
          if old_setup not in s:
              raise SystemExit('Map setup anchor not found')
          s = s.replace(old_setup, new_setup, 1)

          s = s.replace('circleRadius: 7.0,', 'circleRadius: 10.0,', 1)
          s = s.replace('circleStrokeWidth: 1.5,', 'circleStrokeWidth: 2.4,', 1)
          s = s.replace('circleRadius: 6.5,', 'circleRadius: 9.0,', 1)
          s = s.replace('circleStrokeWidth: 1.4,', 'circleStrokeWidth: 2.2,', 1)

          old_loaded = '''            onMapLoadedListener: (_) async {\n              _mapLoaded = true;\n              await _renderAnnotations();\n            },'''
          new_loaded = '''            onMapLoadedListener: (_) async {\n              _mapLoaded = true;\n              await _prepareAnnotationManagers();\n              await _renderAnnotations();\n            },'''
          if old_loaded not in s:
              raise SystemExit('Map loaded anchor not found')
          s = s.replace(old_loaded, new_loaded, 1)

          old_city_button = '''                    _GlassMapButton(\n                      icon: Icons.search_rounded,\n                      onTap: () => setState(() => _citiesOpen = !_citiesOpen),\n                    ),'''
          new_city_button = '''                    _GlassMapLabelButton(\n                      icon: Icons.location_city_rounded,\n                      label: 'CITIES',\n                      selected: _citiesOpen,\n                      onTap: () => setState(() => _citiesOpen = !_citiesOpen),\n                    ),'''
          if old_city_button not in s:
              raise SystemExit('Cities button anchor not found')
          s = s.replace(old_city_button, new_city_button, 1)

          old_layer_children = '''              _LayerChoice(\n                icon: Icons.layers_rounded,\n                active: value == 'all',\n                onTap: () => onChanged('all'),\n              ),\n              _LayerChoice(\n                icon: Icons.home_rounded,\n                active: value == 'listings',\n                badge: listingCount,\n                onTap: () => onChanged('listings'),\n              ),\n              _LayerChoice(\n                icon: Icons.people_alt_rounded,\n                active: value == 'people',\n                badge: peopleCount,\n                onTap: () => onChanged('people'),\n              ),'''
          new_layer_children = '''              _LayerChoice(\n                label: 'ALL',\n                active: value == 'all',\n                onTap: () => onChanged('all'),\n              ),\n              _LayerChoice(\n                label: 'LISTINGS',\n                active: value == 'listings',\n                badge: listingCount,\n                onTap: () => onChanged('listings'),\n              ),\n              _LayerChoice(\n                label: 'USERS',\n                active: value == 'people',\n                badge: peopleCount,\n                onTap: () => onChanged('people'),\n              ),'''
          if old_layer_children not in s:
              raise SystemExit('Layer choices anchor not found')
          s = s.replace(old_layer_children, new_layer_children, 1)

          old_layer_class = '''class _LayerChoice extends StatelessWidget {\n  const _LayerChoice({\n    required this.icon,\n    required this.active,\n    required this.onTap,\n    this.badge,\n  });\n\n  final IconData icon;\n  final bool active;\n  final VoidCallback onTap;\n  final int? badge;'''
          new_layer_class = '''class _LayerChoice extends StatelessWidget {\n  const _LayerChoice({\n    required this.label,\n    required this.active,\n    required this.onTap,\n    this.badge,\n  });\n\n  final String label;\n  final bool active;\n  final VoidCallback onTap;\n  final int? badge;'''
          if old_layer_class not in s:
              raise SystemExit('Layer class anchor not found')
          s = s.replace(old_layer_class, new_layer_class, 1)

          old_icon = '''                Icon(icon, color: Colors.white, size: 17),\n                if (badge != null) ...['''
          new_icon = '''                Text(\n                  label,\n                  style: GoogleFonts.plusJakartaSans(\n                    color: Colors.white,\n                    fontSize: 8.5,\n                    fontWeight: FontWeight.w900,\n                    letterSpacing: .55,\n                  ),\n                ),\n                if (badge != null) ...['''
          if old_icon not in s:
              raise SystemExit('Layer icon render anchor not found')
          s = s.replace(old_icon, new_icon, 1)

          marker = 'class _RangePill extends StatelessWidget {'
          if marker not in s:
              raise SystemExit('Range pill marker not found')
          label_class = '''class _GlassMapLabelButton extends StatelessWidget {\n  const _GlassMapLabelButton({\n    required this.icon,\n    required this.label,\n    required this.onTap,\n    this.selected = false,\n  });\n\n  final IconData icon;\n  final String label;\n  final VoidCallback onTap;\n  final bool selected;\n\n  @override\n  Widget build(BuildContext context) {\n    return ClipRRect(\n      borderRadius: BorderRadius.circular(999),\n      child: BackdropFilter(\n        filter: ImageFilter.blur(sigmaX: 18, sigmaY: 18),\n        child: Material(\n          color: selected\n              ? Colors.white.withAlpha(210)\n              : Colors.black.withAlpha(72),\n          child: InkWell(\n            onTap: onTap,\n            child: Container(\n              height: 40,\n              padding: const EdgeInsets.symmetric(horizontal: 12),\n              decoration: BoxDecoration(\n                borderRadius: BorderRadius.circular(999),\n                border: Border.all(\n                  color: Colors.white.withAlpha(selected ? 220 : 62),\n                  width: .7,\n                ),\n              ),\n              child: Row(\n                mainAxisSize: MainAxisSize.min,\n                children: [\n                  Icon(\n                    icon,\n                    color: selected ? const Color(0xFF111318) : Colors.white,\n                    size: 16,\n                  ),\n                  const SizedBox(width: 6),\n                  Text(\n                    label,\n                    style: GoogleFonts.plusJakartaSans(\n                      color: selected ? const Color(0xFF111318) : Colors.white,\n                      fontSize: 9.5,\n                      fontWeight: FontWeight.w900,\n                      letterSpacing: .65,\n                    ),\n                  ),\n                ],\n              ),\n            ),\n          ),\n        ),\n      ),\n    );\n  }\n}\n\n'''
          s = s.replace(marker, label_class + marker, 1)
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed files
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/map/presentation/screens/real_mapbox_screen.dart
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build release web
        run: flutter build web --release
      - name: Commit verified files
        shell: bash
        run: |
          rm -f .github/workflows/tmp_map_ai_polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/map/presentation/screens/real_mapbox_screen.dart .github/workflows/tmp_map_ai_polish.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(map): show live pins and polish AI search shine"
          git push origin HEAD:fix/map-markers-ai-shine
