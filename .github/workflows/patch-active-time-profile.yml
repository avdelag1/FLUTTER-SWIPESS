name: Patch active-time reward panel

on:
  push:
    branches:
      - fix/active-time-profile-panel
    paths:
      - .github/workflows/patch-active-time-profile.yml

permissions:
  contents: write

jobs:
  patch-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-time-profile-panel
          fetch-depth: 0

      - name: Replace Daily Quests panel with Active Rewards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/profile/presentation/screens/profile_screen.dart')
          text = path.read_text()

          import_anchor = "import 'package:flutter_swipes/src/features/payments/presentation/widgets/tokens_modal.dart';\n"
          reward_import = "import 'package:flutter_swipes/src/features/gamification/presentation/widgets/engagement_reward_card.dart';\n"
          if reward_import not in text:
              if import_anchor not in text:
                  raise SystemExit('tokens modal import anchor not found')
              text = text.replace(import_anchor, import_anchor + reward_import, 1)

          old = """                      // Daily Quests
                      _Panel(
                        child: _DailyQuests(
                          expanded: _questsOpen,
                          onToggle: () =>
                              setState(() => _questsOpen = !_questsOpen),
                        ),
                      ),
"""
          new = """                      // Active-time loyalty: automatic progress, no claims.
                      const _Panel(
                        child: EngagementRewardCard(),
                      ),
"""
          if old not in text:
              raise SystemExit('Daily Quests profile block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit profile patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "swipess-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-active-time-profile.yml
          git add lib/src/features/profile/presentation/screens/profile_screen.dart
          git commit -m "feat: replace Daily Quests with active-time rewards"
          git push origin HEAD:fix/active-time-profile-panel
