name: Patch video editor entry points

on:
  push:
    paths:
      - '.github/workflows/patch-video-editor-entrypoints.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make trim editor full-screen everywhere
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entry_files = [
              Path('lib/src/features/add/presentation/screens/add_listing_screen.dart'),
              Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart'),
          ]
          old_nav = "final cropped = await Navigator.of(context).push<XFile>("
          new_nav = "final cropped = await Navigator.of(context, rootNavigator: true).push<XFile>("
          for path in entry_files:
              text = path.read_text()
              nav_count = text.count(old_nav)
              if nav_count == 0 and new_nav not in text:
                  raise SystemExit(f'{path}: video cropper navigation call not found')
              text = text.replace(old_nav, new_nav)
              text = text.replace(
                  "'1 video · trim to 10s'",
                  "'1 video · trim 5 / 10 / 15 / 20s'",
              )
              path.write_text(text)
              print(f'{path}: full-screen editor entry points ready')

          cropper = Path('lib/src/features/camera/presentation/screens/video_cropper_screen.dart')
          text = cropper.read_text()
          if "package:get_thumbnail_video/index.dart" not in text:
              text = text.replace(
                  "import 'package:get_thumbnail_video/video_thumbnail.dart';",
                  "import 'package:get_thumbnail_video/index.dart';\nimport 'package:get_thumbnail_video/video_thumbnail.dart';",
              )

          text = text.replace(
              'timelineViewportSeconds',
              'VideoCropperScreen.timelineViewportSeconds',
          )
          text = text.replace(
              'static const VideoCropperScreen.timelineViewportSeconds = 60.0;',
              'static const timelineViewportSeconds = 60.0;',
          )

          replacements = {
              "final frameCount = math.max(\n      1,\n      math.min(120, (_duration / VideoTrimSelection.stepSeconds).ceil()),\n    );": "final frameCount = math.max(\n      1,\n      math.min(120, (_duration / VideoTrimSelection.stepSeconds).ceil()),\n    ).toInt();",
              "target = math.max(0, left - 20);": "target = math.max(0.0, left - 20).toDouble();",
              "target = math.min(\n          _timelineScroll.position.maxScrollExtent,\n          right - viewport + 20,\n        );": "target = math.min(\n          _timelineScroll.position.maxScrollExtent,\n          right - viewport + 20,\n        ).toDouble();",
              "final viewportWidth = math.max(1.0, constraints.maxWidth);": "final viewportWidth = math.max(1.0, constraints.maxWidth).toDouble();",
              "? math.max(0.1, _duration)": "? math.max(0.1, _duration).toDouble()",
              "final totalWidth = math.max(viewportWidth, _duration * pixelsPerSecond);": "final totalWidth = math.max(viewportWidth, _duration * pixelsPerSecond).toDouble();",
              "final selectionWidth = math.max(\n          1.0,\n          _selection.length * pixelsPerSecond,\n        );": "final selectionWidth = math.max(\n          1.0,\n          _selection.length * pixelsPerSecond,\n        ).toDouble();",
              "final x = position.clamp(0.0, _duration) * pixelsPerSecond;": "final x = position.clamp(0.0, _duration).toDouble() * pixelsPerSecond;",
              "left: x.clamp(0.0, math.max(0, totalWidth - 2)),": "left: x.clamp(0.0, math.max(0.0, totalWidth - 2)).toDouble(),",
              "final segmentCount = math.max(\n      1,\n      (_duration / VideoTrimSelection.stepSeconds).ceil(),\n    );": "final segmentCount = math.max(\n      1,\n      (_duration / VideoTrimSelection.stepSeconds).ceil(),\n    ).toInt();",
              "width: math.max(\n              1,": "width: math.max(\n              1.0,",
              "            ),\n            child: _TimelineFrame(": "            ).toDouble(),\n            child: _TimelineFrame(",
              "final value = math.max(0, seconds.round());": "final value = math.max(0, seconds.round()).toInt();",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          cropper.write_text(text)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/src/features/camera/presentation/screens/video_cropper_screen.dart lib/src/features/camera/domain/video_trim_selection.dart lib/src/features/add/presentation/screens/add_listing_screen.dart lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart test/video_trim_selection_test.dart
      - name: Verify snapped trim math
        run: flutter test test/video_trim_selection_test.dart
      - name: Analyze editor files
        run: >-
          flutter analyze --no-fatal-warnings --no-fatal-infos
          lib/src/features/camera/presentation/screens/video_cropper_screen.dart
          lib/src/features/camera/domain/video_trim_selection.dart
          lib/src/features/camera/data/video_recut_io.dart
          lib/src/features/camera/data/video_recut_html.dart
          test/video_trim_selection_test.dart
      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-video-editor-entrypoints.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Make video trim editor full-screen with snapped timeline'
            git push origin main
          fi
