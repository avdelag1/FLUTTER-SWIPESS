name: One-time Virtual ID editor and avatar fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[vap-avatar-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --rebase origin main

      - name: Apply Virtual ID and avatar fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1, required=True):
              p = Path(path)
              if not p.exists():
                  if required:
                      raise SystemExit(f'Missing file: {path}')
                  return False
              text = p.read_text()
              if old not in text:
                  if required:
                      raise SystemExit(f'Patch target missing in {path}: {old[:100]!r}')
                  print(f'skip already patched: {path}')
                  return False
              p.write_text(text.replace(old, new, count))
              print(f'patched {path}')
              return True

          # Root-level Virtual ID editor route: avoids the dashboard shell swallowing
          # the pencil handoff from the persistent navigation-card overlay.
          router = 'lib/src/core/routing/app_router.dart'
          patch(
              router,
              "          if (location == AppPaths.clientVapId && !tier.canUseVirtualCard) {\n            return AppPaths.subscriptionPackages;\n          }",
              "          if ((location == AppPaths.clientVapId ||\n                  location == AppPaths.clientVapIdEdit) &&\n              !tier.canUseVirtualCard) {\n            return AppPaths.subscriptionPackages;\n          }",
          )
          patch(
              router,
              "      GoRoute(\n        path: '/vap-validate/:id',\n        builder: (ctx, state) =>\n            VapValidateScreen(userId: state.pathParameters['id']),\n      ),",
              "      GoRoute(\n        path: '/vap-validate/:id',\n        builder: (ctx, state) =>\n            VapValidateScreen(userId: state.pathParameters['id']),\n      ),\n      GoRoute(\n        path: AppPaths.clientVapIdEdit,\n        builder: (ctx, _) => const VapIdScreen(initialEdit: true),\n      ),",
          )

          screen = 'lib/src/features/profile/presentation/screens/vap_id_screen.dart'
          patch(
              screen,
              "class VapIdScreen extends ConsumerStatefulWidget {\n  const VapIdScreen({super.key});\n\n  @override",
              "class VapIdScreen extends ConsumerStatefulWidget {\n  const VapIdScreen({super.key, this.initialEdit = false});\n\n  final bool initialEdit;\n\n  @override",
          )
          patch(
              screen,
              "              final editRequested =\n                  GoRouterState.of(context).uri.queryParameters['edit'] == '1';",
              "              final editRequested =\n                  widget.initialEdit ||\n                  GoRouterState.of(context).uri.queryParameters['edit'] == '1';",
          )

          modal = 'lib/src/features/profile/presentation/widgets/vap_id_modal.dart'
          patch(
              modal,
              "  Future<void> _edit(WidgetRef ref) async {\n    AppHaptics.selection();\n    ref.read(overlayModalsProvider.notifier).closeVapId();\n    await Future<void>.delayed(const Duration(milliseconds: 70));\n    await ref\n        .read(appRouterProvider)\n        .push<void>('${AppPaths.clientVapId}?edit=1');\n  }",
              "  void _edit(WidgetRef ref) {\n    AppHaptics.selection();\n    final router = ref.read(appRouterProvider);\n    ref.read(overlayModalsProvider.notifier).closeVapId();\n    router.go(AppPaths.clientVapIdEdit);\n  }",
          )

          # The Virtual ID must use its own photo. If none exists, show an original
          # deterministic FunAvatar rather than the user's profile photo or initial.
          model = 'lib/src/features/profile/domain/models/vap_id_card.dart'
          patch(
              model,
              "  String? get displayPhotoUrl {\n    final id = idPhotoUrl?.trim();\n    if (id != null && id.isNotEmpty) return id;\n    final profile = avatarUrl?.trim();\n    return profile != null && profile.isNotEmpty ? profile : null;\n  }",
              "  String? get displayPhotoUrl {\n    final id = idPhotoUrl?.trim();\n    return id != null && id.isNotEmpty ? id : null;\n  }",
          )

          card = 'lib/src/features/profile/presentation/widgets/themed_vap_card.dart'
          patch(
              card,
              "import 'package:flutter_riverpod/flutter_riverpod.dart';",
              "import 'package:flutter_riverpod/flutter_riverpod.dart';\nimport 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';",
          )
          patch(
              card,
              "class _Initials extends StatelessWidget {\n  const _Initials({required this.data, required this.theme});\n\n  final VapIdCard data;\n  final VapCardTheme theme;\n\n  @override\n  Widget build(BuildContext context) => ColoredBox(\n    color: theme.tagBg,\n    child: Center(\n      child: Text(\n        data.displayName.isNotEmpty ? data.displayName[0].toUpperCase() : '?',\n        style: GoogleFonts.plusJakartaSans(\n          fontSize: 44,\n          fontWeight: FontWeight.w900,\n          color: theme.accent,\n        ),\n      ),\n    ),\n  );\n}",
              "class _Initials extends StatelessWidget {\n  const _Initials({required this.data, required this.theme});\n\n  final VapIdCard data;\n  final VapCardTheme theme;\n\n  @override\n  Widget build(BuildContext context) => ColoredBox(\n    color: theme.tagBg,\n    child: Center(\n      child: FunAvatar(\n        seed: data.userId.isNotEmpty ? data.userId : data.displayName,\n        size: 100,\n        semanticLabel: 'Temporary Virtual ID avatar',\n      ),\n    ),\n  );\n}",
          )

          # Current profile fallback: only a Swipess-uploaded profile image counts as
          # a real profile photo. Auth metadata no longer blocks the FunAvatar fallback.
          repo = 'lib/src/features/profile/data/repositories/profile_repository.dart'
          patch(
              repo,
              "          avatarUrl: imageList.isNotEmpty\n              ? imageList.first.toString()\n              : user.userMetadata?['avatar_url'] as String?,",
              "          avatarUrl: imageList.isNotEmpty\n              ? imageList.first.toString()\n              : null,",
          )
          patch(
              repo,
              "      avatarUrl: user.userMetadata?['avatar_url'] as String?,",
              "      avatarUrl: null,",
          )

          # Remove this one-time workflow from the resulting tree.
          Path('.github/workflows/one_time_virtual_id_avatar_fix.yml').unlink(missing_ok=True)
          PY

      - name: Commit directly to main
        run: |
          git config user.name "Swipess Virtual ID Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing pending"
            exit 0
          fi
          git commit -m "fix: open Virtual ID editor and enforce fun avatars [vap-avatar-fix]"
          git pull --rebase origin main
          git push origin HEAD:main
