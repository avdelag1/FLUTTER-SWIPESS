name: Fix Studio image clock

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - '.github/workflows/fix-studio-image-clock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0
      - name: Give every still image a real 30fps input clock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('api/studio-render.js')
          text = path.read_text()
          old = "  const inputs = [];\n  for (const path of imagePaths) inputs.push('-i', path);\n  inputs.push('-stream_loop', '-1', '-i', audioPath);"
          new = "  const inputs = [];\n  for (let i = 0; i < imagePaths.length; i += 1) {\n    // image2 stills have no meaningful frame-rate metadata unless we provide\n    // one. xfade requires every input to be CFR, so loop each source photo\n    // on an explicit 30fps clock and bound it slightly beyond its shot.\n    inputs.push(\n      '-loop', '1',\n      '-framerate', String(OUTPUT_FPS),\n      '-t', (shots[i].duration + 0.25).toFixed(3),\n      '-i', imagePaths[i],\n    );\n  }\n  inputs.push('-stream_loop', '-1', '-i', audioPath);"
          if old not in text:
              raise SystemExit('studio render input block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit renderer clock fix
        run: |
          if git diff --quiet; then
            echo "Renderer clock fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/studio-render.js
          git commit -m "fix(studio): give still images a CFR input clock"
          git push origin HEAD:feat/studio-photo-video
