name: Fix Studio image clock

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - '.github/workflows/fix-studio-image-clock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0
      - name: Replace direct still-image xfade with CFR clip pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('api/studio-render.js')
          text = renderer.read_text()

          start = text.index('function buildFilter(shots) {')
          end = text.index('\nfunction seededRandom', start)
          replacement = r'''function buildShotFilter(shot) {
  const frames = Math.max(2, Math.round(shot.duration * OUTPUT_FPS));
  const t = `min(1,on/${Math.max(1, frames - 1)})`;
  const eased = easingExpr(shot.easing, t);
  const zoom = lerpExpr(shot.startScale, shot.endScale, eased);
  const travelX = lerpExpr(shot.startX, shot.endX, eased);
  const travelY = lerpExpr(shot.startY, shot.endY, eased);
  const x = `max(0,min(iw-iw/zoom,iw/2-(iw/zoom/2)+(${travelX})*(iw-iw/zoom)))`;
  const y = `max(0,min(ih-ih/zoom,ih/2-(ih/zoom/2)+(${travelY})*(ih-ih/zoom)))`;
  const cropX = `min(max(iw*${shot.focalX.toFixed(6)}-ow/2,0),iw-ow)`;
  const cropY = `min(max(ih*${shot.focalY.toFixed(6)}-oh/2,0),ih-oh)`;
  return (
    `scale=1350:2400:force_original_aspect_ratio=increase,` +
    `crop=1350:2400:x='${cropX}':y='${cropY}',` +
    `setsar=1,` +
    `zoompan=z='${zoom}':x='${x}':y='${y}':d=1:` +
    `s=${OUTPUT_WIDTH}x${OUTPUT_HEIGHT}:fps=${OUTPUT_FPS},` +
    `fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
    `setpts=N,format=yuv420p`
  );
}

function buildFilter(shots) {
  const filters = [];
  for (let i = 0; i < shots.length; i += 1) {
    filters.push(
      `[${i}:v]fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
        `setpts=PTS-STARTPTS,setsar=1,format=yuv420p[v${i}]`,
    );
  }

  let active = 'v0';
  let timeline = shots[0].duration;
  for (let i = 1; i < shots.length; i += 1) {
    const previous = shots[i - 1];
    const duration = previous.transition === 'hardCut'
      ? .04
      : Math.min(previous.transitionDuration, previous.duration * .35, shots[i].duration * .35);
    const offset = Math.max(.01, timeline - duration);
    const out = `mix${i}`;
    filters.push(
      `[${active}][v${i}]xfade=transition=${transitionName(previous.transition)}:` +
        `duration=${duration.toFixed(3)}:offset=${offset.toFixed(3)}[${out}]`,
    );
    active = out;
    timeline += shots[i].duration - duration;
  }
  filters.push(`[${active}]fps=${OUTPUT_FPS},format=yuv420p[vout]`);
  return { filter: filters.join(';'), duration: timeline };
}
'''
          text = text[:start] + replacement + text[end:]

          start = text.index('async function renderVideo(')
          end = text.index('\nasync function makePoster', start)
          replacement = r'''async function renderShotClip(imagePath, shot, outputPath) {
  await runFfmpeg([
    '-hide_banner',
    '-loglevel',
    'error',
    '-y',
    '-loop',
    '1',
    '-framerate',
    String(OUTPUT_FPS),
    '-i',
    imagePath,
    '-t',
    shot.duration.toFixed(3),
    '-vf',
    buildShotFilter(shot),
    '-an',
    '-r',
    String(OUTPUT_FPS),
    '-fps_mode',
    'cfr',
    '-c:v',
    'libx264',
    '-preset',
    'ultrafast',
    '-crf',
    '18',
    '-pix_fmt',
    'yuv420p',
    '-g',
    '60',
    '-keyint_min',
    '60',
    '-sc_threshold',
    '0',
    outputPath,
  ], 120000);
}

async function renderVideo(imagePaths, shots, audioPath, outputPath) {
  const clipId = randomUUID();
  const clipPaths = imagePaths.map((_, index) =>
    join(tmpdir(), `studio-shot-${clipId}-${index}.mp4`),
  );

  try {
    // Render each still into a real CFR30 video clip first. xfade then receives
    // actual video streams with stable frame-rate metadata instead of image2's
    // 1/0 clock, which is rejected by modern FFmpeg builds.
    for (let i = 0; i < imagePaths.length; i += 1) {
      await renderShotClip(imagePaths[i], shots[i], clipPaths[i]);
    }

    const inputs = [];
    for (const path of clipPaths) inputs.push('-i', path);
    inputs.push('-stream_loop', '-1', '-i', audioPath);
    const { filter, duration } = buildFilter(shots);
    await runFfmpeg([
      '-hide_banner',
      '-loglevel',
      'error',
      '-y',
      ...inputs,
      '-filter_complex',
      filter,
      '-map',
      '[vout]',
      '-map',
      `${clipPaths.length}:a:0`,
      '-t',
      duration.toFixed(3),
      '-r',
      String(OUTPUT_FPS),
      '-fps_mode',
      'cfr',
      '-c:v',
      'libx264',
      '-preset',
      'veryfast',
      '-profile:v',
      'high',
      '-level:v',
      '4.0',
      '-pix_fmt',
      'yuv420p',
      '-crf',
      '21',
      '-maxrate',
      '6000k',
      '-bufsize',
      '12000k',
      '-g',
      '60',
      '-keyint_min',
      '60',
      '-sc_threshold',
      '0',
      '-c:a',
      'aac',
      '-b:a',
      '128k',
      '-ar',
      '48000',
      '-ac',
      '2',
      '-movflags',
      '+faststart',
      outputPath,
    ]);
    return duration;
  } finally {
    await Promise.allSettled(clipPaths.map((path) => rm(path, { force: true })));
  }
}
'''
          text = text[:start] + replacement + text[end:]
          renderer.write_text(text)

          smoke = Path('test/studio_renderer_smoke_test.mjs')
          test = smoke.read_text()
          test = test.replace(
              'export { buildFilter, buildSoundtrackWav, renderVideo };',
              'export { buildShotFilter, buildFilter, buildSoundtrackWav, renderVideo };',
          )
          old = "  const built = mod.buildFilter(shots);\n  if (!built.filter.includes('zoompan=') || !built.filter.includes('xfade=')) {\n    throw new Error('Studio filter graph is missing motion or transitions');\n  }"
          new = "  const shotFilter = mod.buildShotFilter(shots[0]);\n  const built = mod.buildFilter(shots);\n  if (!shotFilter.includes('zoompan=') || !built.filter.includes('xfade=')) {\n    throw new Error('Studio pipeline is missing motion or transitions');\n  }"
          if old not in test:
              raise SystemExit('studio smoke assertion block not found')
          smoke.write_text(test.replace(old, new, 1))
          PY
      - name: Install renderer dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove the real renderer before committing
        run: |
          node --check api/studio-render.js
          node test/studio_renderer_smoke_test.mjs
      - name: Commit proven two-pass renderer
        run: |
          if git diff --quiet; then
            echo "Two-pass renderer already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/studio-render.js test/studio_renderer_smoke_test.mjs
          git commit -m "fix(studio): render motion clips before transitions"
          git push origin HEAD:feat/studio-photo-video
