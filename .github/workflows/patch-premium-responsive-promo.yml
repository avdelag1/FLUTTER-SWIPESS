name: Patch premium responsive promo

on:
  push:
    branches: [main]
    paths:
      - '.github/premium-responsive-promo-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply patch
        run: python3 .github/patches/premium_responsive_promo.py

      - name: Verify patch shape
        run: |
          grep -q "LIMITED 2-FOR-1" lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart
          grep -q "MediaQuery.sizeOf(context).width >= 700 ? 34 : 12" lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart
          grep -q "launchClaimed: claimed" lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v4.dart

      - name: Commit patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-premium-responsive-promo.yml
          git rm .github/premium-responsive-promo-trigger
          git rm .github/patches/premium_responsive_promo.py
          git add lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v3.dart
          git add lib/src/features/subscriptions/presentation/screens/subscription_packages_screen_v4.dart
          git commit -m 'Fix premium header spacing and show 2-for-1 on plans'
          git push origin main
