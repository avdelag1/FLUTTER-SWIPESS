name: Apply dashboard media refresh and marquee fixes

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-media-refresh-marquee-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch dashboard behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: target not found in {path}')
              write(path, text.replace(old, new, 1))

          # 1) Events teaser: autoplay muted, advance continuously, pause only
          # while another quick-filter video owns playback, then resume.
          events = 'lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart'
          replace_once(
              events,
              '  bool _videoPreviewEnabled = false;\n',
              '  bool _videoPreviewEnabled = true;\n',
              'events autoplay default',
          )
          replace_once(
              events,
              """  void _resumeAfterListingPreview() {
            if (!_externallyPaused) return;
            _externallyPaused = false;
            // Never resume Events automatically; only the user's Play tap may start it.
          }
          """,
              """  void _resumeAfterListingPreview() {
            if (!_externallyPaused) return;
            _externallyPaused = false;
            if (_canPlay) unawaited(_resumePlayback());
          }
          """,
              'events resume after listing',
          )
          replace_once(
              events,
              """      if (value.position > Duration.zero && remainingMs <= 180) {
                _completionQueued = true;
                unawaited(controller.pause());
              }
          """,
              """      if (value.position > Duration.zero && remainingMs <= 180) {
                _completionQueued = true;
                unawaited(_advance(1));
              }
          """,
              'events continuous advance',
          )
          replace_once(
              events,
              """    _switching = true;
            // Navigation is user-driven and the newly selected event stays paused.
            if (_videoPreviewEnabled && mounted) {
              setState(() => _videoPreviewEnabled = false);
            }
            try {
          """,
              """    _switching = true;
            try {
          """,
              'events manual navigation stays live',
          )

          # 2) Refresh: invalidate AND await fresh dashboard datasets so the
          # PWA pull gesture cannot finish while cards are still showing stale data.
          refresh = 'lib/src/core/performance/app_refresh_service.dart'
          text = read(refresh)
          start = text.index('  static Future<void> refreshDashboardContainer(')
          end = text.index('\n  static Future<void> refreshDashboardSilently', start)
          new_fn = """  static Future<void> refreshDashboardContainer(
            ProviderContainer container, {
            bool haptic = true,
          }) async {
            final startedAt = DateTime.now();
            if (haptic) AppHaptics.selection();

            const listingCategories = <String>[
              'property',
              'services',
              'yacht',
              'motorcycle',
              'bicycle',
            ];
            const peopleCategories = <String>['buyers', 'renters', 'seekers'];

            container.invalidate(newItemsCountProvider);
            container.invalidate(eventsListProvider);
            container.invalidate(dashboardVideoEventsProvider);
            container.invalidate(swipeListingsProvider);
            for (final category in listingCategories) {
              container.invalidate(quickFilterPreviewListingsProvider(category));
            }
            for (final category in peopleCategories) {
              container.invalidate(quickFilterPeoplePreviewProvider(category));
            }

            await Future.wait<void>([
              _safe(() => container.read(eventsListProvider.notifier).refresh()),
              _safe(() async {
                await container.read(newItemsCountProvider.future);
              }),
              _safe(() async {
                await container.read(dashboardVideoEventsProvider.future);
              }),
              for (final category in listingCategories)
                _safe(() async {
                  await container.read(
                    quickFilterPreviewListingsProvider(category).future,
                  );
                }),
              for (final category in peopleCategories)
                _safe(() async {
                  await container.read(
                    quickFilterPeoplePreviewProvider(category).future,
                  );
                }),
              _safe(() => AppPerformanceBootstrap.warmInteractiveSurfaces(container)),
            ]);

            // Keep the native/PWA pull animation visible long enough to read as
            // a deliberate refresh instead of a broken one-frame bounce.
            const minimumVisible = Duration(milliseconds: 420);
            final elapsed = DateTime.now().difference(startedAt);
            if (elapsed < minimumVisible) {
              await Future<void>.delayed(minimumVisible - elapsed);
            }
          }
          """
          text = text[:start] + new_fn + text[end:]
          write(refresh, text)

          # 3) Header AI prompt: compact phone text + real left-moving marquee.
          glow = 'lib/src/core/widgets/glow_search_bar.dart'
          replace_once(
              glow,
              """                            child: AnimatedSwitcher(
                                duration: const Duration(milliseconds: 380),
                                layoutBuilder: (currentChild, previousChildren) {
                                  return Stack(
                                    alignment: Alignment.centerLeft,
                                    children: <Widget>[
                                      ...previousChildren,
                                      if (currentChild != null) currentChild,
                                    ],
                                  );
                                },
                                child: Text(
                                  displayHint,
                                  key: ValueKey<String>(displayHint),
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: GoogleFonts.plusJakartaSans(
                                    color: ink.withAlpha(isLight ? 190 : 225),
                                    fontWeight: FontWeight.w600,
                                    fontSize: 14.5,
                                  ),
                                ),
                              ),
          """,
              """                            child: LayoutBuilder(
                                builder: (context, constraints) {
                                  final promptStyle = GoogleFonts.plusJakartaSans(
                                    color: ink.withAlpha(isLight ? 190 : 225),
                                    fontWeight: FontWeight.w600,
                                    fontSize: widget.compactHeader ? 11.0 : 14.0,
                                  );
                                  final painter = TextPainter(
                                    text: TextSpan(
                                      text: displayHint,
                                      style: promptStyle,
                                    ),
                                    maxLines: 1,
                                    textDirection: Directionality.of(context),
                                  )..layout();
                                  final travel = math.max(
                                    0.0,
                                    painter.width - constraints.maxWidth + 12,
                                  );
                                  final durationMs =
                                      (2800 + travel * 18)
                                          .round()
                                          .clamp(3200, 6500)
                                          .toInt();
                                  return ClipRect(
                                    child: TweenAnimationBuilder<double>(
                                      key: ValueKey<String>(displayHint),
                                      tween: Tween<double>(begin: 0, end: 1),
                                      duration: Duration(milliseconds: durationMs),
                                      curve: Curves.linear,
                                      builder: (context, progress, child) =>
                                          Transform.translate(
                                            offset: Offset(-travel * progress, 0),
                                            child: child,
                                          ),
                                      child: Text(
                                        displayHint,
                                        maxLines: 1,
                                        softWrap: false,
                                        overflow: TextOverflow.visible,
                                        style: promptStyle,
                                      ),
                                    ),
                                  );
                                },
                              ),
          """,
              'header prompt marquee',
          )

          # 4) Burger menu: use MenuAnchor overlay instead of PopupMenuRoute.
          # PopupMenuRoute made DashboardShell non-current and hid its own header.
          topbar = 'lib/src/core/widgets/app_top_bar.dart'
          text = read(topbar)
          anchor = """    final showDiscovery = isDashboard && discoveryActions.available;

            return Row(
          """
          if anchor not in text:
              raise SystemExit('topbar selection anchor not found')
          replacement = """    final showDiscovery = isDashboard && discoveryActions.available;

            void selectMenu(String value) {
              AppHaptics.selection();
              switch (value) {
                case 'tokens':
                  ref.read(overlayModalsProvider.notifier).closeAll();
                  showTokensPage(context);
                  break;
                case 'premium':
                  _openPremium(context, ref);
                  break;
                case 'theme':
                  ref.read(visualThemeProvider.notifier).toggle();
                  break;
                case 'notifications':
                  ref.read(overlayModalsProvider.notifier).closeAll();
                  showGlassModal(
                    context: context,
                    builder: (_) => const NotificationsScreen(),
                  );
                  break;
                case 'location':
                  discoveryActions.openLocation?.call();
                  break;
                case 'dates':
                  discoveryActions.openDates?.call();
                  break;
                case 'guests':
                  discoveryActions.openGuests?.call();
                  break;
                case 'filters':
                  ref.read(overlayModalsProvider.notifier).closeAll();
                  FilterBottomSheet.show(context);
                  break;
              }
            }

            return Row(
          """
          text = text.replace(anchor, replacement, 1)
          start = text.index('        PopupMenuButton<String>(')
          end_marker = """        ),
              ],
            );
          }
        }
          """
          end = text.index(end_marker, start)
          old_block = text[start:end + len('        ),')]
          menu = """        MenuAnchor(
              key: const ValueKey('header-menu'),
              alignmentOffset: const Offset(-216, 2),
              style: MenuStyle(
                backgroundColor: WidgetStatePropertyAll(
                  isLight ? Colors.white : const Color(0xFF171A20),
                ),
                elevation: const WidgetStatePropertyAll(14),
                shape: WidgetStatePropertyAll(
                  RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(22),
                  ),
                ),
                padding: const WidgetStatePropertyAll(
                  EdgeInsets.symmetric(vertical: 8),
                ),
              ),
              menuChildren: [
                if (showDiscovery) ...[
                  Padding(
                    padding: const EdgeInsets.fromLTRB(14, 5, 14, 3),
                    child: _HeaderMenuSection(label: 'DISCOVERY', ink: ink),
                  ),
                  MenuItemButton(
                    onPressed: () => selectMenu('location'),
                    child: _HeaderMenuRow(
                      icon: Icons.location_on_rounded,
                      label: 'Location',
                      trailing: discovery.city,
                      ink: ink,
                      accented: true,
                    ),
                  ),
                  MenuItemButton(
                    onPressed: () => selectMenu('dates'),
                    child: _HeaderMenuRow(
                      icon: Icons.calendar_month_rounded,
                      label: 'Dates',
                      trailing: discovery.dateLabel,
                      ink: ink,
                    ),
                  ),
                  MenuItemButton(
                    onPressed: () => selectMenu('guests'),
                    child: _HeaderMenuRow(
                      icon: Icons.group_rounded,
                      label: 'Guests',
                      trailing: discovery.guestsLabel,
                      ink: ink,
                    ),
                  ),
                  const Divider(height: 8),
                ],
                Padding(
                  padding: const EdgeInsets.fromLTRB(14, 5, 14, 3),
                  child: _HeaderMenuSection(label: 'ACCOUNT', ink: ink),
                ),
                MenuItemButton(
                  onPressed: () => selectMenu('tokens'),
                  child: _HeaderMenuRow(
                    icon: Icons.bolt_rounded,
                    label: 'Tokens',
                    trailing: tokensLabel,
                    ink: ink,
                    accented: true,
                  ),
                ),
                MenuItemButton(
                  onPressed: () => selectMenu('premium'),
                  child: _HeaderMenuRow(
                    icon: Icons.workspace_premium_rounded,
                    label: 'Premium',
                    ink: ink,
                  ),
                ),
                MenuItemButton(
                  onPressed: () => selectMenu('notifications'),
                  child: _HeaderMenuRow(
                    icon: Icons.notifications_none_rounded,
                    label: 'Notifications',
                    trailing: unreadCount > 0 ? '$unreadCount' : null,
                    ink: ink,
                  ),
                ),
                const Divider(height: 8),
                MenuItemButton(
                  onPressed: () => selectMenu('theme'),
                  child: _HeaderMenuRow(
                    icon: isLight
                        ? Icons.dark_mode_rounded
                        : Icons.light_mode_rounded,
                    label: isLight ? 'Dark mode' : 'Light mode',
                    ink: ink,
                  ),
                ),
                MenuItemButton(
                  onPressed: () => selectMenu('filters'),
                  child: _HeaderMenuRow(
                    icon: Icons.tune_rounded,
                    label: 'Filters',
                    ink: ink,
                  ),
                ),
              ],
              builder: (context, controller, child) => _HudButton(
                semanticLabel: 'Open menu',
                onTap: () {
                  AppHaptics.light();
                  if (controller.isOpen) {
                    controller.close();
                  } else {
                    controller.open();
                  }
                },
                child: Icon(Icons.menu_rounded, size: 28, color: ink),
              ),
            )"""
          text = text[:start] + menu + text[end + len('        ),'):]
          write(topbar, text)

          # 5) Web edit guard: never silently save a catastrophically sparse
          # browser crop/trim export. Modern Safari/Chromium use genuine decoded
          # video-frame callbacks; reject an edit if those frames collapse.
          recut = 'lib/src/features/camera/data/video_recut_v3_html.dart'
          replace_once(
              recut,
              """  JSObject? mediaElementSource;

            try {
          """,
              """  JSObject? mediaElementSource;
            var presentedFrames = 0;
            var usesDecodedFrameClock = false;

            try {
          """,
              'web edit frame guard state',
          )
          replace_once(
              recut,
              """    if (videoJs.hasProperty('requestVideoFrameCallback'.toJS).toDart) {
              late JSFunction onVideoFrame;
              onVideoFrame = ((JSAny? _, JSAny? __) {
                if (video == null) return;
                paintFrame();
          """,
              """    if (videoJs.hasProperty('requestVideoFrameCallback'.toJS).toDart) {
              usesDecodedFrameClock = true;
              late JSFunction onVideoFrame;
              onVideoFrame = ((JSAny? _, JSAny? __) {
                if (video == null) return;
                paintFrame();
                presentedFrames += 1;
          """,
              'web edit count real frames',
          )
          replace_once(
              recut,
              """    if (chunks.isEmpty)
              throw StateError('No optimized video data was produced.');

            final outputMime = selectedMime.contains('mp4')
          """,
              """    if (chunks.isEmpty)
              throw StateError('No optimized video data was produced.');

            if (usesDecodedFrameClock && cutDuration >= 1.5) {
              final realFps = presentedFrames / cutDuration;
              if (realFps < 12) {
                throw StateError(
                  'This browser could not preserve smooth motion for this edit. '
                  'Choose KEEP FULL VIDEO or retry the edit.',
                );
              }
            }

            final outputMime = selectedMime.contains('mp4')
          """,
              'web edit reject sparse export',
          )
          PY
      - name: Verify patches
        shell: bash
        run: |
          git diff --check
          grep -q "bool _videoPreviewEnabled = true" lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          grep -q "unawaited(_advance(1))" lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          grep -q "quickFilterPreviewListingsProvider(category).future" lib/src/core/performance/app_refresh_service.dart
          grep -q "TweenAnimationBuilder<double>" lib/src/core/widgets/glow_search_bar.dart
          grep -q "MenuAnchor(" lib/src/core/widgets/app_top_bar.dart
          grep -q "realFps < 12" lib/src/features/camera/data/video_recut_v3_html.dart
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "swipess-fix-bot"
          git config user.email "woorkify@gmail.com"
          git add lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart lib/src/core/performance/app_refresh_service.dart lib/src/core/widgets/glow_search_bar.dart lib/src/core/widgets/app_top_bar.dart lib/src/features/camera/data/video_recut_v3_html.dart
          git commit -m "fix(dashboard): restore live events refresh and compact AI prompts"
          git push origin HEAD:main
