name: Hotfix portrait photos and visible Home refresh

on:
  push:
    paths:
      - '.github/workflows/hotfix-portrait-home-refresh-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotfix-portrait-home-refresh-20260905
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply portrait and visible refresh patch
        run: python3 .github/scripts/hotfix_portrait_home_refresh_20260905.py

      - name: Verify source contracts
        run: |
          grep -q 'i: StudioPhotoFit.portrait' lib/src/features/studio/presentation/screens/studio_composer_screen.dart
          grep -q '_dashboardRefreshKey' lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          grep -q 'indicator.show();' lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart

      - name: Commit and push onto latest main
        run: |
          git config user.name 'swipess-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/features/studio/presentation/screens/studio_composer_screen.dart
          git add lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          git add lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          git add lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          if git diff --cached --quiet; then
            echo 'No source changes needed'
            exit 0
          fi
          git commit -m 'fix(ui): force portrait photos and visible Home refresh'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
