name: Patch verified iOS release pipeline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-ios-release-pipeline.yml
      - .github/scripts/patch_ios_release.py

permissions:
  contents: write

jobs:
  patch-ios-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified iOS release patch
        run: python3 .github/scripts/patch_ios_release.py

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swipess-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-ios-release-pipeline.yml
          git rm .github/scripts/patch_ios_release.py
          git add lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart pubspec.yaml codemagic.yaml
          git diff --cached --check
          git commit -m "fix(release): force verified iOS map parity build 636"
          git push origin HEAD:main
