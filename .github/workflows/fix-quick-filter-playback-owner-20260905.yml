name: Fix quick-filter playback ownership and white default

on:
  push:
    branches: [main]
    paths:
      - 'tool/fix_quick_filter_playback_owner_20260905.py'
      - '.github/workflows/fix-quick-filter-playback-owner-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply playback ownership repair
        run: python3 tool/fix_quick_filter_playback_owner_20260905.py
      - name: Validate repair
        run: |
          git diff --check
          grep -q "manual-only. After the user presses" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "resumeEventsWhenIdle = false" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "one tap must reclaim playback immediately" lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          grep -q "swipess_white_default_20260905_applied" lib/src/core/providers/visual_theme_provider.dart
      - name: Commit repaired app
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart \
            lib/src/core/providers/visual_theme_provider.dart
          git commit -m 'Fix quick-filter playback ownership and keep Events manual handoff'
          git push origin HEAD:main
