name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Release-critical tests
        timeout-minutes: 15
        run: flutter test --exclude-tags golden --reporter expanded

  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Golden visual regression tests
        timeout-minutes: 8
        run: flutter test test/parity/parity_harness_test.dart --tags golden --reporter expanded

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Web release build
        run: flutter build web --release

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Android 16 SDK
        run: sdkmanager "platforms;android-36"
      - name: Dependencies
        run: flutter pub get
      - name: Android release bundle (unsigned CI artifact)
        run: flutter build appbundle --release

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Force generated Xcode settings to release
        run: flutter build ios --config-only --release --no-codesign
      - name: Show generated Flutter build mode
        run: grep -E '^(FLUTTER_BUILD_MODE|FLUTTER_BUILD_NAME|FLUTTER_BUILD_NUMBER)=' ios/Flutter/Generated.xcconfig || true
      - name: iOS release build (no sign)
        run: flutter build ios --release --no-codesign
      - name: Verify TestFlight bundle is not Flutter debug/JIT
        run: sh ios/ci_scripts/verify_release_bundle.sh build/ios/iphoneos/Runner.app
