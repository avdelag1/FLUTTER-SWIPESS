name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Deployment configuration
        run: ./tool/check_vercel_config.sh
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Web release build
        run: flutter build web --release
