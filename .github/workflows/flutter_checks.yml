name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Android 16 SDK
        run: sdkmanager "platforms;android-36"
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Web release build
        run: flutter build web --release
      - name: Android release bundle (unsigned CI artifact)
        run: flutter build appbundle --release

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: iOS release build (no sign)
        run: flutter build ios --release --no-codesign
      - name: Verify TestFlight bundle is not Flutter debug/JIT
        run: sh ios/ci_scripts/verify_release_bundle.sh build/ios/iphoneos/Runner.app
