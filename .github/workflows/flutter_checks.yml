name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-field-hotfix:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'apply AI field hotfix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply one-time AI field patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('lib/src/core/widgets/glow_search_bar.dart')
          text = dashboard.read_text()

          old = """  Future<void> _toggleVoice() async {
    if (!_isEditableSearch) {
      widget.onTap?.call();
      return;
    }
    if (_inlineAiLoading) return;

    if (_micSessionActive || _voiceActive || _voice.isOwnedBy(this)) {
      await _endContinuousSession();
      return;
    }

    _micSessionActive = true;
    await _startLiveListening(animatePop: true);
  }
"""
          new = """  Future<void> _toggleVoice() async {
    if (!_isEditableSearch) {
      widget.onTap?.call();
      return;
    }
    if (_inlineAiLoading) return;

    if (_micSessionActive || _voiceActive || _voice.isOwnedBy(this)) {
      await _endContinuousSession();
      return;
    }

    // Every idle mic tap starts a completely new request. Clear the previous
    // question and result before voice recognition starts so new speech can
    // never be appended to the last conversation.
    final controller = widget.controller;
    if (controller != null && controller.text.isNotEmpty) {
      controller.clear();
      widget.onChanged?.call('');
    }
    if (_inlineQuestion != null ||
        _inlineAnswer != null ||
        _inlineLocalBrain.isNotEmpty ||
        _inlineProfiles.isNotEmpty ||
        _inlineListings.isNotEmpty) {
      _dismissInlineAi();
    }
    _liveTranscript = '';
    _pendingVoiceSubmit = null;
    _speechResumedWithoutText = false;
    _speechResumeBaseline = '';

    _micSessionActive = true;
    await _startLiveListening(animatePop: true);
  }
"""
          if old not in text:
            raise SystemExit('dashboard toggle block not found')
          text = text.replace(old, new, 1)

          old = """      var answer = clean.isNotEmpty
          ? clean
          : fallback.isNotEmpty
          ? fallback
          : 'I heard you. Try asking in a different way or tap Continue in chat.';
      if (brain.isNotEmpty && declined) {
        final name = brain.first['name']?.toString().trim();
        answer = name != null && name.isNotEmpty
            ? 'Best match: $name.'
            : 'I found a trusted local contact for you.';
      }
"""
          new = """      // Never put the raw provider response on screen as a fallback. Parsed
      // structured transport data must stay internal even if a provider returns
      // malformed tags or base64 payloads.
      var answer = clean.isNotEmpty
          ? clean
          : 'I found results, but the answer needs a cleaner response. Try again.';

      // Curated contact results use deterministic dashboard copy. This prevents
      // the model from replacing a valid Local Brain match with unrelated prose.
      if (brain.isNotEmpty) {
        final name = brain.first['name']?.toString().trim();
        answer = name != null && name.isNotEmpty
            ? 'Best match: $name.'
            : 'I found a trusted local contact for you.';
      } else if (declined && parsed.profiles.isNotEmpty) {
        answer = 'I found matching people for you.';
      }
"""
          if old not in text:
            raise SystemExit('dashboard answer block not found')
          text = text.replace(old, new, 1)

          old = "final description = _first(['recommendation_note', 'description']);"
          new = "final description = _first(['description']);"
          if old not in text:
            raise SystemExit('private recommendation_note preview block not found')
          text = text.replace(old, new, 1)
          dashboard.write_text(text)

          intel = Path('lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart')
          text = intel.read_text()
          old = """    if (_voice.isOwnedBy(this) || _recording) {
      _cancelCountdown();
      await _voice.cancel(owner: this);
      if (mounted) {
        setState(() {
          _recording = false;
          _voiceLevel = 0;
        });
      }
      return;
    }

    unawaited(AppHaptics.voiceStart());
"""
          new = """    if (_voice.isOwnedBy(this) || _recording) {
      _cancelCountdown();
      await _voice.cancel(owner: this);
      if (mounted) {
        setState(() {
          _recording = false;
          _voiceLevel = 0;
        });
      }
      return;
    }

    // A fresh mic tap is a fresh request, never an append to old input.
    _cancelCountdown();
    _controller.clear();

    unawaited(AppHaptics.voiceStart());
"""
          if old not in text:
            raise SystemExit('Intel Core toggle block not found')
          intel.write_text(text.replace(old, new, 1))

          edge = Path('supabase/functions/ai-concierge/index.ts')
          text = edge.read_text()
          text = text.replace('    recommendation_note: entry.recommendation_note ?? null,\n', '', 1)
          old = """  const intro = aiDeclinedContactMatch(text)
    ? (ctx.compactDashboard
      ? `Best match: ${first?.name || \"this contact\"}.`
      : `I found a trusted local match: ${first?.name || \"this contact\"}.`)
    : text.trim();
"""
          new = """  const intro = ctx.compactDashboard
    ? `Best match: ${first?.name || \"this contact\"}.`
    : aiDeclinedContactMatch(text)
      ? `I found a trusted local match: ${first?.name || \"this contact\"}.`
      : text.trim();
"""
          if old not in text:
            raise SystemExit('Local Brain intro block not found')
          edge.write_text(text.replace(old, new, 1))

          # Restore this workflow to the exact pre-hotfix version in the same
          # commit so the one-time write permission/job does not remain on main.
          import subprocess
          original = subprocess.check_output([
              'git', 'show', 'HEAD^:.github/workflows/flutter_checks.yml'
          ], text=True)
          Path('.github/workflows/flutter_checks.yml').write_text(original)
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "swipess-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart supabase/functions/ai-concierge/index.ts .github/workflows/flutter_checks.yml
          git commit -m "fix(ai): reset mic field and block internal payloads"
          git push origin HEAD:main

  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Release-critical tests
        timeout-minutes: 15
        run: flutter test --exclude-tags golden --reporter expanded

  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Detect golden harness
        id: golden
        shell: bash
        run: |
          if [[ -f test/parity/parity_harness_test.dart ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No golden harness in this checkout; skipping visual parity."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.golden.outputs.present == 'true'
        with:
          channel: stable
          cache: true
      - name: Dependencies
        if: steps.golden.outputs.present == 'true'
        run: flutter pub get
      - name: Golden visual regression tests
        if: steps.golden.outputs.present == 'true'
        timeout-minutes: 8
        run: flutter test test/parity/parity_harness_test.dart --tags golden --reporter expanded

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Web release build
        run: flutter build web --release

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Android 16 SDK
        run: sdkmanager "platforms;android-36"
      - name: Dependencies
        run: flutter pub get
      - name: Android release bundle (unsigned CI artifact)
        run: flutter build appbundle --release

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Force generated Xcode settings to release
        run: flutter build ios --config-only --release --no-codesign
      - name: Show generated Flutter build mode
        run: grep -E '^(FLUTTER_BUILD_MODE|FLUTTER_BUILD_NAME|FLUTTER_BUILD_NUMBER)=' ios/Flutter/Generated.xcconfig || true
      - name: iOS release build (no sign)
        run: flutter build ios --release --no-codesign
      - name: Verify TestFlight bundle is not Flutter debug/JIT
        run: sh ios/ci_scripts/verify_release_bundle.sh build/ios/iphoneos/Runner.app
