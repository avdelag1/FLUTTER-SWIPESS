name: Patch Studio portrait all

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-studio-portrait-all-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Studio portrait-all safeguard
        run: python3 .github/scripts/patch_studio_portrait_all_20260905.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/src/features/studio/presentation/screens/studio_composer_screen.dart \
            test/studio_portrait_all_guard_test.dart

      - name: Test portrait-all safeguard
        run: flutter test test/studio_portrait_all_guard_test.dart

      - name: Analyze changed Studio screen
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/studio/presentation/screens/studio_composer_screen.dart

      - name: Commit and push safely onto latest main
        run: |
          git config user.name 'swipess-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/src/features/studio/presentation/screens/studio_composer_screen.dart \
            test/studio_portrait_all_guard_test.dart
          if git diff --cached --quiet; then
            echo 'Studio portrait-all patch is already applied.'
            exit 0
          fi
          git commit -m 'fix: make Studio portrait-first for every photo'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; rebasing and retrying..."
            sleep 2
          done
          echo 'Could not push after 3 rebased attempts.' >&2
          exit 1
