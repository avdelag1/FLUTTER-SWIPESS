name: Apply video editor v3

on:
  push:
    paths:
      - '.github/workflows/apply-video-editor-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch editor and listing entry points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_all_checked(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          # 1) Extend trim math to 60 seconds.
          trim_path = Path('lib/src/features/camera/domain/video_trim_selection.dart')
          trim = trim_path.read_text()
          trim = trim.replace(
              'targets of 5, 10, 15, or 20 seconds.',
              'targets every five seconds from 5 through 60 seconds.',
          )
          trim = replace_once(trim, 'static const double maxSeconds = 20;', 'static const double maxSeconds = 60;', 'trim max')
          trim_path.write_text(trim)

          # 2) Upgrade the trim editor itself.
          editor_path = Path('lib/src/features/camera/presentation/screens/video_cropper_screen.dart')
          editor = editor_path.read_text()

          editor = replace_once(
              editor,
              "import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';",
              "import 'package:file_picker/file_picker.dart';\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';",
              'file picker import',
          )
          editor = replace_once(
              editor,
              "import 'package:flutter_swipes/src/features/camera/domain/video_trim_selection.dart';",
              "import 'package:flutter_swipes/src/features/camera/domain/video_trim_selection.dart';\nimport 'package:flutter_swipes/src/features/swipes/domain/listing_soundtrack.dart';",
              'soundtrack import',
          )

          editor = replace_once(
              editor,
              "  const VideoCropperScreen({super.key, required this.file});\n\n  final XFile file;",
              "  const VideoCropperScreen({\n    super.key,\n    required this.file,\n    this.videoAudioEnabled = true,\n    this.backgroundMusic,\n    this.backgroundMusicPreset,\n    this.backgroundMusicName,\n    this.onVideoAudioChanged,\n    this.onBackgroundMusicFile,\n    this.onBackgroundMusicPreset,\n    this.onBackgroundMusicClear,\n  });\n\n  final XFile file;\n  final bool videoAudioEnabled;\n  final XFile? backgroundMusic;\n  final String? backgroundMusicPreset;\n  final String? backgroundMusicName;\n  final ValueChanged<bool>? onVideoAudioChanged;\n  final ValueChanged<XFile>? onBackgroundMusicFile;\n  final void Function(String id, String label)? onBackgroundMusicPreset;\n  final VoidCallback? onBackgroundMusicClear;",
              'editor constructor',
          )

          editor = replace_once(
              editor,
              "  bool _ready = false;\n  bool _processing = false;\n  String? _error;",
              "  bool _ready = false;\n  bool _processing = false;\n  bool _videoAudioEnabled = true;\n  XFile? _backgroundMusic;\n  String? _backgroundMusicPreset;\n  String? _backgroundMusicName;\n  final ListingSoundtrackPlayer _soundtrackPreview = ListingSoundtrackPlayer();\n  String? _error;",
              'editor audio state',
          )

          editor = replace_once(
              editor,
              "  void initState() {\n    super.initState();\n    _boot();\n  }",
              "  void initState() {\n    super.initState();\n    _videoAudioEnabled = widget.videoAudioEnabled;\n    _backgroundMusic = widget.backgroundMusic;\n    _backgroundMusicPreset = widget.backgroundMusicPreset;\n    _backgroundMusicName = widget.backgroundMusicName;\n    _boot();\n  }",
              'editor init audio state',
          )

          editor = replace_once(
              editor,
              "      await controller.seekTo(_toDuration(_selection.start));\n      await controller.play();",
              "      await controller.setVolume(_videoAudioEnabled ? 1 : 0);\n      await controller.seekTo(_toDuration(_selection.start));\n      await controller.play();",
              'initial volume',
          )

          anchor = "  void _applyPreset(double seconds) {\n    if (_duration + 0.01 < seconds) return;\n    AppHaptics.light();\n    setState(() => _selection = _selection.preset(seconds));\n    _seekToSelectionStart();\n    _ensureSelectionVisible();\n  }\n"
          addition = anchor + "\n  void _jumpSelectionTo(double tappedSecond) {\n    if (!_ready || _duration <= 0) return;\n    final targetStart = tappedSecond - (_selection.length / 2);\n    final next = _selection.moveTo(targetStart);\n    if (next.start == _selection.start && next.end == _selection.end) return;\n    AppHaptics.selection();\n    setState(() => _selection = next);\n    _seekToSelectionStart();\n    _ensureSelectionVisible();\n  }\n\n  Future<void> _setVideoAudio(bool enabled) async {\n    if (_videoAudioEnabled == enabled) return;\n    AppHaptics.light();\n    setState(() => _videoAudioEnabled = enabled);\n    await _player?.setVolume(enabled ? 1 : 0);\n    widget.onVideoAudioChanged?.call(enabled);\n  }\n\n  Future<void> _pickOwnMusic() async {\n    final result = await FilePicker.platform.pickFiles(\n      type: FileType.custom,\n      allowedExtensions: const ['mp3', 'm4a', 'aac', 'wav', 'ogg'],\n      allowMultiple: false,\n      withData: true,\n    );\n    if (result == null || result.files.isEmpty || !mounted) return;\n    final picked = result.files.first;\n    if (picked.size > 15 * 1024 * 1024) {\n      ScaffoldMessenger.of(context).showSnackBar(\n        const SnackBar(content: Text('Music file must be under 15MB.')),\n      );\n      return;\n    }\n    XFile? file;\n    if (picked.bytes != null) {\n      file = XFile.fromData(\n        picked.bytes!,\n        name: picked.name,\n        length: picked.size,\n      );\n    } else if (picked.path != null && picked.path!.isNotEmpty) {\n      file = XFile(picked.path!, name: picked.name);\n    }\n    if (file == null || !mounted) return;\n    setState(() {\n      _backgroundMusic = file;\n      _backgroundMusicPreset = null;\n      _backgroundMusicName = file!.name;\n    });\n    widget.onBackgroundMusicFile?.call(file);\n    await _setVideoAudio(false);\n    try {\n      await _soundtrackPreview.play(file: file, volume: .62);\n    } catch (_) {}\n  }\n\n  Future<void> _selectBuiltInMusic(ListingSoundtrackPreset preset) async {\n    setState(() {\n      _backgroundMusic = null;\n      _backgroundMusicPreset = preset.id;\n      _backgroundMusicName = preset.label;\n    });\n    widget.onBackgroundMusicPreset?.call(preset.id, preset.label);\n    await _setVideoAudio(false);\n    try {\n      await _soundtrackPreview.play(presetId: preset.id, volume: .58);\n    } catch (_) {}\n  }\n\n  Future<void> _clearMusic() async {\n    await _soundtrackPreview.stop();\n    if (!mounted) return;\n    setState(() {\n      _backgroundMusic = null;\n      _backgroundMusicPreset = null;\n      _backgroundMusicName = null;\n    });\n    widget.onBackgroundMusicClear?.call();\n  }\n\n  Future<void> _showAudioSheet() async {\n    await showModalBottomSheet<void>(\n      context: context,\n      isScrollControlled: true,\n      backgroundColor: const Color(0xFF111318),\n      shape: const RoundedRectangleBorder(\n        borderRadius: BorderRadius.vertical(top: Radius.circular(26)),\n      ),\n      builder: (sheetContext) {\n        return SafeArea(\n          top: false,\n          child: Padding(\n            padding: const EdgeInsets.fromLTRB(18, 18, 18, 24),\n            child: Column(\n              mainAxisSize: MainAxisSize.min,\n              crossAxisAlignment: CrossAxisAlignment.start,\n              children: [\n                Row(\n                  children: [\n                    const Icon(Icons.library_music_rounded, color: AppTheme.brandPrimary),\n                    const SizedBox(width: 8),\n                    Expanded(\n                      child: Text(\n                        'AUDIO & MUSIC',\n                        style: GoogleFonts.plusJakartaSans(\n                          color: Colors.white,\n                          fontSize: 15,\n                          fontWeight: FontWeight.w900,\n                        ),\n                      ),\n                    ),\n                    IconButton(\n                      onPressed: () => Navigator.pop(sheetContext),\n                      icon: const Icon(Icons.close_rounded, color: Colors.white70),\n                    ),\n                  ],\n                ),\n                const SizedBox(height: 6),\n                Row(\n                  children: [\n                    Expanded(\n                      child: FilledButton.icon(\n                        onPressed: () {\n                          Navigator.pop(sheetContext);\n                          _pickOwnMusic();\n                        },\n                        icon: const Icon(Icons.upload_file_rounded),\n                        label: const Text('UPLOAD MY MUSIC'),\n                        style: FilledButton.styleFrom(\n                          backgroundColor: AppTheme.brandPrimary,\n                          foregroundColor: Colors.white,\n                        ),\n                      ),\n                    ),\n                    const SizedBox(width: 8),\n                    OutlinedButton.icon(\n                      onPressed: () => _setVideoAudio(!_videoAudioEnabled),\n                      icon: Icon(\n                        _videoAudioEnabled ? Icons.volume_up_rounded : Icons.volume_off_rounded,\n                      ),\n                      label: Text(_videoAudioEnabled ? 'ORIGINAL ON' : 'MUTED'),\n                      style: OutlinedButton.styleFrom(foregroundColor: Colors.white),\n                    ),\n                  ],\n                ),\n                const SizedBox(height: 14),\n                Text(\n                  'SWIPESS AUDIO · 10 BUILT-IN SOUNDS',\n                  style: GoogleFonts.plusJakartaSans(\n                    color: Colors.white70,\n                    fontSize: 10,\n                    fontWeight: FontWeight.w900,\n                    letterSpacing: .7,\n                  ),\n                ),\n                const SizedBox(height: 8),\n                SizedBox(\n                  height: 96,\n                  child: ListView.separated(\n                    scrollDirection: Axis.horizontal,\n                    itemCount: listingSoundtrackPresets.length,\n                    separatorBuilder: (_, __) => const SizedBox(width: 8),\n                    itemBuilder: (_, index) {\n                      final preset = listingSoundtrackPresets[index];\n                      final selected = _backgroundMusicPreset == preset.id;\n                      return InkWell(\n                        onTap: () => _selectBuiltInMusic(preset),\n                        borderRadius: BorderRadius.circular(14),\n                        child: Container(\n                          width: 118,\n                          padding: const EdgeInsets.all(10),\n                          decoration: BoxDecoration(\n                            color: selected\n                                ? AppTheme.brandPrimary.withAlpha(36)\n                                : Colors.white.withAlpha(10),\n                            borderRadius: BorderRadius.circular(14),\n                            border: Border.all(\n                              color: selected ? AppTheme.brandPrimary : Colors.white24,\n                            ),\n                          ),\n                          child: Column(\n                            crossAxisAlignment: CrossAxisAlignment.start,\n                            children: [\n                              Text(preset.emoji, style: const TextStyle(fontSize: 20)),\n                              const Spacer(),\n                              Text(\n                                preset.label,\n                                maxLines: 1,\n                                overflow: TextOverflow.ellipsis,\n                                style: GoogleFonts.plusJakartaSans(\n                                  color: Colors.white,\n                                  fontSize: 10,\n                                  fontWeight: FontWeight.w800,\n                                ),\n                              ),\n                            ],\n                          ),\n                        ),\n                      );\n                    },\n                  ),\n                ),\n                if ((_backgroundMusicName ?? '').trim().isNotEmpty) ...[\n                  const SizedBox(height: 10),\n                  Row(\n                    children: [\n                      const Icon(Icons.music_note_rounded, color: Color(0xFF34D399), size: 18),\n                      const SizedBox(width: 7),\n                      Expanded(\n                        child: Text(\n                          _backgroundMusicName!,\n                          maxLines: 1,\n                          overflow: TextOverflow.ellipsis,\n                          style: GoogleFonts.plusJakartaSans(\n                            color: Colors.white,\n                            fontSize: 10,\n                            fontWeight: FontWeight.w800,\n                          ),\n                        ),\n                      ),\n                      TextButton(\n                        onPressed: _clearMusic,\n                        child: const Text('REMOVE'),\n                      ),\n                    ],\n                  ),\n                ],\n              ],\n            ),\n          ),\n        );\n      },\n    );\n  }\n"
          editor = replace_once(editor, anchor, addition, 'editor audio methods')

          editor = replace_once(
              editor,
              "  void dispose() {\n    _player?.removeListener(_onTick);\n    _player?.dispose();\n    _timelineScroll.dispose();\n    super.dispose();\n  }",
              "  void dispose() {\n    _player?.removeListener(_onTick);\n    _player?.dispose();\n    _soundtrackPreview.dispose();\n    _timelineScroll.dispose();\n    super.dispose();\n  }",
              'editor dispose',
          )

          editor = editor.replace("const SnackBar(content: Text('Choose a clip up to 20 seconds.'))", "const SnackBar(content: Text('Choose a clip up to 60 seconds.'))")

          editor = replace_once(
              editor,
              "          const SizedBox(\n            width: 48,\n            child: Icon(\n              Icons.content_cut_rounded,\n              color: AppTheme.brandPrimary,\n            ),\n          ),",
              "          const SizedBox(width: 48),",
              'remove scissors',
          )

          editor = replace_once(
              editor,
              "            child: ColoredBox(\n              color: Colors.black,\n              child: VideoPlayer(_player!),\n            ),",
              "            child: ColoredBox(\n              color: Colors.black,\n              child: Stack(\n                fit: StackFit.expand,\n                children: [\n                  VideoPlayer(_player!),\n                  Positioned(\n                    right: 10,\n                    bottom: 10,\n                    child: Row(\n                      mainAxisSize: MainAxisSize.min,\n                      children: [\n                        _previewAction(\n                          tooltip: _videoAudioEnabled ? 'Mute original video' : 'Turn original video sound on',\n                          icon: _videoAudioEnabled ? Icons.volume_up_rounded : Icons.volume_off_rounded,\n                          active: !_videoAudioEnabled,\n                          onTap: () => _setVideoAudio(!_videoAudioEnabled),\n                        ),\n                        const SizedBox(width: 7),\n                        _previewAction(\n                          tooltip: 'Audio and music',\n                          icon: Icons.library_music_rounded,\n                          active: (_backgroundMusicName ?? '').isNotEmpty,\n                          onTap: _showAudioSheet,\n                        ),\n                      ],\n                    ),\n                  ),\n                ],\n              ),\n            ),",
              'preview controls',
          )

          editor = replace_once(
              editor,
              "            'Drag an edge to resize · drag the middle to move the whole clip',",
              "            'Tap the filmstrip to jump the whole clip · drag the middle for fine movement · drag edges to resize',",
              'timeline help',
          )

          editor = replace_once(
              editor,
              "            child: timeline,",
              "            child: GestureDetector(\n              behavior: HitTestBehavior.opaque,\n              onTapDown: (details) =>\n                  _jumpSelectionTo(details.localPosition.dx / pixelsPerSecond),\n              child: timeline,\n            ),",
              'tap jump timeline',
          )

          old_presets = "  Widget _buildPresetRow() {\n    const presets = [5.0, 10.0, 15.0, 20.0];\n    return Row(\n      children: [\n        for (var i = 0; i < presets.length; i++) ...[\n          if (i > 0) const SizedBox(width: 7),\n          Expanded(child: _presetButton(presets[i])),\n        ],\n      ],\n    );\n  }"
          new_presets = "  Widget _buildPresetRow() {\n    const presets = [\n      5.0, 10.0, 15.0, 20.0, 25.0, 30.0,\n      35.0, 40.0, 45.0, 50.0, 55.0, 60.0,\n    ];\n    return SizedBox(\n      height: 36,\n      child: ListView.separated(\n        scrollDirection: Axis.horizontal,\n        itemCount: presets.length,\n        separatorBuilder: (_, __) => const SizedBox(width: 7),\n        itemBuilder: (_, index) => SizedBox(\n          width: 68,\n          child: _presetButton(presets[index]),\n        ),\n      ),\n    );\n  }"
          editor = replace_once(editor, old_presets, new_presets, '60 second presets')

          helper_anchor = "  Widget _edgeHandle() {\n    return Container(\n      width: 4,\n      decoration: BoxDecoration(\n        color: Colors.white,\n        borderRadius: BorderRadius.circular(999),\n      ),\n    );\n  }\n"
          helper_add = helper_anchor + "\n  Widget _previewAction({\n    required String tooltip,\n    required IconData icon,\n    required bool active,\n    required VoidCallback onTap,\n  }) {\n    return Tooltip(\n      message: tooltip,\n      child: Material(\n        color: active\n            ? AppTheme.brandPrimary.withAlpha(220)\n            : Colors.black.withAlpha(160),\n        shape: const CircleBorder(),\n        child: InkWell(\n          customBorder: const CircleBorder(),\n          onTap: onTap,\n          child: SizedBox(\n            width: 42,\n            height: 42,\n            child: Icon(icon, color: Colors.white, size: 21),\n          ),\n        ),\n      ),\n    );\n  }\n"
          editor = replace_once(editor, helper_anchor, helper_add, 'preview helper')
          editor_path.write_text(editor)

          # 3) Wire editor audio choices back into the manual listing draft.
          manual_path = Path('lib/src/features/add/presentation/screens/add_listing_screen.dart')
          manual = manual_path.read_text()
          manual_constructor = "MaterialPageRoute(builder: (_) => VideoCropperScreen(file: file)),"
          manual_replacement = "MaterialPageRoute(\n            builder: (_) => VideoCropperScreen(\n              file: file,\n              videoAudioEnabled: draft.videoAudioEnabled,\n              backgroundMusic: draft.backgroundMusic,\n              backgroundMusicPreset: draft.backgroundMusicPreset,\n              backgroundMusicName: draft.backgroundMusicName,\n              onVideoAudioChanged: (enabled) => ref\n                  .read(addListingProvider.notifier)\n                  .setVideoAudioEnabled(enabled),\n              onBackgroundMusicFile: (music) => ref\n                  .read(addListingProvider.notifier)\n                  .setBackgroundMusicFile(music),\n              onBackgroundMusicPreset: (id, name) => ref\n                  .read(addListingProvider.notifier)\n                  .setBackgroundMusicPreset(id, name),\n              onBackgroundMusicClear: () => ref\n                  .read(addListingProvider.notifier)\n                  .clearBackgroundMusic(),\n            ),\n          ),"
          manual = replace_all_checked(manual, manual_constructor, manual_replacement, 2, 'manual editor wiring')
          manual = manual.replace("subtitle: '1 video · trim 5 / 10 / 15 / 20s',", "subtitle: '1 video · trim 5s to 60s',")
          manual_path.write_text(manual)

          # 4) Wire the same editor controls into AI listing creation.
          ai_path = Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart')
          ai = ai_path.read_text()
          ai_constructor = "MaterialPageRoute(builder: (_) => VideoCropperScreen(file: file)),"
          ai_replacement = "MaterialPageRoute(\n            builder: (_) => VideoCropperScreen(\n              file: file,\n              videoAudioEnabled: _videoAudioEnabled,\n              backgroundMusic: _backgroundMusic,\n              backgroundMusicPreset: _backgroundMusicPreset,\n              backgroundMusicName: _backgroundMusicName,\n              onVideoAudioChanged: (enabled) {\n                if (mounted) setState(() => _videoAudioEnabled = enabled);\n              },\n              onBackgroundMusicFile: (music) {\n                if (!mounted) return;\n                setState(() {\n                  _backgroundMusic = music;\n                  _backgroundMusicPreset = null;\n                  _backgroundMusicName = music.name;\n                  _videoAudioEnabled = false;\n                });\n              },\n              onBackgroundMusicPreset: (id, name) {\n                if (!mounted) return;\n                setState(() {\n                  _backgroundMusic = null;\n                  _backgroundMusicPreset = id;\n                  _backgroundMusicName = name;\n                  _videoAudioEnabled = false;\n                });\n              },\n              onBackgroundMusicClear: () {\n                if (!mounted) return;\n                setState(() {\n                  _backgroundMusic = null;\n                  _backgroundMusicPreset = null;\n                  _backgroundMusicName = null;\n                });\n              },\n            ),\n          ),"
          ai = replace_all_checked(ai, ai_constructor, ai_replacement, 2, 'AI editor wiring')
          ai = ai.replace("sublabel: '1 video · trim 5 / 10 / 15 / 20s',", "sublabel: '1 video · trim 5s to 60s',")
          ai_path.write_text(ai)

          # Keep video-first / photos-right order in both flows; assert it remains true.
          if manual.find("title: draft.video == null ? 'Video' : 'Edit video'") > manual.find("title: 'Photos'"):
              raise SystemExit('manual media order was accidentally reversed')
          if ai.find("label: _video == null ? 'ADD VIDEO' : 'EDIT VIDEO'") > ai.find("label: _photos.isEmpty ? 'ADD PHOTOS' : 'ADD MORE'"):
              raise SystemExit('AI media order was accidentally reversed')

          # One-shot workflow: remove itself after applying the patch.
          Path('.github/workflows/apply-video-editor-v3.yml').unlink()
          PY

      - name: Sanity checks
        shell: bash
        run: |
          grep -q "static const double maxSeconds = 60" lib/src/features/camera/domain/video_trim_selection.dart
          grep -q "SWIPESS AUDIO · 10 BUILT-IN SOUNDS" lib/src/features/camera/presentation/screens/video_cropper_screen.dart
          grep -q "55.0, 60.0" lib/src/features/camera/presentation/screens/video_cropper_screen.dart
          grep -q "_jumpSelectionTo" lib/src/features/camera/presentation/screens/video_cropper_screen.dart
          if grep -q "Icons.content_cut_rounded" lib/src/features/camera/presentation/screens/video_cropper_screen.dart; then
            echo 'Scissors icon still present in editor' >&2
            exit 1
          fi

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "swipess-video-editor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade video editor audio trim and fast timeline jump"
          git push origin HEAD:main
