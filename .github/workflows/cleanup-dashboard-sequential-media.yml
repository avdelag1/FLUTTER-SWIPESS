name: Cleanup dashboard sequential media

on:
  push:
    paths:
      - 'tool/cleanup_dashboard_sequential_media.py'
      - '.github/workflows/cleanup-dashboard-sequential-media.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove obsolete dashboard timer plumbing
        run: python3 tool/cleanup_dashboard_sequential_media.py
      - name: Commit cleanup
        run: |
          git config user.name "avdelag1"
          git config user.email "woorkify@gmail.com"
          git add lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean up sequential dashboard media wiring"
            git push origin main
          fi
