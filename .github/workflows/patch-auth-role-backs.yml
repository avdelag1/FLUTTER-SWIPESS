name: Finish auth and role back navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch auth and role navigation
        run: |
          AUTH=lib/src/features/auth/presentation/screens/auth_screen.dart
          ROLE=lib/src/core/widgets/role_control_center.dart

          perl -0pi -e "s#import 'package:flutter_swipes/src/core/widgets/swipess_logo.dart';#import 'package:flutter_swipes/src/core/widgets/swipess_logo.dart';\nimport 'package:flutter_swipes/src/core/widgets/cap_back_button.dart';#" "$AUTH"
          perl -0pi -e 's#onTap: \(\) \{\n                        AppHaptics\.light\(\);\n                        if \(Navigator\.of\(context\)\.canPop\(\)\) \{\n                          Navigator\.of\(context\)\.pop\(\);\n                        \} else \{\n                          context\.go\(AppPaths\.welcome\);\n                        \}\n                      \},#onTap: () => NavBack.popOrGo(\n                        context,\n                        fallbackPath: AppPaths.welcome,\n                      ),#' "$AUTH"

          perl -0pi -e "s#import 'package:flutter_swipes/src/core/theme/app_theme.dart';#import 'package:flutter_swipes/src/core/theme/app_theme.dart';\nimport 'package:flutter_swipes/src/core/widgets/cap_back_button.dart';#" "$ROLE"
          perl -0pi -e "s#onTap: \(\) \{\n                                if \(Navigator\.of\(context\)\.canPop\(\)\) \{\n                                  Navigator\.of\(context\)\.pop\(\);\n                                \} else \{\n                                  context\.go\('/client/dashboard'\);\n                                \}\n                              \},#onTap: () => NavBack.popOrGo(context),#" "$ROLE"

      - name: Verify patches
        run: |
          grep -q 'fallbackPath: AppPaths.welcome' lib/src/features/auth/presentation/screens/auth_screen.dart
          grep -q 'onTap: () => NavBack.popOrGo(context)' lib/src/core/widgets/role_control_center.dart
      - name: Commit patch
        run: |
          git config user.name "Swipess Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/auth/presentation/screens/auth_screen.dart
          git add lib/src/core/widgets/role_control_center.dart
          git commit -m "fix(nav): make auth and role back deterministic"
          git push origin HEAD:main
