name: One-shot dashboard interaction fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-dashboard-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply interaction patch
        run: python3 .github/patch_dashboard_interactions.py

      - name: Commit source fix
        run: |
          git config user.name "Swipess Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dashboard): make media controls and deck exits deterministic"
          git push origin HEAD:main
