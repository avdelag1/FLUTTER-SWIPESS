name: One-shot dashboard interaction fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-dashboard-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch dashboard interactions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'patched: {label}')

          # 1) Root swipe decks are pushed imperatively. Capture GoRouter BEFORE
          # popping the deck, then navigate using that stable router object.
          # This avoids using a disposed BuildContext while also ensuring the
          # pushed MaterialPageRoute is actually removed from the screen.
          path = 'lib/src/features/swipes/presentation/screens/client_swipe_container.dart'
          old = '''  void _goDashboard() {
            ref.read(navTabProvider.notifier).set(NavTab.dashboard);
            // This deck can be hosted inside a nested MaterialPageRoute. Popping the
            // root navigator first can dispose this context before go() runs, leaving
            // the visible back controls unresponsive. A direct router transition is
            // deterministic from every quick-filter entry point.
            GoRouter.of(context).go(AppPaths.clientDashboard);
          }

          void _goMessages() {
            ref.read(navTabProvider.notifier).set(NavTab.messages);
            GoRouter.of(context).go(AppPaths.messages);
          }
'''
          new = '''  void _goDashboard() {
            final router = GoRouter.of(context);
            final root = Navigator.of(context, rootNavigator: true);
            ref.read(navTabProvider.notifier).set(NavTab.dashboard);
            if (root.canPop()) root.pop();
            router.go(AppPaths.clientDashboard);
          }

          void _goMessages() {
            final router = GoRouter.of(context);
            final root = Navigator.of(context, rootNavigator: true);
            ref.read(navTabProvider.notifier).set(NavTab.messages);
            if (root.canPop()) root.pop();
            router.go(AppPaths.messages);
          }
'''
          replace_once(path, old, new, 'root swipe-deck back/messages navigation')

          old = '''        if (cat == 'events') {
                  Navigator.of(context).pop();
                  ref.read(navTabProvider.notifier).set(NavTab.events);
                  return;
                }
'''
          new = '''        if (cat == 'events') {
                  final router = GoRouter.of(context);
                  final root = Navigator.of(context, rootNavigator: true);
                  ref.read(navTabProvider.notifier).set(NavTab.events);
                  if (root.canPop()) root.pop();
                  router.go(AppPaths.exploreEvents);
                  return;
                }
'''
          replace_once(path, old, new, 'exhausted deck events navigation')

          # 2) Events teaser: one full-card instant tap target. Only the media
          # controls consume taps; visual labels are pointer-transparent.
          path = 'lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart'
          old = '''            Positioned(
              top: 0,
              left: 0,
              right: 52,
              bottom: 52,
              child: GestureDetector(
'''
          new = '''            Positioned.fill(
              child: GestureDetector(
'''
          replace_once(path, old, new, 'events full-card tap target')

          old = '''            Positioned(
              left: 14,
              top: 13,
              child: Container(
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                decoration: BoxDecoration(
                  color: Colors.black.withAlpha(125),
                  borderRadius: BorderRadius.circular(999),
                  border: Border.all(color: Colors.white.withAlpha(42)),
                ),
                child: Text(
                  _videoPreviewEnabled ? 'EVENTS  •  LIVE' : 'EVENTS  •  PAUSED',
                  style: GoogleFonts.plusJakartaSans(
                    color: Colors.white,
                    fontSize: 9,
                    fontWeight: FontWeight.w900,
                    letterSpacing: 1.1,
                  ),
                ),
              ),
            ),
'''
          new = '''            IgnorePointer(
              child: Positioned(
                left: 14,
                top: 13,
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                  decoration: BoxDecoration(
                    color: Colors.black.withAlpha(125),
                    borderRadius: BorderRadius.circular(999),
                    border: Border.all(color: Colors.white.withAlpha(42)),
                  ),
                  child: Text(
                    _videoPreviewEnabled ? 'EVENTS  •  LIVE' : 'EVENTS  •  PAUSED',
                    style: GoogleFonts.plusJakartaSans(
                      color: Colors.white,
                      fontSize: 9,
                      fontWeight: FontWeight.w900,
                      letterSpacing: 1.1,
                    ),
                  ),
                ),
              ),
            ),
'''
          replace_once(path, old, new, 'events live label pointer transparency')

          old = '''            Positioned(
              left: 15,
              right: 15,
              bottom: 15,
              child: Row(
                crossAxisAlignment: CrossAxisAlignment.end,
                children: [
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text(
                          event?.title.trim().isNotEmpty == true
                              ? event!.title.toUpperCase()
                              : 'WHAT\\'S HAPPENING',
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          style: GoogleFonts.plusJakartaSans(
                            color: Colors.white,
                            fontSize: 16,
                            height: 1.02,
                            fontWeight: FontWeight.w900,
                            letterSpacing: -.35,
                          ),
                        ),
                        const SizedBox(height: 4),
                        Text(
                          _videoPreviewEnabled
                              ? (videos.length > 1
                                  ? 'Live event stream · swipe left or right'
                                  : 'Tap to explore events')
                              : 'Video preview off · tap camera to resume',
                          style: GoogleFonts.plusJakartaSans(
                            color: Colors.white,
                            fontSize: 9.5,
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(width: 42),
                ],
              ),
            ),
'''
          new = '''            IgnorePointer(
              child: Positioned(
                left: 15,
                right: 15,
                bottom: 15,
                child: Row(
                  crossAxisAlignment: CrossAxisAlignment.end,
                  children: [
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Text(
                            event?.title.trim().isNotEmpty == true
                                ? event!.title.toUpperCase()
                                : 'WHAT\\'S HAPPENING',
                            maxLines: 2,
                            overflow: TextOverflow.ellipsis,
                            style: GoogleFonts.plusJakartaSans(
                              color: Colors.white,
                              fontSize: 16,
                              height: 1.02,
                              fontWeight: FontWeight.w900,
                              letterSpacing: -.35,
                            ),
                          ),
                          const SizedBox(height: 4),
                          Text(
                            _videoPreviewEnabled
                                ? (videos.length > 1
                                    ? 'Live event stream · swipe left or right'
                                    : 'Tap to explore events')
                                : 'Video preview off · tap play to resume',
                            style: GoogleFonts.plusJakartaSans(
                              color: Colors.white,
                              fontSize: 9.5,
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 42),
                  ],
                ),
              ),
            ),
'''
          replace_once(path, old, new, 'events title pointer transparency')

          p = Path(path)
          text = p.read_text()
          if text.count('Colors.black.withAlpha(108)') != 2:
              raise SystemExit('events control background: expected 2 matches')
          text = text.replace('Colors.black.withAlpha(108)', 'Colors.black.withAlpha(132)')
          if text.count('Colors.white.withAlpha(50)') != 2:
              raise SystemExit('events control border: expected 2 matches')
          text = text.replace('Colors.white.withAlpha(50)', 'Colors.white.withAlpha(48)')
          text = text.replace('const SizedBox(height: 4)', 'const SizedBox(height: 6)', 1)
          old_icon = '''                        _videoPreviewEnabled
                            ? Icons.videocam_rounded
                            : Icons.videocam_off_rounded,
'''
          new_icon = '''                        _videoPreviewEnabled
                            ? Icons.pause_rounded
                            : Icons.play_arrow_rounded,
'''
          if old_icon not in text:
              raise SystemExit('events play/pause icon pattern missing')
          text = text.replace(old_icon, new_icon, 1)
          p.write_text(text)
          print('patched: events media controls visual parity')

          # 3) New-count badges are decorative and must never block the card tap.
          path = 'lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart'
          old = '''    final badgeWidget = unreadCount > 0 
      ? Positioned(
          top: 10,
          right: 10,
          child: _CategoryBadge(count: unreadCount),
        )
      : const SizedBox.shrink();
'''
          new = '''    final badgeWidget = unreadCount > 0
      ? IgnorePointer(
          child: Positioned(
            top: 10,
            right: 10,
            child: _CategoryBadge(count: unreadCount),
          ),
        )
      : const SizedBox.shrink();
'''
          replace_once(path, old, new, 'quick-filter badge pointer transparency')

          # Remove this temporary workflow from the resulting source commit.
          Path('.github/workflows/one-shot-fix-dashboard-controls.yml').unlink()
          PY

      - name: Commit fixed source to main
        shell: bash
        run: |
          git config user.name "Swipess Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dashboard): make media controls and back navigation deterministic"
          git push origin HEAD:main
