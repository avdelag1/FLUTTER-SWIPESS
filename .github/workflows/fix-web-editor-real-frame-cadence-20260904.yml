name: Fix web editor real frame cadence 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-web-editor-real-frame-cadence-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 tool/fix_web_editor_real_frame_cadence_20260904.py
      - name: Verify source
        run: |
          grep -q "requestVideoFrameCallback" lib/src/features/camera/data/video_recut_v3_html.dart
          grep -q "canvas.captureStream();" lib/src/features/camera/data/video_recut_v3_html.dart
          ! grep -q "canvas.captureStream(30)" lib/src/features/camera/data/video_recut_v3_html.dart
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/camera/data/video_recut_v3_html.dart
          git commit -m "fix(video): export real decoded frames on web"
          git push origin HEAD:main
