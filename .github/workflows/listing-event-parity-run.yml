name: Run listing event parity hotfix

on:
  push:
    paths:
      - '.github/workflows/listing-event-parity-run.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact listing handoff refinement
        run: python .github/scripts/listing_event_parity_refine.py
      - name: Format touched Dart files
        run: dart format lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
      - name: Commit
        shell: bash
        run: |
          git config user.name 'swipess-media-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
                  lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git diff --cached --check
          git commit -m 'Make listing quick filters hand off exact video'
          git push origin HEAD:main
