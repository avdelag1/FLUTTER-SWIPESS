name: Hard quick filter tap speed repair

on:
  push:
    paths:
      - '.github/workflows/hard-fix-quick-filter-taps-speed-dock-20260903.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply platform-safe quick filter repair
        run: python3 tool/fix_quick_filter_pointer_speed_dock_20260903.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart

      - name: Analyze interaction and player surfaces
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart \
            lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart \
            lib/src/features/swipes/presentation/utils/open_swipe_deck.dart \
            lib/src/features/swipes/presentation/providers/swipe_deck_media_handoff.dart \
            lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart \
            lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart

      - name: Build production web bundle
        run: flutter build web --release

      - name: Validate diff
        run: git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "swipess-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            pubspec.yaml \
            pubspec.lock \
            lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart \
            lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make quick filter video taps reliable and instant"
            git push origin main
          fi
