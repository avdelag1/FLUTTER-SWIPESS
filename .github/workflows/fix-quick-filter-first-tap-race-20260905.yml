name: Fix quick-filter first tap playback race

on:
  push:
    branches: [main]
    paths:
      - 'tool/fix_quick_filter_first_tap_race_20260905.py'
      - '.github/workflows/fix-quick-filter-first-tap-race-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply first-tap playback race repair
        run: python3 tool/fix_quick_filter_first_tap_race_20260905.py
      - name: Validate repair
        run: |
          git diff --check
          grep -q "final shouldPlayNow" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          grep -q "one tap deterministic" lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
      - name: Commit repaired app
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          git commit -m 'Fix quick-filter first-tap playback race'
          git push origin HEAD:main
