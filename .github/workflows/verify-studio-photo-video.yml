name: Verify Studio photo video

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - 'lib/**'
      - 'api/studio-render.js'
      - 'supabase/functions/studio-render/**'
      - 'test/studio_*'
      - 'tool/repair_production_compile_contracts_20260904.py'
      - 'tool/check_vercel_config.sh'
      - 'tool/verify_web_bundle.mjs'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'vercel.json'
      - '.github/workflows/verify-studio-photo-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install worker dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Studio renderer syntax
        run: node --check api/studio-render.js

      - name: Render and decode synthetic Studio MP4
        run: node test/studio_renderer_smoke_test.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Repair partial production contracts
        run: python3 tool/repair_production_compile_contracts_20260904.py

      - name: Format repaired Dart files
        run: |
          dart format lib/src/core/providers/search_bar_slot_provider.dart
          dart format lib/src/core/widgets/glow_search_bar.dart
          dart format lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          git diff --check

      - name: Persist repaired source contracts
        run: |
          git config user.name 'swipess-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/core/providers/search_bar_slot_provider.dart
          git add lib/src/core/widgets/glow_search_bar.dart
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          if git diff --cached --quiet; then
            echo 'Source contracts already repaired.'
          else
            git commit -m 'fix(build): restore dashboard compile contracts'
            git push origin HEAD:feat/studio-photo-video
          fi

      - name: Studio targeted tests
        run: |
          flutter test test/studio_cinematic_template_test.dart
          flutter test test/studio_surface_compile_test.dart

      - name: Verify Vercel config
        run: bash tool/check_vercel_config.sh

      - name: Build production web bundle
        run: |
          SUPABASE_URL="${SUPABASE_URL:-https://example.supabase.co}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-anon-debug-key}"
          GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-web-debug.apps.googleusercontent.com}"
          flutter build web --release --pwa-strategy=none --no-wasm-dry-run \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_OAUTH_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=APP_ORIGIN="https://www.swipess.com" \
            --dart-define=ENABLE_FAKE_DATA="false" \
            --dart-define=VAPID_API_BASE="https://white-glacier-0d5a37f0f.2.azurestaticapps.net"
          node tool/verify_web_bundle.mjs
