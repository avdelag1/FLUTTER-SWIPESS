name: Fix Property stable video surface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-property-stable-video-surface-20260904.yml'
      - 'tool/fix_property_stable_surface_20260904.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Apply focused Property playback fix
        run: python3 tool/fix_property_stable_surface_20260904.py

      - name: Format and validate
        run: |
          dart format lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          grep -q "property-video:\$url" lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          grep -q "eventType: 'playhead_stall'" lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          grep -q "setLooping(true)" lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          git diff --check

      - name: Commit source fix
        run: |
          if git diff --quiet -- lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart; then
            echo 'No Property source change produced'
            exit 0
          fi
          git config user.name 'swipess-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/features/dashboard/presentation/widgets/property_teaser_card.dart
          git commit -m 'fix(video): keep Property player surface mounted'
          git push origin HEAD:main
