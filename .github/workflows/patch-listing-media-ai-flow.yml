name: Patch listing media and AI flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-listing-media-ai-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply listing flow patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1) Listing video must be media #1 on the swipe card.
          p = Path('lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart')
          s = p.read_text()
          s = replace_once(
              s,
              '      media.add(video);',
              '      media.insert(0, video);',
              'video first in swipe media',
          )
          p.write_text(s)

          # 2) Give the video editor two trim handles instead of a start-only slider.
          p = Path('lib/src/features/camera/presentation/screens/video_cropper_screen.dart')
          s = p.read_text()
          s = s.replace("/// Cap `VideoCropper` — 10s looping window, then confirm the clip.",
                        "/// Cap `VideoCropper` — preview and trim a looping clip up to 10 seconds.")
          s = s.replace("'10s LOOP'", "'TRIM VIDEO'", 1)
          old_slider = '''                  SliderTheme(
                    data: SliderTheme.of(context).copyWith(
                      activeTrackColor: AppTheme.brandPrimary,
                      thumbColor: Colors.white,
                    ),
                    child: Slider(
                      min: 0,
                      max: _duration <= 0 ? 1 : _duration,
                      value: _start.clamp(0, _duration <= 0 ? 1 : _duration),
                      onChanged: (v) {
                        final window = (_end - _start).clamp(
                          0.5,
                          VideoCropperScreen.maxSeconds,
                        );
                        setState(() {
                          _start = v;
                          _end = (_start + window).clamp(0, _duration);
                        });
                        _player?.seekTo(
                          Duration(milliseconds: (_start * 1000).round()),
                        );
                      },
                    ),
                  ),
                  Text(
                    '${_start.toStringAsFixed(1)}s – ${_end.toStringAsFixed(1)}s',
'''
          new_slider = '''                  Text(
                    'Drag both handles to choose the exact part people will see.',
                    textAlign: TextAlign.center,
                    style: GoogleFonts.plusJakartaSans(
                      color: Colors.white70,
                      fontSize: 11,
                      fontWeight: FontWeight.w600,
                    ),
                  ),
                  const SizedBox(height: 8),
                  SliderTheme(
                    data: SliderTheme.of(context).copyWith(
                      activeTrackColor: AppTheme.brandPrimary,
                      thumbColor: Colors.white,
                    ),
                    child: RangeSlider(
                      min: 0,
                      max: _duration <= 0 ? 1 : _duration,
                      values: RangeValues(
                        _start.clamp(0, _duration <= 0 ? 1 : _duration),
                        _end.clamp(0, _duration <= 0 ? 1 : _duration),
                      ),
                      onChanged: (values) {
                        var start = values.start;
                        var end = values.end;
                        if (end - start < 0.5) return;
                        if (end - start > VideoCropperScreen.maxSeconds) {
                          final movingStart =
                              (values.start - _start).abs() > (values.end - _end).abs();
                          if (movingStart) {
                            start = end - VideoCropperScreen.maxSeconds;
                          } else {
                            end = start + VideoCropperScreen.maxSeconds;
                          }
                        }
                        setState(() {
                          _start = start.clamp(0, _duration);
                          _end = end.clamp(_start, _duration);
                        });
                        _player?.seekTo(
                          Duration(milliseconds: (_start * 1000).round()),
                        );
                      },
                    ),
                  ),
                  Text(
                    '${_start.toStringAsFixed(1)}s – ${_end.toStringAsFixed(1)}s',
'''
          s = replace_once(s, old_slider, new_slider, 'video range trim')
          s = s.replace("'Cap looping card · max ${VideoCropperScreen.maxSeconds.toInt()}s'",
                        "'Preview · trim · max ${VideoCropperScreen.maxSeconds.toInt()}s'", 1)
          s = s.replace("_processing ? 'PROCESSING…' : 'LOOP & SAVE'",
                        "_processing ? 'PROCESSING…' : 'SAVE VIDEO'", 1)
          p.write_text(s)

          # 3) Manual uploader: media first, photo/video choices together, clean-media policy.
          p = Path('lib/src/features/add/presentation/screens/add_listing_screen.dart')
          s = p.read_text()
          photos_class = r'class _PhotosStep extends ConsumerWidget \{.*?\n\}\n\nclass _DetailsStep extends ConsumerWidget \{'
          m = re.search(photos_class, s, flags=re.S)
          if not m:
              raise SystemExit('manual media class: marker not found')
          new_photos = r'''class _PhotosStep extends ConsumerWidget {
  const _PhotosStep({required this.draft});
  final ListingDraft draft;

  Future<void> _pickAndTrimVideo(BuildContext context, WidgetRef ref) async {
    final picker = ImagePicker();
    final file = await picker.pickVideo(source: ImageSource.gallery);
    if (file == null || !context.mounted) return;
    final cropped = await Navigator.of(context).push<XFile>(
      MaterialPageRoute(builder: (_) => VideoCropperScreen(file: file)),
    );
    if (cropped != null && context.mounted) {
      ref.read(addListingProvider.notifier).setVideo(cropped);
    }
  }

  Future<void> _editVideo(BuildContext context, WidgetRef ref) async {
    final file = draft.video;
    if (file == null) return;
    final cropped = await Navigator.of(context).push<XFile>(
      MaterialPageRoute(builder: (_) => VideoCropperScreen(file: file)),
    );
    if (cropped != null && context.mounted) {
      ref.read(addListingProvider.notifier).setVideo(cropped);
    }
  }

  @override
  Widget build(BuildContext context, WidgetRef ref) {
    return Column(
      crossAxisAlignment: CrossAxisAlignment.start,
      children: [
        Text(
          'START WITH THE MEDIA',
          style: GoogleFonts.plusJakartaSans(
            color: Colors.white,
            fontWeight: FontWeight.w900,
            fontSize: 17,
          ),
        ),
        const SizedBox(height: 6),
        Text(
          'Choose what you actually want to post first. You can decide the price and location after you see the media.',
          style: GoogleFonts.plusJakartaSans(
            color: Colors.white70,
            fontSize: 12,
            height: 1.4,
            fontWeight: FontWeight.w600,
          ),
        ),
        const SizedBox(height: 14),
        Row(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Expanded(
              child: _MediaPickCard(
                icon: Icons.photo_library_rounded,
                title: 'Photos',
                subtitle: 'Up to ${draft.maxPhotos}',
                onTap: () => ref.read(addListingProvider.notifier).pickPhotos(),
              ),
            ),
            const SizedBox(width: 10),
            Expanded(
              child: _MediaPickCard(
                icon: draft.video == null
                    ? Icons.video_call_rounded
                    : Icons.edit_rounded,
                title: draft.video == null ? 'Video' : 'Edit video',
                subtitle: '1 video · max 10s',
                onTap: () => draft.video == null
                    ? _pickAndTrimVideo(context, ref)
                    : _editVideo(context, ref),
              ),
            ),
          ],
        ),
        const SizedBox(height: 8),
        TextButton.icon(
          onPressed: () async {
            final files = await Navigator.of(context).push(
              MaterialPageRoute(
                builder: (_) => ListingCameraScreen(
                  maxPhotos: draft.maxPhotos,
                  existingCount: draft.photos.length,
                ),
              ),
            );
            if (files is! List || files.isEmpty || !context.mounted) return;
            final picked = files.whereType<XFile>().toList();
            if (picked.isEmpty) return;
            ref.read(addListingProvider.notifier).update(
              (d) => d.copyWith(
                photos: [...d.photos, ...picked].take(d.maxPhotos).toList(),
              ),
            );
          },
          icon: const Icon(Icons.photo_camera_rounded, size: 18),
          label: const Text('Take photos now'),
          style: TextButton.styleFrom(foregroundColor: Colors.white70),
        ),
        if (draft.video != null) ...[
          const SizedBox(height: 8),
          Container(
            width: double.infinity,
            padding: const EdgeInsets.all(14),
            decoration: BoxDecoration(
              color: const Color(0x1410B981),
              borderRadius: BorderRadius.circular(18),
              border: Border.all(color: const Color(0x4D10B981)),
            ),
            child: Row(
              children: [
                const Icon(Icons.play_circle_fill_rounded,
                    color: Color(0xFF34D399), size: 30),
                const SizedBox(width: 10),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        'VIDEO WILL PLAY FIRST',
                        style: GoogleFonts.plusJakartaSans(
                          color: const Color(0xFF86EFAC),
                          fontSize: 10,
                          fontWeight: FontWeight.w900,
                          letterSpacing: .6,
                        ),
                      ),
                      const SizedBox(height: 3),
                      Text(
                        draft.video!.name,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: GoogleFonts.plusJakartaSans(
                          color: Colors.white,
                          fontSize: 12,
                          fontWeight: FontWeight.w700,
                        ),
                      ),
                    ],
                  ),
                ),
                IconButton(
                  tooltip: 'Preview and trim',
                  onPressed: () => _editVideo(context, ref),
                  icon: const Icon(Icons.content_cut_rounded, color: Colors.white),
                ),
                IconButton(
                  tooltip: 'Remove video',
                  onPressed: () => ref.read(addListingProvider.notifier).removeVideo(),
                  icon: const Icon(Icons.close_rounded, color: Colors.white70),
                ),
              ],
            ),
          ),
        ],
        if (draft.photos.isNotEmpty) ...[
          const SizedBox(height: 16),
          Text(
            'PHOTOS · first photo is the cover when there is no video',
            style: GoogleFonts.plusJakartaSans(
              color: Colors.white70,
              fontWeight: FontWeight.w800,
              fontSize: 10.5,
              letterSpacing: .4,
            ),
          ),
          const SizedBox(height: 10),
          GridView.builder(
            shrinkWrap: true,
            physics: const NeverScrollableScrollPhysics(),
            itemCount: draft.photos.length +
                (draft.photos.length < draft.maxPhotos ? 1 : 0),
            gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
              crossAxisCount: 3,
              mainAxisSpacing: 10,
              crossAxisSpacing: 10,
            ),
            itemBuilder: (context, index) {
              if (index == draft.photos.length) {
                return InkWell(
                  onTap: () => ref.read(addListingProvider.notifier).pickPhotos(),
                  borderRadius: BorderRadius.circular(18),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.white.withAlpha(8),
                      borderRadius: BorderRadius.circular(18),
                      border: Border.all(color: Colors.white24),
                    ),
                    child: const Icon(Icons.add_rounded, color: Colors.white),
                  ),
                );
              }
              final photo = draft.photos[index];
              return Stack(
                fit: StackFit.expand,
                children: [
                  ClipRRect(
                    borderRadius: BorderRadius.circular(18),
                    child: FutureBuilder<Uint8List>(
                      future: photo.readAsBytes(),
                      builder: (context, snap) {
                        if (!snap.hasData) {
                          return const ColoredBox(color: Color(0xFF16161C));
                        }
                        return Image.memory(snap.data!, fit: BoxFit.cover);
                      },
                    ),
                  ),
                  Positioned(
                    top: 4,
                    right: 4,
                    child: GestureDetector(
                      onTap: () => ref
                          .read(addListingProvider.notifier)
                          .removePhoto(index),
                      child: const CircleAvatar(
                        radius: 12,
                        backgroundColor: Colors.black54,
                        child: Icon(Icons.close, size: 14, color: Colors.white),
                      ),
                    ),
                  ),
                  if (index == 0 && draft.video == null)
                    Positioned(
                      left: 6,
                      bottom: 6,
                      child: Container(
                        padding: const EdgeInsets.symmetric(
                          horizontal: 7,
                          vertical: 3,
                        ),
                        decoration: BoxDecoration(
                          color: Colors.black54,
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: Text(
                          'COVER',
                          style: GoogleFonts.plusJakartaSans(
                            color: Colors.white,
                            fontSize: 9,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                      ),
                    ),
                ],
              );
            },
          ),
        ],
        const SizedBox(height: 16),
        _CleanMediaNotice(),
      ],
    );
  }
}

class _MediaPickCard extends StatelessWidget {
  const _MediaPickCard({
    required this.icon,
    required this.title,
    required this.subtitle,
    required this.onTap,
  });
  final IconData icon;
  final String title;
  final String subtitle;
  final VoidCallback onTap;

  @override
  Widget build(BuildContext context) {
    return InkWell(
      onTap: onTap,
      borderRadius: BorderRadius.circular(18),
      child: Container(
        height: 108,
        padding: const EdgeInsets.all(14),
        decoration: BoxDecoration(
          color: Colors.white.withAlpha(9),
          borderRadius: BorderRadius.circular(18),
          border: Border.all(color: Colors.white24),
        ),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(icon, color: const Color(0xFFEB4898), size: 27),
            const SizedBox(height: 8),
            Text(title,
                style: GoogleFonts.plusJakartaSans(
                    color: Colors.white,
                    fontSize: 12,
                    fontWeight: FontWeight.w900)),
            const SizedBox(height: 3),
            Text(subtitle,
                textAlign: TextAlign.center,
                style: GoogleFonts.plusJakartaSans(
                    color: Colors.white60,
                    fontSize: 9.5,
                    fontWeight: FontWeight.w600)),
          ],
        ),
      ),
    );
  }
}

class _CleanMediaNotice extends StatelessWidget {
  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.all(13),
      decoration: BoxDecoration(
        color: const Color(0x14F59E0B),
        borderRadius: BorderRadius.circular(15),
        border: Border.all(color: const Color(0x4DF59E0B)),
      ),
      child: Row(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          const Icon(Icons.cleaning_services_rounded,
              color: Color(0xFFFBBF24), size: 19),
          const SizedBox(width: 9),
          Expanded(
            child: Text(
              'Keep media clean: no phone numbers, @handles, QR codes, URLs, outside ads or promotional watermarks. Flagged media can be removed; repeated violations may suspend listing access.',
              style: GoogleFonts.plusJakartaSans(
                color: const Color(0xFFFDE68A),
                fontSize: 10.5,
                height: 1.4,
                fontWeight: FontWeight.w700,
              ),
            ),
          ),
        ],
      ),
    );
  }
}

