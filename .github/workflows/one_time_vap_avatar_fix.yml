name: One-time Virtual ID navigation and avatar fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_vap_avatar_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch Virtual ID navigation and avatar fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # App path for a route-level Virtual ID editor.
          p = Path('lib/src/core/routing/app_paths.dart')
          s = p.read_text()
          target = "  static const clientVapId = '/client/vap-id';"
          assert target in s, 'clientVapId path target missing'
          if "clientVapIdEdit" not in s:
              s = s.replace(target, target + "\n  static const clientVapIdEdit = '/client/vap-id/edit';", 1)
          p.write_text(s)

          # Register editor as a top-level route so dashboard shell chrome cannot
          # overlap it, and protect it with the same Virtual ID entitlement.
          p = Path('lib/src/core/routing/app_router.dart')
          s = p.read_text()
          import_target = "import 'package:flutter_swipes/src/features/profile/presentation/screens/vap_id_screen.dart';"
          assert import_target in s, 'vap_id_screen import target missing'
          edit_import = "import 'package:flutter_swipes/src/features/profile/presentation/screens/vap_id_edit_screen.dart';"
          if edit_import not in s:
              s = s.replace(import_target, import_target + "\n" + edit_import, 1)
          old_guard = "if (location == AppPaths.clientVapId && !tier.canUseVirtualCard) {"
          new_guard = "if ((location == AppPaths.clientVapId || location == AppPaths.clientVapIdEdit) && !tier.canUseVirtualCard) {"
          assert old_guard in s or new_guard in s, 'Virtual ID redirect guard missing'
          s = s.replace(old_guard, new_guard, 1)
          route = """      GoRoute(
            path: AppPaths.clientVapIdEdit,
            builder: (ctx, _) => const VapIdEditScreen(),
          ),
"""
          shell_marker = "      ShellRoute(\n"
          assert shell_marker in s, 'ShellRoute marker missing'
          if 'path: AppPaths.clientVapIdEdit' not in s:
              s = s.replace(shell_marker, route + "\n" + shell_marker, 1)
          p.write_text(s)

          # The navigation-bar PEARL overlay is outside the Router/Navigator
          # subtree. Do not call Navigator.of(context) or show a bottom sheet
          # from it. Close the overlay, then route to real pages through the
          # GoRouter provider. This removes the gray/dead overlay failure.
          p = Path('lib/src/features/profile/presentation/widgets/vap_id_modal.dart')
          s = p.read_text()
          i18n = "import 'package:flutter_swipes/src/core/i18n/app_locale.dart';"
          assert i18n in s, 'VAP import marker missing'
          for imp in [
              "import 'package:flutter_swipes/src/core/routing/app_paths.dart';",
              "import 'package:flutter_swipes/src/core/routing/app_router.dart';",
          ]:
              if imp not in s:
                  s = s.replace(i18n, i18n + "\n" + imp, 1)
          s = s.replace("import 'package:flutter_swipes/src/core/widgets/glass_text_field.dart';\n", '')
          s = s.replace("import 'package:flutter_swipes/src/features/profile/presentation/widgets/vap_id_photo_picker.dart';\n", '')
          s = s.replace('_openDocuments(context, ref)', '_openDocuments(ref)')
          s = s.replace('_edit(context, ref, data);', '_edit(ref);')

          start = s.index('  Future<void> _openDocuments(')
          mid = s.index('  Future<void> _edit(', start)
          new_docs = """  Future<void> _openDocuments(WidgetRef ref) async {
    AppHaptics.selection();
    ref.read(overlayModalsProvider.notifier).closeVapId();
    await Future<void>.delayed(const Duration(milliseconds: 70));
    await ref.read(appRouterProvider).push<void>(AppPaths.documents);
  }

"""
          s = s[:start] + new_docs + s[mid:]

          start = s.index('  Future<void> _edit(')
          end = s.index('\n}\n\nclass _Round', start)
          new_edit = """  Future<void> _edit(WidgetRef ref) async {
    AppHaptics.selection();
    ref.read(overlayModalsProvider.notifier).closeVapId();
    await Future<void>.delayed(const Duration(milliseconds: 70));
    await ref.read(appRouterProvider).push<void>(AppPaths.clientVapIdEdit);
  }
"""
          s = s[:start] + new_edit + s[end:]
          p.write_text(s)

          # Header avatar fallback.
          p = Path('lib/src/core/widgets/app_top_bar.dart')
          s = p.read_text()
          theme_imp = "import 'package:flutter_swipes/src/core/widgets/glass_modal.dart';"
          avatar_imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          assert theme_imp in s, 'AppTopBar import marker missing'
          if avatar_imp not in s:
              s = s.replace(theme_imp, avatar_imp + "\n" + theme_imp, 1)
          s = s.replace('                  ink: ink,\n', '')
          call_target = '                  avatarUrl: avatarUrl,\n                  semanticLabel:'
          assert call_target in s, 'header avatar call target missing'
          s = s.replace(
              call_target,
              "                  avatarUrl: avatarUrl,\n                  seed: firstName ?? avatarUrl ?? 'you',\n                  semanticLabel:",
              1,
          )
          s = s.replace('    required this.ink,\n', '')
          ctor_target = '    this.avatarUrl,\n    this.semanticLabel,'
          assert ctor_target in s, 'header avatar ctor target missing'
          s = s.replace(ctor_target, '    this.avatarUrl,\n    required this.seed,\n    this.semanticLabel,', 1)
          s = s.replace('  final Color ink;\n', '')
          field_target = '  final String? avatarUrl;\n  final VoidCallback onTap;'
          assert field_target in s, 'header avatar field target missing'
          s = s.replace(field_target, '  final String? avatarUrl;\n  final String seed;\n  final VoidCallback onTap;', 1)
          old_avatar = """        child: Center(
          child: avatarUrl == null
              ? Icon(Icons.person_rounded, size: 23, color: ink)
              : ClipOval(
                  child: Image.network(
                    avatarUrl!,
                    width: 32,
                    height: 32,
                    fit: BoxFit.cover,
                    errorBuilder: (_, __, ___) =>
                        Icon(Icons.person_rounded, size: 23, color: ink),
                  ),
                ),
        ),"""
          new_avatar = """        child: Center(
          child: FunAvatar(
            seed: seed,
            imageUrl: avatarUrl,
            size: 32,
            semanticLabel: semanticLabel,
          ),
        ),"""
          assert old_avatar in s, 'header avatar widget target missing'
          s = s.replace(old_avatar, new_avatar, 1)
          p.write_text(s)

          # Current user's profile photo fallback.
          p = Path('lib/src/features/profile/presentation/screens/profile_screen.dart')
          s = p.read_text()
          import_marker = "import 'package:flutter_swipes/src/core/widgets/glass_modal.dart';"
          avatar_imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          assert import_marker in s, 'profile import marker missing'
          if avatar_imp not in s:
              s = s.replace(import_marker, avatar_imp + "\n" + import_marker, 1)
          old = """                                    child: ClipOval(
                                      child: avatar != null
                                          ? Image.network(
                                              avatar,
                                              fit: BoxFit.cover,
                                              errorBuilder: (_, _, _) =>
                                                  const Icon(
                                                    Icons.person_rounded,
                                                    color: Colors.white24,
                                                    size: 56,
                                                  ),
                                            )
                                          : const Icon(
                                              Icons.person_rounded,
                                              color: Colors.white24,
                                              size: 56,
                                            ),
                                    ),"""
          new = """                                    child: FunAvatar(
                                      seed: email.isNotEmpty ? email : name,
                                      imageUrl: avatar,
                                      size: 126,
                                      semanticLabel: '$headline profile photo',
                                    ),"""
          assert old in s, 'profile avatar target missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Seeker cards fallback.
          p = Path('lib/src/features/seekers/presentation/screens/seekers_screen.dart')
          s = p.read_text()
          marker = "import 'package:flutter_swipes/src/core/widgets/cap_empty_state.dart';"
          avatar_imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          assert marker in s, 'seekers import marker missing'
          if avatar_imp not in s:
              s = s.replace(marker, marker + "\n" + avatar_imp, 1)
          old = """              CircleAvatar(
                radius: 22,
                backgroundColor: accent.withAlpha(40),
                backgroundImage: request.seekerAvatar != null
                    ? NetworkImage(request.seekerAvatar!)
                    : null,
                child: request.seekerAvatar == null
                    ? Text(
                        request.initials,
                        style: GoogleFonts.plusJakartaSans(
                          color: accent,
                          fontWeight: FontWeight.w900,
                          fontSize: 12,
                        ),
                      )
                    : null,
              ),"""
          new = """              FunAvatar(
                seed: request.ownerId ?? request.seekerName,
                imageUrl: request.seekerAvatar,
                size: 44,
                semanticLabel: '${request.seekerName} profile avatar',
              ),"""
          assert old in s, 'seeker avatar target missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Conversation list fallback.
          p = Path('lib/src/features/messages/presentation/screens/messages_screen.dart')
          s = p.read_text()
          marker = "import 'package:flutter_swipes/src/core/widgets/cap_back_button.dart';"
          avatar_imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          assert marker in s, 'messages import marker missing'
          if avatar_imp not in s:
              s = s.replace(marker, marker + "\n" + avatar_imp, 1)
          old = """                CircleAvatar(
                  radius: 28,
                  backgroundImage: conversation.avatarUrl != null
                      ? NetworkImage(conversation.avatarUrl!)
                      : null,
                  child: conversation.avatarUrl == null
                      ? Text(
                          conversation.name[0].toUpperCase(),
                          style: TextStyle(
                            color: ink,
                            fontWeight: FontWeight.bold,
                            fontSize: 20,
                          ),
                        )
                      : null,
                ),"""
          new = """                FunAvatar(
                  seed: conversation.otherUserId ?? conversation.id,
                  imageUrl: conversation.avatarUrl,
                  size: 56,
                  semanticLabel: '${conversation.name} profile avatar',
                ),"""
          assert old in s, 'messages avatar target missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Fan Base / liked profile card fallback.
          p = Path('lib/src/features/likes/presentation/widgets/premium_liked_card.dart')
          s = p.read_text()
          marker = "import 'package:flutter_swipes/src/core/utils/app_haptics.dart';"
          avatar_imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          assert marker in s, 'liked card import marker missing'
          if avatar_imp not in s:
              s = s.replace(marker, marker + "\n" + avatar_imp, 1)
          old = """  Widget _fallback() {
    return ColoredBox(
      color: Colors.transparent,
      child: Icon(
        isProfile ? Icons.person_rounded : Icons.home_outlined,
        size: 48,
        color: Colors.white24,
      ),
    );
  }"""
          new = """  Widget _fallback() {
    if (isProfile) {
      return FunAvatar(
        seed: title,
        size: 192,
        borderRadius: BorderRadius.zero,
        semanticLabel: '$title temporary profile avatar',
      );
    }
    return const ColoredBox(
      color: Colors.transparent,
      child: Icon(Icons.home_outlined, size: 48, color: Colors.white),
    );
  }"""
          assert old in s, 'liked card fallback target missing'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Remove the one-time runner from the final tree.
          Path('.github/workflows/one_time_vap_avatar_fix.yml').unlink()
          PY

      - name: Format touched Dart sources
        run: dart format \
          lib/src/core/routing/app_paths.dart \
          lib/src/core/routing/app_router.dart \
          lib/src/core/widgets/fun_avatar.dart \
          lib/src/core/widgets/app_top_bar.dart \
          lib/src/features/profile/presentation/widgets/vap_id_modal.dart \
          lib/src/features/profile/presentation/screens/vap_id_edit_screen.dart \
          lib/src/features/profile/presentation/screens/profile_screen.dart \
          lib/src/features/seekers/presentation/screens/seekers_screen.dart \
          lib/src/features/messages/presentation/screens/messages_screen.dart \
          lib/src/features/likes/presentation/widgets/premium_liked_card.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix navigation-bar Virtual ID editor and add fun avatar fallbacks'
          git push origin HEAD:main
