name: Apply AI prompt banner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ai-banner-marquee-20260904.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch true right-to-left AI prompt banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/core/widgets/glow_search_bar.dart')
          s = p.read_text()

          old = '''  Timer? _promptTimer;
  int _promptIndex = 0;
'''
          new = '''  Timer? _promptTimer;
  int _promptIndex = 0;
  int _promptCycle = 0;
'''
          if old not in s:
              raise SystemExit('prompt state anchor not found')
          s = s.replace(old, new, 1)

          start = s.index('  void _schedulePrompt() {')
          end = s.index('\n\n  void _suppressVoiceAudio()', start)
          replacement = '''  void _schedulePrompt() {
    // Prompt rotation is driven by the marquee animation completing, not by a
    // separate timer. This guarantees every full suggestion exits left before
    // the next different suggestion enters from the right.
  }

  void _advancePromptBanner() {
    _promptTimer?.cancel();
    _promptTimer = Timer(const Duration(milliseconds: 420), () {
      if (!mounted || !_showPrompt) return;
      final prompts = _rotatingPrompts;
      if (prompts.isEmpty) return;
      setState(() {
        _promptCycle += 1;
        if (prompts.length > 1) {
          _promptIndex = (_promptIndex + 1) % prompts.length;
        }
      });
    });
  }'''
          s = s[:start] + replacement + s[end:]

          old = '''                                final travel = math.max(
                                  0.0,
                                  painter.width - constraints.maxWidth + 12,
                                );
                                final durationMs = (2800 + travel * 18)
                                    .round()
                                    .clamp(3200, 6500)
                                    .toInt();
'''
          new = '''                                // True marquee: every complete suggestion starts
                                // just outside the right edge and fully exits
                                // on the left, even when the text is short.
                                final travel =
                                    constraints.maxWidth + painter.width + 16;
                                final durationMs = (travel * 22)
                                    .round()
                                    .clamp(7200, 16000)
                                    .toInt();
'''
          if old not in s:
              raise SystemExit('marquee travel anchor not found')
          s = s.replace(old, new, 1)

          old = '''                                  child: TweenAnimationBuilder<double>(
                                    key: ValueKey<String>(displayHint),
                                    tween: Tween<double>(begin: 0, end: 1),
                                    duration: Duration(milliseconds: durationMs),
                                    curve: Curves.linear,
                                    builder: (context, progress, child) =>
                                        Transform.translate(
                                          offset: Offset(-travel * progress, 0),
                                          child: child,
                                        ),
'''
          new = '''                                  child: TweenAnimationBuilder<double>(
                                    key: ValueKey<String>(
                                      '$_promptCycle:$displayHint',
                                    ),
                                    tween: Tween<double>(begin: 0, end: 1),
                                    duration: Duration(milliseconds: durationMs),
                                    curve: Curves.linear,
                                    onEnd: _advancePromptBanner,
                                    builder: (context, progress, child) =>
                                        Transform.translate(
                                          offset: Offset(
                                            constraints.maxWidth +
                                                8 -
                                                (travel * progress),
                                            0,
                                          ),
                                          child: child,
                                        ),
'''
          if old not in s:
              raise SystemExit('marquee animation anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          dart format lib/src/core/widgets/glow_search_bar.dart || true
          rm -f .github/workflows/apply-ai-banner-marquee-20260904.yml
          git config user.name "swipess-fix-bot"
          git config user.email "woorkify@gmail.com"
          git add -A
          git commit -m "fix(ai): make header prompts a true marquee"
          git push origin HEAD:main
