name: Expand AI listing photo panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-media-panel-height.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Expand the AI listing photo browser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart')
          source = path.read_text()
          old = '''        IntrinsicHeight(
            child: Row(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                Expanded(flex: 4, child: _buildVideoPanel()),
                SizedBox(width: 9),
                Expanded(flex: 3, child: _buildPhotoPanel()),
              ],
            ),
          ),'''
          new = '''        Row(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Expanded(
                flex: 4,
                child: SizedBox(height: 118, child: _buildVideoPanel()),
              ),
              SizedBox(width: 9),
              Expanded(
                flex: 3,
                child: SizedBox(height: 260, child: _buildPhotoPanel()),
              ),
            ],
          ),'''
          if new in source:
              print('AI media panel already expanded.')
          elif old not in source:
              raise SystemExit('AI media layout marker not found; refusing an unsafe patch')
          else:
              path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit the UI fix
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart
          git commit -m 'Expand AI listing photo browser'
          git push origin HEAD:main