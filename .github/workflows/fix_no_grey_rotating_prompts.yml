name: Verify events and AI prompts

on:
  push:
    branches:
      - "fix/no-grey-rotating-ai-prompts"

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply Events compositor fix
        run: python3 tool/fix_no_grey_events.py
      - name: Format changed Dart files
        run: dart format lib/src/features/events/presentation/screens/events_screen.dart lib/src/core/widgets/glow_search_bar.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze
      - name: Build web release
        run: flutter build web --release
      - name: Commit verified changes
        shell: bash
        run: |
          rm -f .github/workflows/fix_no_grey_rotating_prompts.yml
          rm -f tool/fix_no_grey_events.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(events): remove grey layer and rotate AI search prompts"
          git push origin HEAD:fix/no-grey-rotating-ai-prompts
