name: Fix web video startup buffering

on:
  push:
    branches:
      - fix-web-video-startup-buffer-20260903
    paths:
      - .github/workflows/fix-web-video-startup-buffer-20260903.yml
      - tool/fix_web_video_startup_buffer_20260903.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply guarded startup patch
        run: python3 tool/fix_web_video_startup_buffer_20260903.py

      - name: Format
        run: dart format lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Production web build
        run: flutter build web --release

      - name: Commit verified fix to branch
        shell: bash
        run: |
          git config user.name "swipess-video-ci"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(video): Prebuffer web previews before playback"
          git push origin HEAD:fix-web-video-startup-buffer-20260903
