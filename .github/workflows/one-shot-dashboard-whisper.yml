name: Dashboard Whisper accuracy patch

on:
  push:
    branches:
      - fix/dashboard-whisper-accuracy
    paths:
      - .github/workflows/one-shot-dashboard-whisper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/dashboard-whisper-accuracy
          fetch-depth: 0

      - name: Apply voice accuracy patch
        run: python3 .github/patch_dashboard_whisper_accuracy.py

      - name: Commit patched source
        run: |
          git config user.name "Swipess Voice Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(voice): use Whisper audio as dashboard transcript authority"
          git push origin HEAD:fix/dashboard-whisper-accuracy
