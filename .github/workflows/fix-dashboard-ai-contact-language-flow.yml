name: Fix dashboard AI contact and language flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dashboard-ai-contact-language-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Intel patch tolerant to formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/fix_dashboard_ai_contact_language_flow.py')
          s = p.read_text()
          s = s.replace('if count < 2:', 'if count < 1:', 1)
          p.write_text(s)
          PY

      - name: Apply dashboard AI flow patch
        run: python3 .github/scripts/fix_dashboard_ai_contact_language_flow.py

      - name: Ensure both Intel AI paths carry reply language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart')
          s = p.read_text()
          pattern = r"(?m)^(\s*)'radiusKm': loc\.radiusKm,\n(?!\s*'responseLanguage')"
          def repl(m):
              indent = m.group(1)
              return (
                  m.group(0)
                  + f"{indent}'responseLanguage':\n"
                  + f"{indent}    ref.read(voiceLanguageProvider).displayName,\n"
              )
          s, count = re.subn(pattern, repl, s)
          if "'responseLanguage':" not in s:
              raise SystemExit('Intel response language was not applied')
          p.write_text(s)
          print(f'patched remaining Intel language blocks: {count}')
          PY

      - name: Isolate contact drilldown and cap full-chat cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          glow = Path('lib/src/core/widgets/glow_search_bar.dart')
          s = glow.read_text()
          if "import 'dart:convert';" not in s:
              s = s.replace("import 'dart:async';\n", "import 'dart:async';\nimport 'dart:convert';\n", 1)

          contact_fn = r'''  void _openContactInChat(Map<String, dynamic> data) {
            final name = (data['name'] ?? data['full_name'] ?? data['title'])
                ?.toString()
                .trim();
            if (name == null || name.isEmpty) return;
            AppHaptics.selection();
            final encoded = base64UrlEncode(utf8.encode(jsonEncode(data)));
            _dismissInlineAi();
            widget.onSubmitted?.call('__swipess_contact__:$encoded');
          }
          '''
          s, count = re.subn(
              r"  void _openContactInChat\(Map<String, dynamic> data\) \{.*?\n  \}\n\n(?=  Widget _inlineAiPanel)",
              lambda _: contact_fn + "\n",
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'contact drilldown function match count={count}')
          glow.write_text(s)

          intel = Path('lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart')
          s = intel.read_text()
          new_seed = r'''    final seed = widget.initialQuery.trim();
            if (seed.isNotEmpty) _privacyAccepted = true;
            if (seed.isNotEmpty) {
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (!mounted || _bootstrapped) return;
                _bootstrapped = true;
                const prefix = '__swipess_contact__:';
                if (seed.startsWith(prefix)) {
                  try {
                    final decoded = jsonDecode(
                      utf8.decode(base64Url.decode(seed.substring(prefix.length))),
                    );
                    if (decoded is Map) {
                      final data = Map<String, dynamic>.from(decoded);
                      final name = (data['name'] ??
                              data['full_name'] ??
                              data['title'] ??
                              'this contact')
                          .toString()
                          .trim();
                      final payload = base64Encode(
                        utf8.encode(jsonEncode([data])),
                      );
                      setState(() {
                        _messages
                          ..clear()
                          ..add(
                            IntelChatBubble(
                              id: _newId(),
                              role: 'assistant',
                              content:
                                  'Here is ${name.isEmpty ? 'this contact' : name}. '
                                  'This chat is focused only on this contact.\n'
                                  '[DRAFT:local_brain:{"payload":"$payload"}]',
                            ),
                          );
                      });
                      _scrollToEnd();
                      return;
                    }
                  } catch (_) {}
                  setState(() {
                    _messages
                      ..clear()
                      ..add(
                        IntelChatBubble(
                          id: _newId(),
                          role: 'assistant',
                          content: 'I could not open that contact. Please try again.',
                        ),
                      );
                  });
                  return;
                }
                _controller.text = seed;
                _submit(seed);
              });
            }
          }

          @override
          void dispose'''
          s, count = re.subn(
              r"    final seed = widget\.initialQuery\.trim\(\);.*?\n  \}\n\n  @override\n  void dispose",
              lambda _: new_seed,
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Intel seed block match count={count}')
          intel.write_text(s)

          bubble = Path('lib/src/features/ai/presentation/widgets/intel_message_bubble.dart')
          s = bubble.read_text()
          s = s.replace('for (final entry in parsed.localBrain)', 'for (final entry in parsed.localBrain.take(5))', 1)
          s = s.replace('for (final listing in parsed.listings)', 'for (final listing in parsed.listings.take(3))', 1)
          s = s.replace('for (final profile in parsed.profiles)', 'for (final profile in parsed.profiles.take(5))', 1)
          bubble.write_text(s)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched Dart files
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart lib/src/features/ai/presentation/widgets/intel_message_bubble.dart lib/src/features/ai/presentation/providers/voice_language_provider.dart lib/src/features/ai/presentation/widgets/voice_language_selector.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze touched Dart files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart lib/src/features/ai/presentation/widgets/intel_message_bubble.dart lib/src/features/ai/presentation/providers/voice_language_provider.dart lib/src/features/ai/presentation/widgets/voice_language_selector.dart

      - name: Sanity-check Edge Function and drilldown markers
        run: |
          grep -q "DASHBOARD COMPACT MODE" supabase/functions/ai-concierge/index.ts
          grep -q "LANGUAGE LOCK" supabase/functions/ai-concierge/index.ts
          grep -q "exactNamed" supabase/functions/ai-concierge/index.ts
          grep -q "__swipess_contact__" lib/src/core/widgets/glow_search_bar.dart
          grep -q "focused only on this contact" lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart

      - name: Commit AI flow fix
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git add lib/src/core/widgets/glow_search_bar.dart \
                  lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart \
                  lib/src/features/ai/presentation/widgets/intel_message_bubble.dart \
                  supabase/functions/ai-concierge/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ai): compact dashboard contacts and lock voice language"
          git restore .github/scripts/fix_dashboard_ai_contact_language_flow.py pubspec.lock || true
          git pull --rebase origin main
          git push origin HEAD:main
