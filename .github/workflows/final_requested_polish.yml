name: Final requested polish

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-requested-polish-main
  cancel-in-progress: true

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply requested UI fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_required(pattern, repl, text, label):
              out, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} anchor not found')
              return out

          # EVENTS — eye becomes a persistent manual ON/OFF switch.
          p = Path('lib/src/features/events/presentation/screens/events_screen.dart')
          s = p.read_text()
          s = s.replace("import 'dart:async';\n", '')
          s = s.replace('  Timer? _chromeTimer;\n', '')
          s = s.replace('\n  static const _chromeVisibleFor = Duration(milliseconds: 2800);\n', '')
          s = s.replace('    _chromeTimer?.cancel();\n    _pages.dispose();', '    _pages.dispose();')
          if 'void _scheduleHide()' in s:
              s = sub_required(
                  r'\n\s*void _scheduleHide\(\) \{.*?\n\s*\}\n\s*\n\s*void _revealChrome\(\{bool autoHide = true\}\) \{.*?\n\s*\}\n',
                  "\n  void _revealChrome({bool autoHide = true}) {\n    if (!mounted) return;\n    if (!_eventChromeVisible) setState(() => _eventChromeVisible = true);\n    ref.read(chromeVisibilityProvider.notifier).show();\n  }\n",
                  s,
                  'event chrome timer',
              )
          if '_FocusOrb(onTap: _revealChrome)' in s:
              s = sub_required(
                  r'\s*if \(!_eventChromeVisible\)\s*Positioned\(\s*right: 14,\s*bottom: bottomSafe \+ 18,\s*child: _FocusOrb\(onTap: _revealChrome\),\s*\),',
                  "\n              Positioned(\n                right: 14,\n                bottom: bottomSafe + 18,\n                child: _FocusOrb(\n                  controlsVisible: _eventChromeVisible,\n                  onTap: _toggleChrome,\n                ),\n              ),",
                  s,
                  'event focus orb position',
              )
          if 'const _FocusOrb({required this.onTap});' in s:
              s = sub_required(
                  r'class _FocusOrb extends StatelessWidget \{\s*const _FocusOrb\(\{required this\.onTap\}\);\s*final VoidCallback onTap;',
                  "class _FocusOrb extends StatelessWidget {\n  const _FocusOrb({required this.controlsVisible, required this.onTap});\n  final bool controlsVisible;\n  final VoidCallback onTap;",
                  s,
                  'event focus orb class',
              )
          s = s.replace(
              "      label: 'Show event controls and navigation',",
              "      label: controlsVisible ? 'Hide event controls and navigation' : 'Show event controls and navigation',",
          )
          s = re.sub(
              r'onTap: \(\) \{\s*AppHaptics\.light\(\);\s*onTap\(\);\s*\},',
              'onTap: onTap,',
              s,
              count=1,
          )
          s = s.replace(
              'child: const Icon(Icons.visibility_outlined, color: Colors.white, size: 18),',
              'child: Icon(controlsVisible ? Icons.visibility_off_outlined : Icons.visibility_outlined, color: Colors.white, size: 18),',
          )
          p.write_text(s)

          # BOTTOM NAV — shorter pill and horizontal swipe left/right.
          p = Path('lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart')
          s = p.read_text()
          s = s.replace('constraints: const BoxConstraints(maxWidth: 340),', 'constraints: const BoxConstraints(maxWidth: 292),')
          s = s.replace('                  height: 50,', '                  height: 48,')
          if 'AlwaysScrollableScrollPhysics' not in s:
              s = sub_required(
                  r'child:\s*Row\(\s*children:\s*\[\s*for \(final item in items\)\s*Expanded\(\s*child:\s*DockButton\(\s*item: item,\s*wash: item\.wash,\s*selected: selectedTab == item\.id,\s*onTap: \(\) \{\s*AppHaptics\.light\(\);\s*onTabSelected\(item\.id\);\s*\},\s*\),\s*\),\s*\],\s*\),',
                  "child: SingleChildScrollView(\n                    scrollDirection: Axis.horizontal,\n                    physics: const BouncingScrollPhysics(parent: AlwaysScrollableScrollPhysics()),\n                    child: Row(\n                      children: [\n                        for (final item in items)\n                          SizedBox(\n                            width: 40,\n                            child: DockButton(\n                              item: item,\n                              wash: item.wash,\n                              selected: selectedTab == item.id,\n                              onTap: () {\n                                AppHaptics.light();\n                                onTabSelected(item.id);\n                              },\n                            ),\n                          ),\n                      ],\n                    ),\n                  ),",
                  s,
                  'dock scroll',
              )
          p.write_text(s)

          # CITY CHIPS — compact and no artificial right-side cut.
          p = Path('lib/src/features/map/presentation/widgets/map_city_chips.dart')
          s = p.read_text()
          s = s.replace('      height: 38,', '      height: 36,')
          s = s.replace('        clipBehavior: Clip.hardEdge,', '        clipBehavior: Clip.antiAlias,')
          s = s.replace('        padding: const EdgeInsets.fromLTRB(12, 0, 28, 0),', '        padding: const EdgeInsets.symmetric(horizontal: 4),')
          s = s.replace('                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),', '                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),')
          p.write_text(s)

          # MAP FILTER — horizontal ALL / LISTINGS / USERS liquid-glass pill.
          Path('lib/src/features/map/presentation/widgets/map_layer_rail.dart').write_text("""import 'dart:ui';

          import 'package:flutter/material.dart';
          import 'package:flutter_swipes/src/core/utils/app_haptics.dart';
          import 'package:google_fonts/google_fonts.dart';

          class MapLayerRail extends StatelessWidget {
            const MapLayerRail({
              super.key,
              required this.layer,
              required this.listingCount,
              required this.peopleCount,
              required this.onLayer,
            });

            final String layer;
            final int listingCount;
            final int peopleCount;
            final ValueChanged<String> onLayer;

            @override
            Widget build(BuildContext context) {
              return ClipRRect(
                borderRadius: BorderRadius.circular(999),
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: 22, sigmaY: 22),
                  child: Container(
                    height: 40,
                    padding: const EdgeInsets.all(3),
                    decoration: BoxDecoration(
                      color: Colors.black.withAlpha(86),
                      borderRadius: BorderRadius.circular(999),
                      border: Border.all(color: Colors.white.withAlpha(52), width: .8),
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        _LayerChoice(icon: Icons.public_rounded, label: 'ALL', selected: layer == 'all', onTap: () => onLayer('all')),
                        _LayerChoice(icon: Icons.apartment_rounded, label: 'LISTINGS', count: listingCount, selected: layer == 'listings', onTap: () => onLayer('listings')),
                        _LayerChoice(icon: Icons.people_alt_rounded, label: 'USERS', count: peopleCount, selected: layer == 'people', onTap: () => onLayer('people')),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class _LayerChoice extends StatelessWidget {
            const _LayerChoice({required this.icon, required this.label, required this.selected, required this.onTap, this.count});
            final IconData icon;
            final String label;
            final bool selected;
            final VoidCallback onTap;
            final int? count;

            @override
            Widget build(BuildContext context) {
              return Semantics(
                button: true,
                selected: selected,
                label: count == null ? label : '$label, $count results',
                child: GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTap: () { AppHaptics.selection(); onTap(); },
                  child: AnimatedContainer(
                    duration: const Duration(milliseconds: 160),
                    height: 34,
                    padding: const EdgeInsets.symmetric(horizontal: 9),
                    decoration: BoxDecoration(
                      color: selected ? Colors.white.withAlpha(36) : Colors.transparent,
                      borderRadius: BorderRadius.circular(999),
                      border: selected ? Border.all(color: Colors.white.withAlpha(52), width: .7) : null,
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Icon(icon, color: selected ? const Color(0xFFFF6B35) : Colors.white.withAlpha(220), size: 15),
                        const SizedBox(width: 5),
                        Text(label, style: GoogleFonts.plusJakartaSans(color: Colors.white, fontSize: 8.5, fontWeight: FontWeight.w900, letterSpacing: .55)),
                        if (count != null) ...[
                          const SizedBox(width: 4),
                          Text('$count', style: GoogleFonts.plusJakartaSans(color: Colors.white70, fontSize: 9, fontWeight: FontWeight.w800)),
                        ],
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class MapHudCircle extends StatelessWidget {
            const MapHudCircle({super.key, required this.icon, required this.onTap, this.selected = false, this.accent = false, this.semanticLabel});
            final IconData icon;
            final VoidCallback onTap;
            final bool selected;
            final bool accent;
            final String? semanticLabel;

            @override
            Widget build(BuildContext context) {
              final control = GestureDetector(
                behavior: HitTestBehavior.opaque,
                onTap: onTap,
                child: SizedBox(
                  width: 44,
                  height: 44,
                  child: Center(
                    child: ClipOval(
                      child: BackdropFilter(
                        filter: ImageFilter.blur(sigmaX: 20, sigmaY: 20),
                        child: AnimatedContainer(
                          duration: const Duration(milliseconds: 160),
                          width: 38,
                          height: 38,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: (selected || accent) ? Colors.white.withAlpha(220) : Colors.black.withAlpha(92),
                            border: Border.all(color: (selected || accent) ? Colors.white.withAlpha(230) : Colors.white.withAlpha(62), width: .9),
                          ),
                          child: Icon(icon, color: (selected || accent) ? const Color(0xFF111318) : Colors.white.withAlpha(238), size: 18),
                        ),
                      ),
                    ),
                  ),
                ),
              );
              if (semanticLabel == null) return control;
              return Semantics(button: true, selected: selected, label: semanticLabel, child: Tooltip(message: semanticLabel!, child: control));
            }
          }
          """)

          # LIVE MAP — filters join the top row; city scroller opens full width underneath.
          p = Path('lib/src/features/map/presentation/screens/live_map_screen.dart')
          s = p.read_text()
          if "semanticLabel: 'Cities'" not in s:
              s = sub_required(
                  r'MapHudCircle\(\s*icon: Icons\.search_rounded,\s*onTap: \(\) => setState\(\(\) \{\s*_citiesOpen = !_citiesOpen;\s*_radiusOpen = false;\s*\}\),\s*\),\s*const Spacer\(\),',
                  "MapHudCircle(\n                      icon: Icons.location_city_rounded,\n                      selected: _citiesOpen,\n                      semanticLabel: 'Cities',\n                      onTap: () => setState(() {\n                        _citiesOpen = !_citiesOpen;\n                        _radiusOpen = false;\n                      }),\n                    ),\n                    const SizedBox(width: 8),\n                    Expanded(\n                      child: SingleChildScrollView(\n                        scrollDirection: Axis.horizontal,\n                        physics: const BouncingScrollPhysics(parent: AlwaysScrollableScrollPhysics()),\n                        child: MapLayerRail(\n                          layer: _layer,\n                          listingCount: listingPins.length,\n                          peopleCount: profilePins.length,\n                          onLayer: (layer) => setState(() {\n                            _layer = layer;\n                            _selected = null;\n                          }),\n                        ),\n                      ),\n                    ),",
                  s,
                  'live map top controls',
              )
          if 'right: 64,' in s:
              s = sub_required(
                  r'Positioned\(\s*top: pad\.top \+ 56,\s*left: 0,\s*right: 64,\s*child: _MapHudVisibility\(\s*visible: _hudVisible,\s*child: MapCityChips\(',
                  "if (_citiesOpen)\n            Positioned(\n              top: pad.top + 56,\n              left: 12,\n              right: 12,\n              child: _MapHudVisibility(\n                visible: _hudVisible,\n                child: MapCityChips(",
                  s,
                  'live map city scroller',
              )
          layer_start = '          Positioned(\n            right: 12,\n            top: pad.top + 60,'
          next_block = '\n\n          Positioned(\n            left: 12,\n            right: 12,\n            bottom: pad.bottom + 12,'
          if layer_start in s:
              a = s.index(layer_start)
              b = s.index(next_block, a)
              s = s[:a] + s[b + 2:]
          p.write_text(s)
          PY
      - name: Format changed Dart files
        run: dart format lib/src/features/events/presentation/screens/events_screen.dart lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart lib/src/features/map/presentation/widgets/map_city_chips.dart lib/src/features/map/presentation/widgets/map_layer_rail.dart lib/src/features/map/presentation/screens/live_map_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit verified fixes to main
        shell: bash
        run: |
          rm .github/workflows/final_requested_polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/events/presentation/screens/events_screen.dart lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart lib/src/features/map/presentation/widgets/map_city_chips.dart lib/src/features/map/presentation/widgets/map_layer_rail.dart lib/src/features/map/presentation/screens/live_map_screen.dart .github/workflows/final_requested_polish.yml
          git commit -m 'fix: keep event eye manual and make map controls readable'
          git push origin HEAD:main
