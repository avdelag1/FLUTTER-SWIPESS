name: Final requested polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply requested Events and secret-code polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/final_polish.py
          python3 /tmp/final_polish.py
      - name: Format changed Dart files
        run: dart format lib/src/features/events/presentation/screens/events_screen.dart lib/src/features/auth/presentation/screens/access_code_gate_screen.dart
      - name: Dependencies
        run: flutter pub get
      - name: Analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Web release build
        run: flutter build web --release
      - name: Commit verified polish to main
        shell: bash
        run: |
          rm .github/workflows/final_requested_polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/events/presentation/screens/events_screen.dart lib/src/features/auth/presentation/screens/access_code_gate_screen.dart .github/workflows/final_requested_polish.yml
          git commit -m 'fix: finalize event visibility and access download prompts'
          git push origin HEAD:main
