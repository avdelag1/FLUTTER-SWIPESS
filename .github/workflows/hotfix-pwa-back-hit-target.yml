                  onTap: widget.onBack!,
                ),
              ),
            ),
          Center(
'''
          new_head = '''        children: [
          Center(
'''
          if old_head not in text:
            raise SystemExit('Expected back-button head block not found')
          text = text.replace(old_head, new_head, 1)

          old_tail = '''          ),
        ],
      ),
    );
  }
}

