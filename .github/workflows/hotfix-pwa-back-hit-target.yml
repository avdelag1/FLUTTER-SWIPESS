name: One-shot PWA back hit-target fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put empty-state back button above scroll hit layer
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/src/features/swipes/presentation/widgets/swipe_exhausted_state.dart')
          text = path.read_text()

