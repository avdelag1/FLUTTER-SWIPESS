          path.write_text(text)
      - name: Remove one-shot workflow
        run: git rm .github/workflows/hotfix-pwa-back-hit-target.yml
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/swipes/presentation/widgets/swipe_exhausted_state.dart
          git commit -m "fix(pwa): keep empty-state back button above scroll hit layer"
