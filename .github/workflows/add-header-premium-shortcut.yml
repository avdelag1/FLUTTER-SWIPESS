name: Add header Premium shortcut

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-header-premium-shortcut.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current header
        shell: bash
        run: |
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/src/core/widgets/app_top_bar.dart')
          s = p.read_text()

          token_key = "key: const ValueKey('header-tokens')"
          if token_key not in s:
              raise SystemExit('header tokens control not found')

          start = s.index(token_key)
          end_marker = "              ],\n            ),\n          ),\n        ),\n        Row("
          end = s.index(end_marker, start)

          token_block = s[start:end]
          if 'Icons.workspace_premium_rounded' in token_block:
              token_block = token_block.replace(
                  'Icons.workspace_premium_rounded',
                  'Icons.toll_rounded',
                  1,
              )

          if "ValueKey('header-premium')" not in s:
              premium = """                SizedBox(width: chromeGap),
                _HudButton(
                  key: const ValueKey('header-premium'),
                  semanticLabel: 'Open Premium packages',
                  onTap: () {
                    AppHaptics.medium();
                    ref.read(overlayModalsProvider.notifier).closeAll();
                    context.push(AppPaths.subscriptionPackages);
                  },
                  child: const Icon(
                    Icons.workspace_premium_rounded,
                    size: 20,
                    color: Color(0xFFFFB800),
                  ),
                ),
"""
              s = s[:start] + token_block + premium + s[end:]
          else:
              s = s[:start] + token_block + s[end:]

          p.write_text(s)
          PY

          dart format lib/src/core/widgets/app_top_bar.dart || true
          grep -q "ValueKey('header-premium')" lib/src/core/widgets/app_top_bar.dart
          grep -q "context.push(AppPaths.subscriptionPackages)" lib/src/core/widgets/app_top_bar.dart
          grep -q "Icons.toll_rounded" lib/src/core/widgets/app_top_bar.dart

      - name: Commit real source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/core/widgets/app_top_bar.dart
          git rm .github/workflows/add-header-premium-shortcut.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add Premium shortcut next to Tokens"
          git push origin main
