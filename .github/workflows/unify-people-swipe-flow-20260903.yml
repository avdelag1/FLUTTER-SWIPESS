name: Unify people swipe flow 20260903

on:
  push:
    paths:
      - 'tool/unify_people_swipe_flow_20260903.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply people swipe patch
        run: python tool/unify_people_swipe_flow_20260903.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Unify people discovery with listing swipe cards"
          git push
