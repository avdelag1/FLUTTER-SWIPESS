name: Fix Events single tap play 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-events-single-tap-play-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 tool/fix_events_single_tap_play_20260904.py
      - name: Verify
        run: grep -q "if (next) _externallyPaused = false" lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart
          git commit -m "fix(events): play on first explicit tap"
          git push origin HEAD:main
