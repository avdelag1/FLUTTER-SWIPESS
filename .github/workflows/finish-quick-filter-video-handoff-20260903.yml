name: Finish quick filter video handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-quick-filter-video-handoff-20260903.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Apply patch
        run: python3 .github/scripts/finish_quick_filter_video_handoff_20260903.py
      - name: Format touched files
        run: |
          dart format lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart lib/src/features/events/presentation/screens/event_detail_screen.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart
      - name: Analyze touched files
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart lib/src/features/events/presentation/screens/event_detail_screen.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'swipess-video-hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart lib/src/features/dashboard/presentation/widgets/events_teaser_card_v2.dart lib/src/features/events/presentation/screens/event_detail_screen.dart lib/src/features/swipes/presentation/utils/open_swipe_deck.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart
          git commit -m 'Make dashboard listing video handoff instant and exclusive'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
