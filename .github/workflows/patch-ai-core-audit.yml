name: Apply AI core audit fixes

on:
  push:
    paths:
      - '.github/workflows/patch-ai-core-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply AI identity, voice parity, and recent-context memory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Intel Core: same final transcript normalization as Dashboard,
          # selected voice language for TTS, SWIPESS identity, recent context.
          p = Path('lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart')
          s = p.read_text()
          mem_import = "import 'package:flutter_swipes/src/features/ai/data/repositories/memory_repository.dart';\n"
          anchor = "import 'package:flutter_swipes/src/features/ai/data/repositories/ai_edge_repository.dart';\n"
          if mem_import not in s:
              s = s.replace(anchor, anchor + mem_import)
          s = s.replace("('default', 'Google Gemini', 'Global Discovery', _aiBlue),", "('default', 'SWIPESS AI', 'Personal Concierge', _aiBlue),")
          s = s.replace(
              "await _tts.setLanguage(\n        ref.read(appLocaleProvider).isEs ? 'es-MX' : 'en-US',\n      );",
              "await _tts.setLanguage(ref.read(voiceLanguageProvider).localeCode);",
          )
          s = s.replace(
              "final q = (preset ?? _controller.text).trim();",
              "final q = normalizeVoiceTranscript((preset ?? _controller.text).trim());",
          )
          memory_anchor = "    final parsed = ConciergeParse.of(reply);\n"
          memory_block = """    final parsed = ConciergeParse.of(reply);\n    final cleanMemoryReply = parsed.cleanContent.trim();\n    if (cleanMemoryReply.isNotEmpty &&\n        !cleanMemoryReply.toLowerCase().contains('temporarily unavailable')) {\n      unawaited(\n        ref.read(memoryRepositoryProvider).upsertRecentContext(\n          userText: q,\n          assistantText: cleanMemoryReply,\n        ),\n      );\n    }\n"""
          if "cleanMemoryReply" not in s:
              if memory_anchor not in s:
                  raise SystemExit('Intel memory anchor missing')
              s = s.replace(memory_anchor, memory_block, 1)
          p.write_text(s)

          # Dashboard inline AI: SWIPESS identity + same cross-session handoff note.
          p = Path('lib/src/core/widgets/glow_search_bar.dart')
          s = p.read_text()
          mem_import = "import 'package:flutter_swipes/src/features/ai/data/repositories/memory_repository.dart';\n"
          anchor = "import 'package:flutter_swipes/src/features/ai/data/repositories/ai_edge_repository.dart';\n"
          if mem_import not in s:
              s = s.replace(anchor, anchor + mem_import)
          s = s.replace("featureName: 'Google Gemini'", "featureName: 'SWIPESS AI'")
          s = s.replace("'Google Gemini is thinking…'", "'SWIPESS AI is thinking…'")
          s = s.replace("'GOOGLE GEMINI'", "'SWIPESS AI'")
          dash_anchor = """      setState(() {\n        _inlineAiLoading = false;\n        _inlineAnswer = answer;\n        _inlineLocalBrain = brain;\n        _inlineProfiles = specificPersonQuery\n            ? const <Map<String, dynamic>>[]\n            : parsed.profiles;\n        _inlineListings = parsed.listings;\n      });\n"""
          dash_memory = dash_anchor + """      if (answer.trim().isNotEmpty &&\n          !answer.toLowerCase().contains('temporarily unavailable')) {\n        unawaited(\n          ref.read(memoryRepositoryProvider).upsertRecentContext(\n            userText: input,\n            assistantText: answer,\n          ),\n        );\n      }\n"""
          if "userText: input" not in s:
              if dash_anchor not in s:
                  raise SystemExit('Dashboard memory anchor missing')
              s = s.replace(dash_anchor, dash_memory, 1)
          p.write_text(s)

          # Product-facing identity: provider details remain in AiDisclosure only.
          replacements = {
              'lib/src/features/ai/presentation/widgets/memory_drawer.dart': [
                  ('Manage what Google Gemini keeps for you', 'Manage what SWIPESS AI remembers for you'),
              ],
              'lib/src/features/ai/presentation/widgets/magic_ai_profile_sheet.dart': [
                  ("featureName: 'Google Gemini'", "featureName: 'SWIPESS AI'"),
              ],
              'lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart': [
                  ("NavTab.ai => 'Google Gemini'", "NavTab.ai => 'SWIPESS AI'"),
              ],
              'lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart': [
                  ("featureName: 'Google Gemini'", "featureName: 'SWIPESS AI'"),
              ],
              'lib/src/features/dashboard/presentation/screens/dashboard_shell.dart': [
                  ("featureName: 'Google Gemini'", "featureName: 'SWIPESS AI'"),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Format touched Dart
        run: dart format lib/src/features/ai/data/repositories/memory_repository.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/widgets/memory_drawer.dart lib/src/features/ai/presentation/widgets/magic_ai_profile_sheet.dart lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
      - name: Voice and AI intent regression tests
        run: flutter test test/voice_transcript_preservation_test.dart test/ai_person_search_intent_test.dart test/intel_core_welcome_test.dart
      - name: Analyze touched AI surfaces
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/features/ai/data/repositories/memory_repository.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/widgets/memory_drawer.dart lib/src/features/ai/presentation/widgets/magic_ai_profile_sheet.dart lib/src/features/dashboard/presentation/widgets/dashboard_dock.dart lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
      - name: Commit verified AI fixes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/patch-ai-core-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Strengthen Swipess AI voice identity and memory'
            git push origin main
          fi
