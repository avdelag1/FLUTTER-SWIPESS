name: Guarantee exact quick filter card handoff

on:
  push:
    paths:
      - '.github/workflows/guarantee-quick-filter-exact-card-20260903.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact-card handoff repair
        run: python3 tool/guarantee_quick_filter_exact_card_20260903.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/swipes/presentation/utils/open_swipe_deck.dart \
            lib/src/features/swipes/presentation/screens/client_swipe_container.dart

      - name: Analyze touched surfaces
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/src/features/swipes/presentation/utils/open_swipe_deck.dart \
            lib/src/features/swipes/presentation/screens/client_swipe_container.dart

      - name: Validate diff
        run: git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "swipess-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            lib/src/features/swipes/presentation/utils/open_swipe_deck.dart \
            lib/src/features/swipes/presentation/screens/client_swipe_container.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Guarantee exact quick filter card handoff"
            git push origin main
          fi
