name: Fix native blur and map regressions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-native-blur-map-regressions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch blur, map intro, likes and preview close
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) The native AppTopBar BackdropFilter was not clipped to the header
          # bounds. On iOS it can blur the entire composited page until chrome
          # hides on scroll. Remove that live filter entirely.
          topbar_path = Path('lib/src/core/widgets/app_top_bar.dart')
          topbar = topbar_path.read_text()
          topbar = topbar.replace("import 'dart:ui';\n\n", '', 1)
          pattern = re.compile(
              r"child:\s*kIsWeb\s*\?\s*_headerChrome\(context, isLight: isLight, ink: ink, child: headerRow\)\s*:\s*BackdropFilter\(\s*filter:\s*ImageFilter\.blur\(sigmaX:\s*22,\s*sigmaY:\s*22\),\s*child:\s*_headerChrome\(\s*context,\s*isLight:\s*isLight,\s*ink:\s*ink,\s*child:\s*headerRow,\s*\),\s*\),",
              re.S,
          )
          replacement = "child: _headerChrome(\n          context,\n          isLight: isLight,\n          ink: ink,\n          child: headerRow,\n        ),"
          topbar, count = pattern.subn(replacement, topbar, count=1)
          if count != 1:
              raise SystemExit(f'AppTopBar blur matcher count={count}')
          if 'ImageFilter.blur(sigmaX: 22, sigmaY: 22)' in topbar:
              raise SystemExit('global AppTopBar blur still present')
          topbar_path.write_text(topbar)

          # 2) The native map bootstrap was hard-coded to skip the globe intro.
          # A fresh map open should always show the cinematic globe, while the
          # preserved map instance still avoids replaying when returning from a
          # listing/profile detail.
          mobile_path = Path('lib/src/features/map/presentation/screens/platform_discovery_map_impl_mobile.dart')
          mobile = mobile_path.read_text()
          mobile = re.sub(
              r"// The globe is a cinematic arrival, not a loading tax\..*?_nativeMapIntroShownThisSession = false;\n\n",
              "// Each fresh Map open starts with the cinematic globe. The overlay host\n// keeps the same map State alive while a detail route is pushed, so Back does\n// not replay the intro or reset camera/pins.\n",
              mobile,
              count=1,
              flags=re.S,
          )
          old_init = """    _audioNotifier = ref.read(deckSoundOnProvider.notifier);
    _showIntro = false;"""
          new_init = """    _audioNotifier = ref.read(deckSoundOnProvider.notifier);
    _showIntro = true;"""
          if old_init not in mobile:
              raise SystemExit('native map init intro assignment not found')
          mobile = mobile.replace(old_init, new_init, 1)
          old_retry = """    setState(() {
      _showIntro = false;
      _mapboxReady = _configureMapbox();
    });"""
          new_retry = """    setState(() {
      _showIntro = true;
      _mapboxReady = _configureMapbox();
    });"""
          if old_retry not in mobile:
              raise SystemExit('native map retry intro assignment not found')
          mobile = mobile.replace(old_retry, new_retry, 1)
          mobile = mobile.replace(
              "              _nativeMapIntroShownThisSession = true;\n              _showIntro = false;",
              "              _showIntro = false;",
              1,
          )
          if '_nativeMapIntroShownThisSession' in mobile:
              raise SystemExit('stale per-session intro flag remains')
          mobile_path.write_text(mobile)

          # 3) Do not paint known-liked listings while the canonical like IDs are
          # still loading. Use both the direct ID provider and loaded liked models
          # as a fallback, then render discovery listings only once that state is
          # reliable. This prevents saved listings flashing/reappearing on Map.
          map_path = Path('lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart')
          map_src = map_path.read_text()
          old_likes = """    final likedListings =
        ref.read(likedListingIdsProvider).value ?? const <String>{};
    final likedPeople =
        ref.read(likedPeopleIdsProvider).value ?? const <String>{};
    final likedEvents =
        ref.read(likedEventIdsProvider).value ?? const <String>{};
    return <_Item>[
          for (final l in listings)
            if (!likedListings.contains(l.id)) _listingItem(l, loc),"""
          new_likes = """    final likedListingIds = ref.read(likedListingIdsProvider);
    final likedListingModels = ref.read(likedListingsProvider);
    final likedListings = <String>{};
    likedListings.addAll(likedListingIds.value ?? const <String>{});
    likedListings.addAll(
      (likedListingModels.value ?? const <Listing>[]).map((listing) => listing.id),
    );
    final listingLikesStillLoading =
        likedListingIds.isLoading &&
        !likedListingIds.hasValue &&
        !likedListingModels.hasValue;
    final likedPeople =
        ref.read(likedPeopleIdsProvider).value ?? const <String>{};
    final likedEvents =
        ref.read(likedEventIdsProvider).value ?? const <String>{};
    return <_Item>[
          for (final l in listings)
            if (!listingLikesStillLoading && !likedListings.contains(l.id))
              _listingItem(l, loc),"""
          if old_likes not in map_src:
              raise SystemExit('map liked-listing block not found')
          map_src = map_src.replace(old_likes, new_likes, 1)

          # 4) The preview card itself was one giant onTap target containing the
          # X button. Make only photo/text open the detail so close/save actions
          # are physically isolated and can never bubble into the detail route.
          preview_start = map_src.find('class _Preview extends StatelessWidget {')
          preview_end = map_src.find('class _Tray extends StatefulWidget {', preview_start)
          if preview_start < 0 or preview_end < 0:
              raise SystemExit('map preview class anchors not found')
          preview = r'''class _Preview extends StatelessWidget {
  const _Preview({
    required this.item,
    required this.onOpen,
    required this.onSave,
    required this.onClose,
  });
  final _Item item;
  final VoidCallback onOpen;
  final VoidCallback onSave;
  final VoidCallback onClose;

  @override
  Widget build(BuildContext context) => Container(
    height: 86,
    padding: const EdgeInsets.all(8),
    decoration: BoxDecoration(
      color: const Color(0xFAFFFFFF),
      borderRadius: BorderRadius.circular(18),
      boxShadow: const [
        BoxShadow(
          color: Color(0x38000000),
          blurRadius: 24,
          offset: Offset(0, 10),
        ),
      ],
    ),
    child: Row(
      children: [
        Expanded(
          child: GestureDetector(
            behavior: HitTestBehavior.opaque,
            onTap: onOpen,
            child: Row(
              children: [
                _Photo(item: item, size: 68),
                const SizedBox(width: 10),
                Expanded(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        item.kind.label,
                        style: GoogleFonts.plusJakartaSans(
                          color: item.kind.color,
                          fontSize: 8.5,
                          fontWeight: FontWeight.w900,
                          letterSpacing: .45,
                          decoration: TextDecoration.none,
                        ),
                      ),
                      const SizedBox(height: 2),
                      Text(
                        item.title,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: GoogleFonts.plusJakartaSans(
                          fontSize: 13,
                          fontWeight: FontWeight.w900,
                          decoration: TextDecoration.none,
                        ),
                      ),
                      const SizedBox(height: 2),
                      Text(
                        item.subtitle,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: GoogleFonts.plusJakartaSans(
                          color: Colors.black54,
                          fontSize: 10.5,
                          fontWeight: FontWeight.w600,
                          decoration: TextDecoration.none,
                        ),
                      ),
                    ],
                  ),
                ),
              ],
            ),
          ),
        ),
        GestureDetector(
          behavior: HitTestBehavior.opaque,
          onTap: onSave,
          child: const SizedBox(
            width: 38,
            height: 58,
            child: Icon(
              Icons.favorite_border_rounded,
              color: Color(0xFFFF375F),
              size: 23,
            ),
          ),
        ),
        GestureDetector(
          behavior: HitTestBehavior.opaque,
          onTap: onClose,
          child: const SizedBox(
            width: 34,
            height: 58,
            child: Icon(
              Icons.close_rounded,
              color: Colors.black54,
              size: 18,
            ),
          ),
        ),
      ],
    ),
  );
}

'''
          map_src = map_src[:preview_start] + preview + map_src[preview_end:]
          map_path.write_text(map_src)

          # Regression guards.
          assert "child: _headerChrome(" in topbar
          assert "_showIntro = true;" in mobile
          assert "listingLikesStillLoading" in map_src
          assert "behavior: HitTestBehavior.opaque" in map_src[preview_start:preview_end + 500]
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format touched files
        run: dart format lib/src/core/widgets/app_top_bar.dart lib/src/features/map/presentation/screens/platform_discovery_map_impl_mobile.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze touched code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/core/widgets/app_top_bar.dart lib/src/features/map/presentation/screens/platform_discovery_map_impl_mobile.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart

      - name: Verify existing chrome regression test
        run: flutter test test/persistent_chrome_overlap_guard_test.dart --reporter expanded

      - name: Commit fix
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git restore pubspec.lock || true
          git add lib/src/core/widgets/app_top_bar.dart lib/src/features/map/presentation/screens/platform_discovery_map_impl_mobile.dart lib/src/features/map/presentation/screens/real_mapbox_screen_v3.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(native): remove global blur and restore map flow"
          git pull --rebase origin main
          git push origin HEAD:main
