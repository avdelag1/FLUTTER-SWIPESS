name: Fix dashboard voice submit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dashboard-voice-submit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix_dashboard_voice_submit.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/services/live_voice_input.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/services/live_voice_input.dart

      - name: Commit
        run: |
          git config user.name swipess-hotfix-bot
          git config user.email actions@users.noreply.github.com
          git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/ai/presentation/services/live_voice_input.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make dashboard live voice auto-send deterministic"
          git push origin HEAD:main
