name: Video first quick filter

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-video-first-quick-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make listing videos first
        run: python .github/patches/video_first_quick_filter.py

      - name: Commit renderer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-video-first-quick-filter.yml
          git rm .github/patches/video_first_quick_filter.py
          git add lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart
          git commit -m "Show listing video first in quick filter feeds"
          git push origin HEAD:main
