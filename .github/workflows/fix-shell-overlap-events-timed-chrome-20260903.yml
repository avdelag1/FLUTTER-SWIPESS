name: Fix shell overlap and timed Events chrome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shell-overlap-events-timed-chrome-20260903.yml'
      - 'tool/fix_shell_overlap_events_timed_chrome_20260903.py'

permissions:
  contents: write

concurrency:
  group: fix-shell-overlap-events-timed-chrome-20260903
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply shell and Events contract fix
        run: python3 tool/fix_shell_overlap_events_timed_chrome_20260903.py

      - name: Setup Dart formatter
        uses: dart-lang/setup-dart@v1

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/features/dashboard/presentation/screens/dashboard_shell.dart \
            lib/src/features/events/presentation/screens/events_screen.dart \
            lib/src/features/events/presentation/utils/open_events_feed.dart \
            test/persistent_chrome_overlap_guard_test.dart

      - name: Validate regression guards
        run: |
          git diff --check
          grep -q 'final needsPersistentChromeInsets' lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          grep -q 'location == AppPaths.messages' lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          grep -q 'location == AppPaths.exploreSeekers' lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          ! grep -q '!isEvents && chromeOpacity' lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          grep -q '_chromeVisible = true' lib/src/features/events/presentation/screens/events_screen.dart
          grep -q '_showChrome();' lib/src/features/events/presentation/screens/events_screen.dart
          grep -q 'Duration(seconds: 6)' lib/src/features/events/presentation/screens/events_screen.dart
          grep -q 'chromeVisibilityProvider.notifier).show' lib/src/features/events/presentation/utils/open_events_feed.dart

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'swipess-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/src/features/dashboard/presentation/screens/dashboard_shell.dart \
            lib/src/features/events/presentation/screens/events_screen.dart \
            lib/src/features/events/presentation/utils/open_events_feed.dart \
            test/persistent_chrome_overlap_guard_test.dart
          git commit -m 'Fix shell overlap and restore Events timed chrome'
          git push origin HEAD:main
