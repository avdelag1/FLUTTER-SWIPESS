name: Apply live voice waveform

on:
  pull_request:
    branches: [main]
    paths:
      - .github/waveform-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Intel Core and dashboard voice UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          waveform_path = root / 'lib/src/features/ai/presentation/widgets/live_audio_waveform.dart'
          waveform_path.parent.mkdir(parents=True, exist_ok=True)
          waveform_path.write_text(r'''import 'dart:async';
          import 'dart:math' as math;

          import 'package:flutter/material.dart';

          /// A compact, continuously scrolling microphone waveform.
          ///
          /// New amplitude samples enter on the right and older samples move left,
          /// so recording always looks alive even between louder syllables. The
          /// real microphone level still controls the dominant height of each bar.
          class LiveAudioWaveform extends StatefulWidget {
            const LiveAudioWaveform({
              super.key,
              required this.active,
              required this.level,
              required this.color,
              this.width = 96,
              this.height = 22,
              this.samples = 30,
            });

            final bool active;
            final double level;
            final Color color;
            final double width;
            final double height;
            final int samples;

            @override
            State<LiveAudioWaveform> createState() => _LiveAudioWaveformState();
          }

          class _LiveAudioWaveformState extends State<LiveAudioWaveform> {
            Timer? _timer;
            late List<double> _history;
            double _phase = 0;

            @override
            void initState() {
              super.initState();
              _history = List<double>.filled(math.max(8, widget.samples), .05);
              _syncTimer();
            }

            @override
            void didUpdateWidget(covariant LiveAudioWaveform oldWidget) {
              super.didUpdateWidget(oldWidget);
              if (oldWidget.samples != widget.samples) {
                final count = math.max(8, widget.samples);
                final next = List<double>.filled(count, .05);
                final copy = math.min(count, _history.length);
                for (var i = 0; i < copy; i++) {
                  next[count - copy + i] = _history[_history.length - copy + i];
                }
                _history = next;
              }
              if (oldWidget.active != widget.active) _syncTimer();
            }

            void _syncTimer() {
              _timer?.cancel();
              _timer = null;
              if (!widget.active) return;
              _timer = Timer.periodic(const Duration(milliseconds: 72), (_) => _tick());
            }

            void _tick() {
              if (!mounted || !widget.active) return;
              _phase += .62;
              final live = widget.level.clamp(0.0, 1.0).toDouble();
              final quietMotion = .07 + (((math.sin(_phase) + 1) / 2) * .07);
              final texture = .78 + (((math.sin(_phase * 1.67) + 1) / 2) * .22);
              final newest = (math.max(live, quietMotion) * texture)
                  .clamp(.04, 1.0)
                  .toDouble();

              setState(() {
                _history.removeAt(0);
                _history.add(newest);
              });
            }

            @override
            void dispose() {
              _timer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return SizedBox(
                width: widget.width,
                height: widget.height,
                child: CustomPaint(
                  painter: _WaveformPainter(
                    samples: _history,
                    color: widget.color,
                    active: widget.active,
                  ),
                ),
              );
            }
          }

          class _WaveformPainter extends CustomPainter {
            const _WaveformPainter({
              required this.samples,
              required this.color,
              required this.active,
            });

            final List<double> samples;
            final Color color;
            final bool active;

            @override
            void paint(Canvas canvas, Size size) {
              if (samples.isEmpty || size.width <= 0 || size.height <= 0) return;

              final gap = size.width / samples.length;
              final barWidth = math.max(1.35, math.min(2.8, gap * .54));
              final centerY = size.height / 2;
              final maxBarHeight = math.max(4.0, size.height - 2);
              final paint = Paint()..style = PaintingStyle.fill;

              for (var i = 0; i < samples.length; i++) {
                final sample = samples[i].clamp(0.0, 1.0).toDouble();
                final eased = Curves.easeOutCubic.transform(sample);
                final barHeight = 3.0 + ((maxBarHeight - 3.0) * eased);
                final x = (i + .5) * gap;
                final progress = samples.length <= 1 ? 1.0 : i / (samples.length - 1);
                final alpha = active ? (105 + (145 * progress)).round() : 65;
                paint.color = color.withAlpha(alpha.clamp(0, 255));
                final rect = Rect.fromCenter(
                  center: Offset(x, centerY),
                  width: barWidth,
                  height: barHeight,
                );
                canvas.drawRRect(
                  RRect.fromRectAndRadius(rect, Radius.circular(barWidth)),
                  paint,
                );
              }
            }

            @override
            bool shouldRepaint(covariant _WaveformPainter oldDelegate) =>
                oldDelegate.active != active ||
                oldDelegate.color != color ||
                oldDelegate.samples != samples;
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          def add_import(text: str, anchor: str, addition: str, label: str) -> str:
              if addition in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f'Missing import anchor in {label}: {anchor}')
              return text.replace(anchor, anchor + addition, 1)

          glow_path = root / 'lib/src/core/widgets/glow_search_bar.dart'
          glow = glow_path.read_text(encoding='utf-8')
          glow = add_import(glow, "import 'package:flutter_swipes/src/core/utils/app_haptics.dart';\n", "import 'package:flutter_swipes/src/core/widgets/breathing_widget.dart';\n", 'glow_search_bar.dart')
          glow = add_import(glow, "import 'package:flutter_swipes/src/features/ai/presentation/services/live_voice_input.dart';\n", "import 'package:flutter_swipes/src/features/ai/presentation/widgets/live_audio_waveform.dart';\n", 'glow_search_bar.dart')

          old_start = glow.find('  Widget _voiceBars(Color color) {')
          old_end = glow.find('  Widget _animatedPrompt(', old_start)
          if old_start >= 0 and old_end > old_start:
              glow = glow[:old_start] + glow[old_end:]

          prefix_start = glow.find('                            prefixIcon: _voiceActive')
          prefix_end = glow.find('                            hintStyle:', prefix_start)
          if prefix_start < 0 or prefix_end < 0:
              raise SystemExit('Could not find dashboard voice prefix block')
          glow_prefix = '''                            prefixIcon: _voiceActive
                                ? Padding(
                                    padding: const EdgeInsets.only(right: 8),
                                    child: Center(
                                      child: LiveAudioWaveform(
                                        active: _voiceActive,
                                        level: _voiceLevel,
                                        color: blue,
                                        width: 92,
                                        height: 20,
                                        samples: 30,
                                      ),
                                    ),
                                  )
                                : null,
                            prefixIconConstraints: _voiceActive
                                ? const BoxConstraints(minWidth: 104, minHeight: 38)
                                : null,
                            hintText: _voiceActive ? 'Listening…' : null,
'''
          glow = glow[:prefix_start] + glow_prefix + glow[prefix_end:]

          sem_anchor = glow.find("label: _voiceActive\n                                        ? 'Stop recording'")
          if sem_anchor < 0:
              raise SystemExit('Could not find dashboard mic semantics block')
          sem_start = glow.rfind('                                Semantics(', 0, sem_anchor)
          sem_end = glow.find('                                IconButton(', sem_anchor)
          if sem_start < 0 or sem_end < 0:
              raise SystemExit('Could not isolate dashboard mic button')
          glow_mic = '''                                Semantics(
                                  button: true,
                                  label: _voiceActive ? 'Stop recording' : 'Start voice search',
                                  child: GestureDetector(
                                    behavior: HitTestBehavior.opaque,
                                    onTap: _toggleVoice,
                                    child: AnimatedContainer(
                                      duration: const Duration(milliseconds: 150),
                                      width: 32,
                                      height: 32,
                                      decoration: BoxDecoration(
                                        color: _voiceActive ? blue : blue.withAlpha(isLight ? 18 : 34),
                                        shape: BoxShape.circle,
                                        border: Border.all(color: _voiceActive ? blue : blue.withAlpha(90)),
                                        boxShadow: _voiceActive
                                            ? [BoxShadow(color: blue.withAlpha(55), blurRadius: 12 + (_voiceLevel * 8), spreadRadius: _voiceLevel * 1.5)]
                                            : null,
                                      ),
                                      alignment: Alignment.center,
                                      child: _voiceActive
                                          ? BreathingWidget(
                                              duration: const Duration(milliseconds: 1120),
                                              minOpacity: .58,
                                              maxOpacity: 1,
                                              child: const Icon(Icons.mic_rounded, color: Colors.white, size: 18),
                                            )
                                          : Icon(Icons.mic_rounded, color: blue, size: 18),
                                    ),
                                  ),
                                ),
'''
          glow = glow[:sem_start] + glow_mic + glow[sem_end:]
          glow = glow.replace('Recording · waveform is live · tap Stop to transcribe', 'Listening · waveform moves with your voice · tap mic to stop')
          glow_path.write_text(glow, encoding='utf-8')

          intel_path = root / 'lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart'
          intel = intel_path.read_text(encoding='utf-8')
          intel = add_import(intel, "import 'package:flutter_swipes/src/features/ai/presentation/services/live_voice_input.dart';\n", "import 'package:flutter_swipes/src/features/ai/presentation/widgets/live_audio_waveform.dart';\n", 'intel_core_sheet.dart')

          tap_anchor = intel.find('                        onTap: _toggleVoice,')
          if tap_anchor < 0:
              raise SystemExit('Could not find Intel Core microphone')
          mic_start = intel.rfind('                      GestureDetector(\n', 0, tap_anchor)
          spacing = '                      const SizedBox(width: 6),\n'
          spacing_start = intel.find(spacing, tap_anchor)
          if mic_start < 0 or spacing_start < 0:
              raise SystemExit('Could not isolate Intel Core microphone block')
          mic_end = spacing_start + len(spacing)
          intel_mic = '''                      GestureDetector(
                        behavior: HitTestBehavior.opaque,
                        onTap: _toggleVoice,
                        child: AnimatedScale(
                          duration: const Duration(milliseconds: 110),
                          scale: _recording ? voiceScale : 1,
                          child: AnimatedContainer(
                            duration: const Duration(milliseconds: 160),
                            width: 38,
                            height: 38,
                            decoration: BoxDecoration(
                              color: voiceActive ? _aiBlue.withAlpha(isLight ? 28 : 48) : Colors.transparent,
                              shape: BoxShape.circle,
                              border: Border.all(color: voiceActive ? _aiBlueSoft.withAlpha(150) : Colors.transparent),
                              boxShadow: _recording
                                  ? [BoxShadow(color: _aiCyan.withAlpha(60), blurRadius: 12 + (_voiceLevel * 14), spreadRadius: _voiceLevel * 2)]
                                  : null,
                            ),
                            alignment: Alignment.center,
                            child: _recording
                                ? BreathingWidget(
                                    duration: const Duration(milliseconds: 1080),
                                    minOpacity: .55,
                                    maxOpacity: 1,
                                    child: Icon(Icons.mic_rounded, color: isLight ? _aiBlue : _aiBlueSoft, size: 19),
                                  )
                                : Icon(Icons.mic_none_rounded, color: isLight ? _aiBlue : _aiBlueSoft, size: 19),
                          ),
                        ),
                      ),
                      if (voiceActive) ...[
                        const SizedBox(width: 4),
                        LiveAudioWaveform(
                          active: _recording,
                          level: _voiceLevel,
                          color: isLight ? _aiBlue : _aiBlueSoft,
                          width: 92,
                          height: 22,
                          samples: 30,
                        ),
                        const SizedBox(width: 8),
                      ] else
                        const SizedBox(width: 6),
'''
          intel = intel[:mic_start] + intel_mic + intel[mic_end:]
          intel_path.write_text(intel, encoding='utf-8')
          print('Patched live voice waveform UI successfully.')
          PY

      - name: Commit waveform fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/ai/presentation/widgets/live_audio_waveform.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart
          git diff --cached --check
          git commit -m "fix(voice): add real scrolling waveform to AI inputs"
          git push origin HEAD:main
