name: Apply live voice waveform

on:
  pull_request:
    branches: [main]
    paths:
      - .github/waveform-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply waveform UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          wave = root / 'lib/src/features/ai/presentation/widgets/live_audio_waveform.dart'
          wave.parent.mkdir(parents=True, exist_ok=True)
          wave.write_text("""import 'dart:async';
import 'dart:math' as math;

import 'package:flutter/material.dart';

class LiveAudioWaveform extends StatefulWidget {
  const LiveAudioWaveform({
    super.key,
    required this.active,
    required this.level,
    required this.color,
    this.width = 84,
    this.height = 20,
    this.samples = 28,
  });

  final bool active;
  final double level;
  final Color color;
  final double width;
  final double height;
  final int samples;

  @override
  State<LiveAudioWaveform> createState() => _LiveAudioWaveformState();
}

class _LiveAudioWaveformState extends State<LiveAudioWaveform> {
  Timer? _timer;
  late List<double> _history;
  double _phase = 0;

  @override
  void initState() {
    super.initState();
    _history = List<double>.filled(math.max(8, widget.samples), .05);
    _sync();
  }

  @override
  void didUpdateWidget(covariant LiveAudioWaveform oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (oldWidget.samples != widget.samples) {
      _history = List<double>.filled(math.max(8, widget.samples), .05);
    }
    if (oldWidget.active != widget.active) _sync();
  }

  void _sync() {
    _timer?.cancel();
    _timer = null;
    if (!widget.active) return;
    _timer = Timer.periodic(const Duration(milliseconds: 70), (_) {
      if (!mounted || !widget.active) return;
      _phase += .67;
      final live = widget.level.clamp(0.0, 1.0).toDouble();
      final idle = .06 + ((math.sin(_phase) + 1) * .035);
      final texture = .72 + ((math.sin(_phase * 1.73) + 1) * .14);
      final next = (math.max(live, idle) * texture).clamp(.04, 1.0).toDouble();
      setState(() => _history = [..._history.skip(1), next]);
    });
  }

  @override
  void dispose() {
    _timer?.cancel();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return SizedBox(
      width: widget.width,
      height: widget.height,
      child: CustomPaint(
        painter: _WavePainter(samples: _history, color: widget.color),
      ),
    );
  }
}

class _WavePainter extends CustomPainter {
  const _WavePainter({required this.samples, required this.color});
  final List<double> samples;
  final Color color;

  @override
  void paint(Canvas canvas, Size size) {
    if (samples.isEmpty) return;
    final step = size.width / samples.length;
    final barWidth = math.max(1.25, math.min(2.4, step * .52));
    final center = size.height / 2;
    final paint = Paint();
    for (var i = 0; i < samples.length; i++) {
      final p = Curves.easeOutCubic.transform(samples[i].clamp(0.0, 1.0));
      final h = 3 + ((size.height - 3) * p);
      final alpha = (90 + (165 * (i / math.max(1, samples.length - 1)))).round();
      paint.color = color.withAlpha(alpha.clamp(0, 255));
      final rect = Rect.fromCenter(
        center: Offset((i + .5) * step, center),
        width: barWidth,
        height: h,
      );
      canvas.drawRRect(
        RRect.fromRectAndRadius(rect, Radius.circular(barWidth)),
        paint,
      );
    }
  }

  @override
  bool shouldRepaint(covariant _WavePainter oldDelegate) => true;
}
""", encoding='utf-8')

          def add_import(text, anchor, addition, name):
            if addition in text:
              return text
            if anchor not in text:
              raise SystemExit(f'Missing import anchor in {name}')
            return text.replace(anchor, anchor + addition, 1)

          # Dashboard AI bar: transcription/waveform stays in the field, mic is
          # on the right, and Enter arrow remains at the far right.
          path = root / 'lib/src/core/widgets/glow_search_bar.dart'
          text = path.read_text(encoding='utf-8')
          text = add_import(
            text,
            "import 'package:flutter_swipes/src/core/utils/app_haptics.dart';\n",
            "import 'package:flutter_swipes/src/core/widgets/breathing_widget.dart';\n",
            'glow_search_bar.dart',
          )
          text = add_import(
            text,
            "import 'package:flutter_swipes/src/features/ai/presentation/services/live_voice_input.dart';\n",
            "import 'package:flutter_swipes/src/features/ai/presentation/widgets/live_audio_waveform.dart';\n",
            'glow_search_bar.dart',
          )

          old_start = text.find('  Widget _voiceBars(Color color) {')
          old_end = text.find('  Widget _animatedPrompt(', old_start)
          if old_start >= 0 and old_end > old_start:
            text = text[:old_start] + text[old_end:]

          prefix_start = text.find('                            prefixIcon: _voiceActive')
          prefix_end = text.find('                            hintStyle:', prefix_start)
          if prefix_start < 0 or prefix_end < 0:
            raise SystemExit('Dashboard voice prefix block not found')
          text = text[:prefix_start] + "                            hintText: _voiceActive ? 'Listening…' : null,\n" + text[prefix_end:]

          sem_anchor = text.find("label: _voiceActive\n                                        ? 'Stop recording'")
          sem_start = text.rfind('                                Semantics(', 0, sem_anchor)
          sem_end = text.find('                                IconButton(', sem_anchor)
          if sem_start < 0 or sem_end < 0:
            raise SystemExit('Dashboard mic control not found')

          right_controls = """                                if (_voiceActive) ...[
                                  LiveAudioWaveform(
                                    active: true,
                                    level: _voiceLevel,
                                    color: blue,
                                    width: 72,
                                    height: 20,
                                    samples: 24,
                                  ),
                                  const SizedBox(width: 5),
                                ],
                                Semantics(
                                  button: true,
                                  label: _voiceActive ? 'Stop recording' : 'Start voice search',
                                  child: GestureDetector(
                                    behavior: HitTestBehavior.opaque,
                                    onTap: _toggleVoice,
                                    child: AnimatedContainer(
                                      duration: const Duration(milliseconds: 150),
                                      width: 32,
                                      height: 32,
                                      decoration: BoxDecoration(
                                        color: _voiceActive ? blue : blue.withAlpha(isLight ? 18 : 34),
                                        shape: BoxShape.circle,
                                        border: Border.all(
                                          color: _voiceActive ? blue : blue.withAlpha(90),
                                        ),
                                        boxShadow: _voiceActive
                                            ? [
                                                BoxShadow(
                                                  color: blue.withAlpha(55),
                                                  blurRadius: 12 + (_voiceLevel * 8),
                                                  spreadRadius: _voiceLevel * 1.4,
                                                ),
                                              ]
                                            : null,
                                      ),
                                      alignment: Alignment.center,
                                      child: _voiceActive
                                          ? BreathingWidget(
                                              duration: const Duration(milliseconds: 1100),
                                              minOpacity: .55,
                                              maxOpacity: 1,
                                              child: const Icon(
                                                Icons.mic_rounded,
                                                color: Colors.white,
                                                size: 18,
                                              ),
                                            )
                                          : Icon(
                                              Icons.mic_rounded,
                                              color: blue,
                                              size: 18,
                                            ),
                                    ),
                                  ),
                                ),
"""
          text = text[:sem_start] + right_controls + text[sem_end:]
          text = text.replace(
            'Recording · waveform is live · tap Stop to transcribe',
            'Listening · live voice · tap mic to stop',
          )
          path.write_text(text, encoding='utf-8')

          # Intel Core: add the same real waveform beside its mic.
          path = root / 'lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart'
          text = path.read_text(encoding='utf-8')
          text = add_import(
            text,
            "import 'package:flutter_swipes/src/features/ai/presentation/services/live_voice_input.dart';\n",
            "import 'package:flutter_swipes/src/features/ai/presentation/widgets/live_audio_waveform.dart';\n",
            'intel_core_sheet.dart',
          )
          marker = "                      const SizedBox(width: 6),\n                      Expanded(\n                        child: TextField("
          if marker in text and 'LiveAudioWaveform(\n                          active: _recording' not in text:
            replacement = """                      if (voiceActive) ...[
                        const SizedBox(width: 4),
                        LiveAudioWaveform(
                          active: _recording,
                          level: _voiceLevel,
                          color: isLight ? _aiBlue : _aiBlueSoft,
                          width: 88,
                          height: 22,
                          samples: 28,
                        ),
                        const SizedBox(width: 8),
                      ] else
                        const SizedBox(width: 6),
                      Expanded(
                        child: TextField("""
            text = text.replace(marker, replacement, 1)
          text = text.replace(
            "_recording\n                                            ? Icons.graphic_eq_rounded\n                                            : Icons.mic_none_rounded",
            'Icons.mic_rounded',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/ai/presentation/widgets/live_audio_waveform.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/dashboard/presentation/widgets/intel_core_sheet.dart
          git diff --cached --check
          git commit -m "fix(voice): real waveform with right-side mic"
          git push origin HEAD:main
