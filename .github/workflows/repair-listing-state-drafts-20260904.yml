name: Repair listing state and local drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-listing-state-drafts-20260904.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Finish later = true in-app pause. Never uploads draft rows/media
          #    to Supabase and therefore can never accidentally look published.
          #    The exact XFile objects (including video) survive route changes
          #    for the current app session.
          # ------------------------------------------------------------------
          draft = Path('lib/src/features/add/data/listing_draft_repository.dart')
          draft.write_text(r'''import 'package:cross_file/cross_file.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';

          class SavedListingDraft {
            const SavedListingDraft({
              required this.id,
              required this.draftKey,
              required this.kind,
              required this.category,
              required this.step,
              required this.payload,
              required this.updatedAt,
              this.sourceListingId,
              this.photos = const [],
              this.video,
              this.documents = const [],
              this.backgroundMusic,
            });

            final String id;
            final String draftKey;
            final String kind;
            final String category;
            final int step;
            final Map<String, dynamic> payload;
            final DateTime updatedAt;
            final String? sourceListingId;
            final List<XFile> photos;
            final XFile? video;
            final List<XFile> documents;
            final XFile? backgroundMusic;
          }

          /// A paused listing draft is deliberately LOCAL to the running app.
          ///
          /// `Finish later` is a pause action, not a publish/upload action. No
          /// draft row, photo, video, music file, or document is written to
          /// Supabase. Keeping the original XFile objects also prevents the old
          /// bug where a restored draft came back without its selected video.
          class ListingDraftRepository {
            ListingDraftRepository();

            static final Map<String, SavedListingDraft> _pausedDrafts =
                <String, SavedListingDraft>{};

            Future<SavedListingDraft?> load(String draftKey) async {
              final draft = _pausedDrafts[draftKey];
              if (draft == null) return null;
              return SavedListingDraft(
                id: draft.id,
                draftKey: draft.draftKey,
                kind: draft.kind,
                category: draft.category,
                step: draft.step,
                payload: Map<String, dynamic>.from(draft.payload),
                updatedAt: draft.updatedAt,
                sourceListingId: draft.sourceListingId,
                photos: List<XFile>.from(draft.photos),
                video: draft.video,
                documents: List<XFile>.from(draft.documents),
                backgroundMusic: draft.backgroundMusic,
              );
            }

            Future<void> save({
              required String draftKey,
              required String kind,
              required String category,
              required int step,
              required Map<String, dynamic> payload,
              String? sourceListingId,
              List<XFile> photos = const [],
              XFile? video,
              List<XFile> documents = const [],
              XFile? backgroundMusic,
            }) async {
              _pausedDrafts[draftKey] = SavedListingDraft(
                id: 'paused:$draftKey',
                draftKey: draftKey,
                kind: kind,
                category: category,
                step: step,
                payload: Map<String, dynamic>.from(payload),
                updatedAt: DateTime.now(),
                sourceListingId: sourceListingId,
                photos: List<XFile>.from(photos),
                video: video,
                documents: List<XFile>.from(documents),
                backgroundMusic: backgroundMusic,
              );
            }

            Future<void> delete(String draftKey) async {
              _pausedDrafts.remove(draftKey);
            }
          }

          final listingDraftRepositoryProvider = Provider<ListingDraftRepository>((ref) {
            return ListingDraftRepository();
          });
          ''')

          ai = Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart')
          s = ai.read_text()
          s = s.replace("_status = 'Saving your draft…';", "_status = 'Pausing your draft…';")
          s = s.replace("_status = 'Draft saved ✓';", "_status = 'Draft paused ✓';")
          s = s.replace(
              "_showMessage('Saved. You can finish this listing later.');",
              "_showMessage('Paused locally. Nothing was published or uploaded.');",
          )
          ai.write_text(s)

          # ------------------------------------------------------------------
          # 2) Any owner edit/archive/delete/reorder invalidates every public
          #    listing surface immediately, not only the Profile provider.
          # ------------------------------------------------------------------
          provider = Path('lib/src/features/profile/presentation/providers/my_listings_provider.dart')
          s = provider.read_text()
          import_anchor = "import 'package:flutter_swipes/src/features/swipes/domain/models/listing.dart';\n"
          if "swipe_providers.dart" not in s:
              s = must_replace(
                  s,
                  import_anchor,
                  import_anchor + "import 'package:flutter_swipes/src/features/swipes/presentation/providers/swipe_providers.dart';\n",
                  'my listings swipe provider import',
              )
          s = must_replace(
              s,
              """  void _refresh() {
    _ref.invalidate(myListingsProvider);
    _ref.invalidate(ownerListingsStatsProvider);
  }
""",
              """  void _refresh() {
    _ref.invalidate(myListingsProvider);
    _ref.invalidate(ownerListingsStatsProvider);
    // Quick filters and swipe decks are authoritative live projections of the
    // listing table. An owner delete/archive/cover reorder must invalidate them
    // in the same transaction so a removed/old card cannot remain on screen.
    _ref.invalidate(quickFilterPreviewListingsProvider);
    _ref.invalidate(swipeListingsProvider);
  }
""",
              'owner listing public-surface refresh',
          )
          provider.write_text(s)

          # ------------------------------------------------------------------
          # 3) Profile miniatures must never render frame 0 of a video (often
          #    black). Always show the listing cover photo, then server poster.
          # ------------------------------------------------------------------
          profile = Path('lib/src/features/profile/presentation/screens/profile_screen.dart')
          s = profile.read_text()
          s = s.replace("import 'package:video_player/video_player.dart';\n", '')
          start = s.find('/// Instagram-style listing cover:')
          end = s.find('class _EmptyGallery extends StatelessWidget', start)
          if start < 0 or end < 0:
              raise SystemExit('missing profile listing preview section')
          replacement = r'''/// Profile miniatures are still images by design. A video frame at 0:00 is
/// commonly black on Safari/PWA and wastes a decoder for every grid tile. Use
/// the real listing cover first and the processed server poster as fallback.
class _ListingTilePreview extends StatelessWidget {
  const _ListingTilePreview({required this.listing});

  final Listing listing;

  String? get _previewUrl {
    for (final raw in listing.images) {
      final url = raw.trim();
      if (url.isNotEmpty) return url;
    }
    final poster = listing.videoPosterUrl?.trim();
    return poster == null || poster.isEmpty ? null : poster;
  }

  @override
  Widget build(BuildContext context) {
    final image = _previewUrl;
    if (image == null) {
      return const ColoredBox(
        color: Color(0xFF20242D),
        child: Center(child: Icon(Icons.photo_outlined)),
      );
    }
    return Image.network(
      image,
      fit: BoxFit.cover,
      cacheWidth: 480,
      gaplessPlayback: true,
      filterQuality: FilterQuality.medium,
      errorBuilder: (_, _, _) => const ColoredBox(
        color: Color(0xFF20242D),
        child: Center(child: Icon(Icons.image_not_supported_outlined)),
      ),
    );
  }
}

'''
          s = s[:start] + replacement + s[end:]
          profile.write_text(s)

          # ------------------------------------------------------------------
          # 4) Quick filters never resurrect decorative/old media after their
          #    live listing feed resolves empty. Also key each media player to
          #    listing IDs + URLs so update/delete swaps state immediately.
          # ------------------------------------------------------------------
          bento = Path('lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart')
          s = bento.read_text()
          s = must_replace(
              s,
              """        : listingPreviewMedia.isNotEmpty
        ? listingPreviewMedia
        : isListingPreviewQuickFilter && !previewResolved
        ? const <String>[]
        : BentoMediaPools.forId(item.id);
""",
              """        : isListingPreviewQuickFilter
        ? (previewResolved ? listingPreviewMedia : const <String>[])
        : BentoMediaPools.forId(item.id);
""",
              'authoritative listing quick-filter media',
          )
          s = must_replace(
              s,
              """                PropertyTeaserCard(
                  media: liveListingMedia,
""",
              """                PropertyTeaserCard(
                  key: ValueKey(
                    'property:${listingPreviewListingIds.join('|')}:${liveListingMedia.join('|')}',
                  ),
                  media: liveListingMedia,
""",
              'property teaser identity key',
          )
          s = must_replace(
              s,
              """                QuickFilterMedia(
                  sources: widget.media,
""",
              """                QuickFilterMedia(
                  key: ValueKey(
                    '${widget.handoffCategoryId}:${widget.sourceListingIdsByIndex.join('|')}:${widget.media.join('|')}',
                  ),
                  sources: widget.media,
""",
              'generic quick-filter identity key',
          )
          bento.write_text(s)
          PY

          git diff --check
          grep -q "Nothing was published or uploaded" lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart
          grep -q "_ref.invalidate(quickFilterPreviewListingsProvider);" lib/src/features/profile/presentation/providers/my_listings_provider.dart
          grep -q "processed server poster" lib/src/features/profile/presentation/screens/profile_screen.dart
          grep -q "previewResolved ? listingPreviewMedia" lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "swipess-fix-bot"
          git config user.email "woorkify@gmail.com"
          git add \
            lib/src/features/add/data/listing_draft_repository.dart \
            lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart \
            lib/src/features/profile/presentation/providers/my_listings_provider.dart \
            lib/src/features/profile/presentation/screens/profile_screen.dart \
            lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix(listings): make previews authoritative and drafts local"
            git push origin HEAD:main
          fi
