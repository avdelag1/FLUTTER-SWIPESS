name: Apply Studio soundtrack mux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-studio-audio-mux-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply decoder-friendly delivery tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          studio_path = Path('api/studio-render-node.js')
          s = studio_path.read_text()
          compose_start = s.index('async function composeShots')
          compose_end = s.index('async function makePoster')
          before = s[:compose_start]
          compose = s[compose_start:compose_end]
          after = s[compose_end:]
          compose = compose.replace(
              "    'high',\n    '-level:v',\n    '4.1',",
              "    'main',\n    '-level:v',\n    '4.0',\n    '-tune',\n    'fastdecode',",
              1,
          )
          compose = compose.replace(
              "    '8500k',\n    '-bufsize',\n    '17000k',",
              "    '3600k',\n    '-bufsize',\n    '7200k',",
              1,
          )
          compose = compose.replace(
              "    '-g',\n    '60',\n    '-keyint_min',\n    '60',",
              "    '-g',\n    '30',\n    '-keyint_min',\n    '30',",
              1,
          )
          studio_path.write_text(before + compose + after)

          transcode_path = Path('api/video-transcode.js')
          t = transcode_path.read_text()
          t = t.replace(
              "    'high',\n    '-level:v',\n    '4.0',",
              "    'main',\n    '-level:v',\n    '4.0',\n    '-tune',\n    'fastdecode',",
              1,
          )
          t = t.replace(
              "    '4500k',\n    '-bufsize',\n    '9000k',",
              "    '3600k',\n    '-bufsize',\n    '7200k',",
              1,
          )
          t = t.replace(
              "    '-g',\n    '60',\n    '-keyint_min',\n    '60',",
              "    '-g',\n    '30',\n    '-keyint_min',\n    '30',",
              1,
          )
          transcode_path.write_text(t)
          PY
      - name: Verify JavaScript and delivery contract
        run: |
          grep -q 'buildStudioSoundtrackWav' api/studio-render-node.js
          grep -q 'manifest.audioPreset' api/studio-render-node.js
          grep -q "'-c:a'" api/studio-render-node.js
          grep -q "'main'" api/studio-render-node.js
          grep -q "'3600k'" api/studio-render-node.js
          grep -q "'fastdecode'" api/studio-render-node.js
          grep -q "'main'" api/video-transcode.js
          grep -q "'3600k'" api/video-transcode.js
          grep -q "'fastdecode'" api/video-transcode.js
          node --check api/studio-render-node.js
          node --check api/video-transcode.js
      - name: Commit and push safely
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name swipess-ci
          git config user.email actions@users.noreply.github.com
          git add api/studio-render-node.js api/video-transcode.js
          git commit -m 'perf(video): finish decoder-friendly Studio and listing delivery'
          git pull --rebase origin main
          git push origin HEAD:main
