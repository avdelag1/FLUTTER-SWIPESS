name: Apply Studio soundtrack mux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-studio-audio-mux-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_studio_audio_mux_20260905.py
      - name: Verify JavaScript
        run: |
          grep -q 'buildSoundtrackWav' api/studio-render-node.js
          grep -q 'manifest.audioPreset' api/studio-render-node.js
          grep -q "'-c:a'" api/studio-render-node.js
          node --check api/studio-render-node.js
          node --check api/video-transcode.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name swipess-ci
          git config user.email actions@users.noreply.github.com
          git add api/studio-render-node.js api/video-transcode.js
          git commit -m 'fix(video): bake Studio soundtrack into smooth MP4 delivery'
          git push origin HEAD:main
