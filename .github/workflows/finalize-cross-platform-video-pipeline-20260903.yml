name: Finalize cross-platform video pipeline 20260903

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-video-pipeline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final video source patch
        run: python3 .github/scripts/finalize_video_pipeline_20260903.py
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "Video source already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/swipes/data/repositories/listing_repository.dart \
                  lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart
          git commit -m "Finalize universal listing video delivery pipeline"
          git push origin HEAD:main
