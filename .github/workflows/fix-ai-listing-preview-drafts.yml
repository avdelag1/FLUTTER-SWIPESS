name: Finish AI listing preview and drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-listing-preview-drafts.yml'
      - '.github/scripts/patch_ai_listing_media_flow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AI listing media flow
        run: python3 .github/scripts/patch_ai_listing_media_flow.py
      - name: Commit patched media flow
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart \
            lib/src/features/camera/presentation/screens/video_cropper_screen.dart
          git commit -m 'Add soundtrack trim flow and AI detail summary'
          git push origin HEAD:main
