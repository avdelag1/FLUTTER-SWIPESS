name: Finish AI listing preview and drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ai-listing-preview-drafts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AI listing flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart')
          s = p.read_text()

          def once(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'marker missing: {label}')
              s = s.replace(old, new, 1)

          once(
              "import 'package:flutter_swipes/src/features/add/presentation/providers/add_listing_provider.dart';\n",
              "import 'package:flutter_swipes/src/features/add/presentation/providers/add_listing_provider.dart';\nimport 'package:flutter_swipes/src/features/add/data/listing_draft_repository.dart';\n",
              'draft repo import',
          )
          once(
              "import 'package:flutter_swipes/src/features/add/presentation/widgets/listing_video_soundtrack_picker.dart';\n",
              "import 'package:flutter_swipes/src/features/add/presentation/widgets/listing_video_soundtrack_picker.dart';\nimport 'package:flutter_swipes/src/features/add/presentation/widgets/listing_video_inline_preview.dart';\n",
              'video preview import',
          )

          lifecycle = '''  @override
  void initState() {
    super.initState();
    Future<void>.microtask(_restoreSavedDraft);
  }

  Future<void> _restoreSavedDraft() async {
    try {
      final saved = await ref.read(listingDraftRepositoryProvider).load('ai-new');
      if (!mounted || saved == null) return;
      final payload = saved.payload;
      setState(() {
        final category = saved.category.toLowerCase();
        if (const {'property', 'worker', 'motorcycle', 'bicycle', 'yacht'}.contains(category)) {
          _category = category;
        }
        _city.text = payload['city']?.toString() ?? '';
        _price.text = payload['price']?.toString() ?? '';
        _description.text = payload['description']?.toString() ?? '';
        final currency = (payload['currency']?.toString() ?? '').toUpperCase();
        if (currency == 'USD' || currency == 'MXN') _currency = currency;
        _videoAudioEnabled = payload['video_audio_enabled'] != false;
        _backgroundMusicPreset = payload['background_music_preset']?.toString();
        _backgroundMusicName = payload['background_music_name']?.toString();
        _photos
          ..clear()
          ..addAll(saved.photos);
        _video = saved.video;
        _backgroundMusic = saved.backgroundMusic;
      });
    } catch (error) {
      debugPrint('[AiListingBuilder] draft restore skipped: $error');
    }
  }

  Future<void> _saveDraft() async {
    if (_busy) return;
    await _stopMic();
    if (!mounted) return;
    setState(() {
      _busy = true;
      _status = 'Saving your draft…';
    });
    try {
      final documents = List<XFile>.of(ref.read(addListingProvider).legalDocuments);
      await ref.read(listingDraftRepositoryProvider).save(
        draftKey: 'ai-new',
        kind: 'ai',
        category: _category,
        step: 0,
        payload: <String, dynamic>{
          'city': _city.text.trim(),
          'price': _price.text.trim(),
          'description': _description.text,
          'currency': _currency,
          'video_audio_enabled': _videoAudioEnabled,
          'background_music_preset': _backgroundMusicPreset,
          'background_music_name': _backgroundMusicName,
        },
        photos: _photos,
        video: _video,
        documents: documents,
        backgroundMusic: _backgroundMusic,
      );
      if (!mounted) return;
      setState(() {
        _busy = false;
        _status = 'Draft saved ✓';
      });
      _showMessage('Saved. You can finish this listing later.');
    } catch (error) {
      debugPrint('[AiListingBuilder] draft save failed: $error');
      if (!mounted) return;
      setState(() {
        _busy = false;
        _status = null;
      });
      _showMessage('Could not save the draft right now. Nothing on this page was cleared.');
    }
  }

'''
          if 'Future<void> _saveDraft()' not in s:
              marker = "  @override\n  void dispose() {\n"
              if marker not in s:
                  raise SystemExit('marker missing: dispose')
              s = s.replace(marker, lifecycle + marker, 1)

          video_marker = "        if (_video != null) ...[\n          const SizedBox(height: 10),\n          Container(\n"
          if 'ListingVideoInlinePreview(' not in s:
              showcase = '''        if (_video != null) ...[
          const SizedBox(height: 10),
          SizedBox(
            height: 360,
            child: Row(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                Expanded(
                  flex: 3,
                  child: ListingVideoInlinePreview(
                    file: _video,
                    muted: !_videoAudioEnabled,
                    height: 360,
                  ),
                ),
                if (_photos.isNotEmpty) ...[
                  const SizedBox(width: 9),
                  Expanded(
                    flex: 2,
                    child: GridView.builder(
                      padding: EdgeInsets.zero,
                      physics: const NeverScrollableScrollPhysics(),
                      itemCount: _photos.length > 4 ? 4 : _photos.length,
                      gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: 2,
                        mainAxisSpacing: 7,
                        crossAxisSpacing: 7,
                        childAspectRatio: .72,
                      ),
                      itemBuilder: (context, index) => _PhotoTile(
                        file: _photos[index],
                        onRemove: _busy ? null : () => setState(() => _photos.removeAt(index)),
                      ),
                    ),
                  ),
                ],
              ],
            ),
          ),
          const SizedBox(height: 10),
          Container(
'''
              if video_marker not in s:
                  raise SystemExit('marker missing: video showcase')
              s = s.replace(video_marker, showcase, 1)

          s = s.replace(
              "        if (_photos.isNotEmpty) ...[\n          const SizedBox(height: 10),\n          GridView.builder(\n",
              "        if (_photos.isNotEmpty && _video == null) ...[\n          const SizedBox(height: 10),\n          GridView.builder(\n",
              1,
          )

          if 'SAVE & FINISH LATER' not in s:
              marker = "                  const SizedBox(height: 8),\n                  Text(\n                    'AI fills what it can from your description. Review the fields, choose verification or skip it, then publish.',\n"
              button = '''                  const SizedBox(height: 10),
                  SizedBox(
                    height: 50,
                    child: OutlinedButton.icon(
                      onPressed: _busy ? null : _saveDraft,
                      style: OutlinedButton.styleFrom(
                        foregroundColor: Colors.white,
                        side: BorderSide(color: Colors.white.withValues(alpha: .18)),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(17)),
                      ),
                      icon: const Icon(Icons.bookmark_add_rounded, size: 19),
                      label: Text(
                        'SAVE & FINISH LATER',
                        style: GoogleFonts.plusJakartaSans(fontSize: 11.5, fontWeight: FontWeight.w900, letterSpacing: .3),
                      ),
                    ),
                  ),
                  const SizedBox(height: 8),
                  Text(
                    'AI fills what it can from your description. Review the fields, choose verification or skip it, then publish.',
'''
              if marker not in s:
                  raise SystemExit('marker missing: draft button')
              s = s.replace(marker, button, 1)

          if "delete('ai-new')" not in s:
              marker = "      setState(() => _status = 'Listing published ✓');\n      await Future<void>.delayed(const Duration(milliseconds: 350));\n"
              repl = "      setState(() => _status = 'Listing published ✓');\n      try {\n        await ref.read(listingDraftRepositoryProvider).delete('ai-new');\n      } catch (_) {}\n      await Future<void>.delayed(const Duration(milliseconds: 350));\n"
              if marker in s:
                  s = s.replace(marker, repl, 1)

          if "lower.contains('storageexception')" not in s:
              marker = "    if (lower.contains('session expired')) return message;\n"
              repl = "    if (lower.contains('session expired')) return message;\n    if (lower.contains('storageexception') ||\n        lower.contains('row-level security') ||\n        lower.contains('statuscode: 403') ||\n        lower.contains('unauthorized')) {\n      return 'We could not upload that media right now. Your listing is still here — please try again.';\n    }\n"
              if marker not in s:
                  raise SystemExit('marker missing: friendly error')
              s = s.replace(marker, repl, 1)

          p.write_text(s)
          PY

      - name: Commit patched AI listing flow
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart
          git commit -m 'Finish AI listing preview and save-for-later flow'
          git push
