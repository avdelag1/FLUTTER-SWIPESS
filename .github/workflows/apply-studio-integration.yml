name: Apply Studio integration

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - tool/apply_studio_integration.py
      - .github/workflows/apply-studio-integration.yml
      - lib/src/features/studio/**
      - lib/src/features/add/**

permissions:
  contents: write

concurrency:
  group: studio-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0
      - name: Apply deterministic Studio patch
        run: python3 tool/apply_studio_integration.py
      - name: Commit patched listing integration
        run: |
          if git diff --quiet; then
            echo "Studio integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/add/presentation/providers/add_listing_provider.dart \
                  lib/src/features/add/presentation/screens/add_listing_screen.dart \
                  lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart
          git commit -m "feat(studio): integrate photo video into listing creation"
          git push origin HEAD:feat/studio-photo-video
