name: Fix single dashboard AI bar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-single-dashboard-ai-bar-20260904.yml'
      - 'tool/fix_single_dashboard_ai_bar_20260904.py'

permissions:
  contents: write

concurrency:
  group: fix-single-dashboard-ai-bar-20260904
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply single AI bar fix
        run: python3 tool/fix_single_dashboard_ai_bar_20260904.py

      - name: Setup Dart formatter
        uses: dart-lang/setup-dart@v1

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/core/widgets/glow_search_bar.dart \
            lib/src/features/dashboard/presentation/screens/dashboard_shell.dart

      - name: Validate duplicate guard
        run: |
          git diff --check
          grep -q 'compactHeader: true' lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          grep -q 'final bool compactHeader' lib/src/core/widgets/glow_search_bar.dart
          ! grep -q 'GlowSearchBar(' lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          test "$(grep -R --include='*.dart' -l 'GlowSearchBar(' lib/src/features/dashboard/presentation/screens lib/src/core/widgets | grep -v 'glow_search_bar.dart' | wc -l | tr -d ' ')" -eq 1

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'swipess-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/src/core/widgets/glow_search_bar.dart \
            lib/src/features/dashboard/presentation/screens/dashboard_shell.dart
          git commit -m 'Fix duplicate dashboard AI search bar'
          git push origin HEAD:main
