name: Apply Studio transition clock normalization

on:
  push:
    branches:
      - feat/studio-photo-video
    paths:
      - '.github/workflows/apply-studio-xfade-renormalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/studio-photo-video
          fetch-depth: 0
      - name: Normalize source and transition clocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('api/studio-render.js')
          text = path.read_text()
          old = '''  for (let i = 0; i < shots.length; i += 1) {
    filters.push(
      `[${i}:v]fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
        `setpts=PTS-STARTPTS,setsar=1,format=yuv420p[v${i}]`,
    );
  }

  let active = 'v0';
  let timeline = shots[0].duration;
  for (let i = 1; i < shots.length; i += 1) {
    const previous = shots[i - 1];
    const duration = previous.transition === 'hardCut'
      ? .04
      : Math.min(previous.transitionDuration, previous.duration * .35, shots[i].duration * .35);
    const offset = Math.max(.01, timeline - duration);
    const out = `mix${i}`;
    filters.push(
      `[${active}][v${i}]xfade=transition=${transitionName(previous.transition)}:` +
        `duration=${duration.toFixed(3)}:offset=${offset.toFixed(3)}[${out}]`,
    );
    active = out;
    timeline += shots[i].duration - duration;
  }
  filters.push(`[${active}]fps=${OUTPUT_FPS},format=yuv420p[vout]`);'''
          new = '''  for (let i = 0; i < shots.length; i += 1) {
    filters.push(
      `[${i}:v]fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
        `setpts=N/(${OUTPUT_FPS}*TB),setsar=1,format=yuv420p[v${i}]`,
    );
  }

  let active = 'v0';
  let timeline = shots[0].duration;
  for (let i = 1; i < shots.length; i += 1) {
    const previous = shots[i - 1];
    const duration = previous.transition === 'hardCut'
      ? .04
      : Math.min(previous.transitionDuration, previous.duration * .35, shots[i].duration * .35);
    const offset = Math.max(.01, timeline - duration);
    const raw = `mixRaw${i}`;
    const out = `mix${i}`;
    filters.push(
      `[${active}][v${i}]xfade=transition=${transitionName(previous.transition)}:` +
        `duration=${duration.toFixed(3)}:offset=${offset.toFixed(3)}[${raw}]`,
    );
    filters.push(
      `[${raw}]fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
        `setpts=N/(${OUTPUT_FPS}*TB),setsar=1,format=yuv420p[${out}]`,
    );
    active = out;
    timeline += shots[i].duration - duration;
  }
  filters.push(
    `[${active}]fps=${OUTPUT_FPS},settb=1/${OUTPUT_FPS},` +
      `setpts=N/(${OUTPUT_FPS}*TB),format=yuv420p[vout]`,
  );'''
          if old not in text:
              raise SystemExit('current Studio buildFilter block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install FFmpeg worker dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove real rendered MP4
        run: |
          node --check api/studio-render.js
          node test/studio_renderer_smoke_test.mjs
      - name: Commit only if renderer passed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/studio-render.js
          git commit -m "fix(studio): normalize every transition output"
          git push origin HEAD:feat/studio-photo-video
