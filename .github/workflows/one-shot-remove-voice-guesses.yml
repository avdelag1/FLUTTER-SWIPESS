name: Remove unsafe voice transcript guesses

on:
  push:
    branches:
      - fix/dashboard-whisper-accuracy
    paths:
      - .github/workflows/one-shot-remove-voice-guesses.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-whisper-accuracy
          fetch-depth: 0
      - name: Preserve Whisper words exactly
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/src/core/widgets/glow_search_bar.dart')
          text = p.read_text()
          old = '''  String _normalizeVoiceTranscript(String raw) {
            var text = raw;
            const fixes = <(String, String)>[
              ('context', 'contact'),
              ('contacts info', 'contact'),
              ('con tact', 'contact'),
              ('whats app', 'whatsapp'),
              ("what's app", 'whatsapp'),
            ];
            for (final (from, to) in fixes) {
              text = text.replaceAll(RegExp(from, caseSensitive: false), to);
            }
            return text;
          }
'''
          new = '''  String _normalizeVoiceTranscript(String raw) {
            var text = raw;
            // Whisper is the transcript authority. Only normalize unambiguous
            // brand formatting; never replace ordinary words based on guesses.
            const fixes = <(String, String)>[
              ('whats app', 'whatsapp'),
              ("what's app", 'whatsapp'),
            ];
            for (final (from, to) in fixes) {
              text = text.replaceAll(RegExp(from, caseSensitive: false), to);
            }
            return text;
          }
'''
          if text.count(old) != 1:
            raise SystemExit(f'expected one voice normalization block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-shot-remove-voice-guesses.yml').unlink()
          PY
      - name: Commit source cleanup
        run: |
          git config user.name "Swipess Voice Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(voice): preserve authoritative Whisper transcript"
          git push origin HEAD:fix/dashboard-whisper-accuracy
