name: Patch dashboard static previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-static-previews.yml'
      - '.github/scripts/patch_dashboard_static_previews.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply dashboard preview behavior
        run: python3 .github/scripts/patch_dashboard_static_previews.py
      - name: Commit dashboard patch
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart
          git commit -m 'Keep only Events video live on dashboard previews'
          git push origin HEAD:main
