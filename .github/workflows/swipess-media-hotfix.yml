name: SWIPESS media hotfix

on:
  push:
    paths:
      - '.github/workflows/swipess-media-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch video preload and audio ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected block in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count))

          cap = 'lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart'
          stack = 'lib/src/features/swipes/presentation/widgets/swipeable_card_stack.dart'
          quick = 'lib/src/features/dashboard/presentation/widgets/quick_filter_media.dart'
          detail = 'lib/src/features/swipes/presentation/screens/listing_detail_screen.dart'

          replace(cap, '''/// Swipe card with fast media taps, deliberate hold-to-zoom and clean social
/// feedback. Swipe labels are green YESS! / red NOUP text only.
class CapSwipeCard extends ConsumerStatefulWidget {''', '''/// Serializes playback ownership across swipe cards. A promoted card waits for
/// the previous card to be fully silent before it can play, preventing the
/// doubled/echoed audio that can otherwise happen during fast swipes.
class _SwipeCardPlaybackCoordinator {
  static CapSwipeCardState? _active;
  static Future<void> _silenceBarrier = Future<void>.value();

  static Future<void> activate(CapSwipeCardState state) async {
    if (!identical(_active, state)) {
      final previous = _active;
      _active = state;
      if (previous != null) {
        _silenceBarrier = previous._silenceForCoordinator();
      }
    }
    await _silenceBarrier;
  }

  static void release(CapSwipeCardState state) {
    if (!identical(_active, state)) return;
    _active = null;
    _silenceBarrier = state._silenceForCoordinator();
  }
}

/// Swipe card with fast media taps, deliberate hold-to-zoom and clean social
/// feedback. Swipe labels are green YESS! / red NOUP text only.
class CapSwipeCard extends ConsumerStatefulWidget {''')

          replace(cap, '''  @override
  void dispose() {
    _holdTimer?.cancel();
    _disposeVideo();
    unawaited(_soundtrack.dispose());
    super.dispose();
  }

  void _disposeVideo() {
    final player = _video;''', '''  @override
  void dispose() {
    _holdTimer?.cancel();
    _disposeVideo();
    unawaited(_soundtrack.dispose());
    super.dispose();
  }

  void _disposeVideo() {
    _SwipeCardPlaybackCoordinator.release(this);
    final player = _video;''')

          replace(cap, '''  Future<void> _applyPlaybackRole(VideoPlayerController player) async {
    if (!player.value.isInitialized) return;

    // Neighbor cards may be decoded/prepared for instant visual handoff, but
    // only the top card is allowed to advance frames or own audio.
    if (!widget.isTop) {
      await _soundtrack.stop();
      try {
        await player.setVolume(0);
        if (player.value.isPlaying) await player.pause();
      } catch (_) {}
      return;
    }

    final soundOn = ref.read(deckSoundOnProvider);''', '''  Future<void> _silenceForCoordinator() async {
    final player = _video;
    if (player != null) {
      try {
        await player.setVolume(0);
        if (player.value.isPlaying) await player.pause();
      } catch (_) {}
    }
    await _soundtrack.stop();
  }

  Future<void> _applyPlaybackRole(VideoPlayerController player) async {
    if (!player.value.isInitialized) return;

    // Neighbor cards may be decoded/prepared for instant visual handoff, but
    // only the top card is allowed to advance frames or own audio.
    if (!widget.isTop) {
      await _soundtrack.stop();
      try {
        await player.setVolume(0);
        if (player.value.isPlaying) await player.pause();
      } catch (_) {}
      return;
    }

    await _SwipeCardPlaybackCoordinator.activate(this);

    final soundOn = ref.read(deckSoundOnProvider);''')

          replace(cap, '''  Future<void> _adoptPreparedVideo(
