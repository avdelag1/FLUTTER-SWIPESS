name: One-shot unified voice harmony fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_voice_harmony_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply unified live voice behavior
        run: python3 tool/one_shot_voice_harmony_fix.py

      - name: Format touched Dart files
        run: dart format lib/src/features/ai/presentation/services/live_voice_input.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/messages/presentation/screens/chat_screen.dart

      - name: Dependencies
        run: flutter pub get

      - name: Analyze touched voice surfaces
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/src/features/ai/presentation/services/live_voice_input.dart lib/src/core/widgets/glow_search_bar.dart lib/src/features/messages/presentation/screens/chat_screen.dart

      - name: Commit fix and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/workflows/one_shot_voice_harmony_fix.yml
          rm -f tool/one_shot_voice_harmony_fix.py
          git config user.name 'swipess-voice-fix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(voice): unify live dictation and silence autosend'
          git pull --rebase origin main
          git push origin HEAD:main

# trigger: unified dashboard/intel/chat voice parity
