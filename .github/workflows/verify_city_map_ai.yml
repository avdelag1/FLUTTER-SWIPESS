name: Verify city map and AI timing

on:
  push:
    branches:
      - fix/city-map-and-ai-timing

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed files
        run: dart format lib/src/core/widgets/glow_search_bar.dart lib/src/features/map/domain/map_pin.dart lib/src/features/map/presentation/providers/map_listings_provider.dart lib/src/features/map/presentation/providers/map_profiles_provider.dart lib/src/features/map/presentation/screens/real_mapbox_screen.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build web release
        run: flutter build web --release
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/core/widgets/glow_search_bar.dart lib/src/features/map/domain/map_pin.dart lib/src/features/map/presentation/providers/map_listings_provider.dart lib/src/features/map/presentation/providers/map_profiles_provider.dart lib/src/features/map/presentation/screens/real_mapbox_screen.dart
            git commit -m "style: format city map changes"
            git push
          fi
