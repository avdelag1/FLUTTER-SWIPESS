name: One-time avatar surface finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_avatar_surface_finish.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add temporary avatars to profile and messages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main profile photo fallback.
          p = Path('lib/src/features/profile/presentation/screens/profile_screen.dart')
          s = p.read_text()
          marker = "import 'package:flutter_swipes/src/core/widgets/glass_modal.dart';"
          imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          if imp not in s:
              assert marker in s
              s = s.replace(marker, imp + "\n" + marker, 1)
          old = """                                    child: ClipOval(
                                      child: avatar != null
                                          ? Image.network(
                                              avatar,
                                              fit: BoxFit.cover,
                                              errorBuilder: (_, _, _) =>
                                                  const Icon(
                                                    Icons.person_rounded,
                                                    color: Colors.white24,
                                                    size: 56,
                                                  ),
                                            )
                                          : const Icon(
                                              Icons.person_rounded,
                                              color: Colors.white24,
                                              size: 56,
                                            ),
                                    ),"""
          new = """                                    child: FunAvatar(
                                      seed: email.isNotEmpty ? email : name,
                                      imageUrl: avatar,
                                      size: 126,
                                      semanticLabel: '$headline profile photo',
                                    ),"""
          assert old in s, 'profile avatar target not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Conversation avatar fallback.
          p = Path('lib/src/features/messages/presentation/screens/messages_screen.dart')
          s = p.read_text()
          marker = "import 'package:flutter_swipes/src/core/widgets/cap_back_button.dart';"
          imp = "import 'package:flutter_swipes/src/core/widgets/fun_avatar.dart';"
          if imp not in s:
              assert marker in s
              s = s.replace(marker, marker + "\n" + imp, 1)
          old = """                CircleAvatar(
                  radius: 28,
                  backgroundImage: conversation.avatarUrl != null
                      ? NetworkImage(conversation.avatarUrl!)
                      : null,
                  child: conversation.avatarUrl == null
                      ? Text(
                          conversation.name[0].toUpperCase(),
                          style: TextStyle(
                            color: ink,
                            fontWeight: FontWeight.bold,
                            fontSize: 20,
                          ),
                        )
                      : null,
                ),"""
          new = """                FunAvatar(
                  seed: conversation.otherUserId,
                  imageUrl: conversation.avatarUrl,
                  size: 56,
                  semanticLabel: '${conversation.name} profile avatar',
                ),"""
          assert old in s, 'message avatar target not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('.github/workflows/one_time_avatar_surface_finish.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use fun temporary avatars across profile and messages'
          git push origin HEAD:main
