name: Patch remaining event back controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch event detail navigation
        run: |
          perl -0pi -e "s#import 'package:flutter_swipes/src/core/utils/app_haptics.dart';#import 'package:flutter_swipes/src/core/utils/app_haptics.dart';\nimport 'package:flutter_swipes/src/core/widgets/cap_back_button.dart';#" lib/src/features/events/presentation/screens/event_detail_screen.dart
          perl -0pi -e "s#onTap: \(\) => Navigator\.pop\(context\),#onTap: () => NavBack.popOrGo(context, fallbackPath: AppPaths.exploreEvents),#g" lib/src/features/events/presentation/screens/event_detail_screen.dart
          perl -0pi -e "s#    final router = GoRouter\.of\(context\);\n    final navigator = Navigator\.of\(context\);\n    if \(navigator\.canPop\(\)\) navigator\.pop\(\);\n    router\.go\(AppPaths\.clientDashboard\);#    GoRouter.of(context).go(AppPaths.clientDashboard);#" lib/src/features/events/presentation/screens/event_detail_screen.dart
      - name: Verify event back patch
        run: |
          grep -q "core/widgets/cap_back_button.dart" lib/src/features/events/presentation/screens/event_detail_screen.dart
          test "$(grep -c "NavBack.popOrGo(context, fallbackPath: AppPaths.exploreEvents)" lib/src/features/events/presentation/screens/event_detail_screen.dart)" -eq 2
          ! grep -q "onTap: () => Navigator.pop(context)" lib/src/features/events/presentation/screens/event_detail_screen.dart
      - name: Commit patch
        run: |
          git config user.name "Swipess Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/src/features/events/presentation/screens/event_detail_screen.dart
          git commit -m "fix(nav): route event detail back through global helper"
          git push origin HEAD:main
