name: Patch listing video audio

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/listing_video_audio.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply listing video audio upgrade
        run: python3 .github/patches/listing_video_audio.py
      - name: Dependencies
        run: flutter pub get
      - name: Format touched Dart files
        run: |
          dart format \
            lib/src/features/add/domain/listing_draft.dart \
            lib/src/features/add/presentation/providers/add_listing_provider.dart \
            lib/src/features/add/presentation/screens/add_listing_screen.dart \
            lib/src/features/add/presentation/screens/ai_listing_builder_screen_v2.dart \
            lib/src/features/add/presentation/widgets/listing_video_soundtrack_picker.dart \
            lib/src/features/swipes/data/repositories/listing_repository.dart \
            lib/src/features/swipes/domain/listing_soundtrack.dart \
            lib/src/features/swipes/domain/models/listing.dart \
            lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart \
            test/listing_video_audio_test.dart
      - name: Analyze touched feature
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/src/features/add lib/src/features/swipes/domain lib/src/features/swipes/data/repositories/listing_repository.dart lib/src/features/swipes/presentation/widgets/cap_swipe_card.dart test/listing_video_audio_test.dart
      - name: Test listing video audio
        run: flutter test test/listing_video_audio_test.dart --reporter expanded
      - name: Commit verified upgrade
        run: |
          rm -f .github/patches/listing_video_audio.py .github/workflows/patch-listing-video-audio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add listing video soundtracks and mute controls'
          git push origin HEAD:main
