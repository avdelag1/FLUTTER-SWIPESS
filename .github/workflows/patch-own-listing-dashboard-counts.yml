name: Exclude own listings from dashboard counters

on:
  push:
    paths:
      - '.github/workflows/patch-own-listing-dashboard-counts.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Exclude signed-in user listings
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/src/features/dashboard/presentation/screens/bento_dashboard_screen.dart')
          text = path.read_text()
          old_select = ".select('category, created_at')"
          new_select = ".select('category, created_at, owner_id')"
          if old_select not in text:
              raise SystemExit('Dashboard listing count select was not found')
          text = text.replace(old_select, new_select, 1)
          old_rows = "    final listings = rows as List;"
          new_rows = "    final currentUserId = client.auth.currentUser?.id;\n    final listings = (rows as List)\n        .where(\n          (row) =>\n              currentUserId == null ||\n              row['owner_id']?.toString() != currentUserId,\n        )\n        .toList(growable: false);"
          if old_rows not in text:
              raise SystemExit('Dashboard listing count rows block was not found')
          text = text.replace(old_rows, new_rows, 1)
          path.write_text(text)
          Path('.github/workflows/patch-own-listing-dashboard-counts.yml').unlink()

      - name: Commit dashboard counter fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Exclude own listings from dashboard new-item counts"
          git pull --rebase origin main
          git push origin main
