<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swipess">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swipess">
  <meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="msapplication-navbutton-color" content="#0A0A0D">
  <meta name="color-scheme" content="dark light">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Swipess</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0A0A0D;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0A0A0D;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 120ms ease-out;
    }

    .boot-wordmark {
      color: #fff;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .boot-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 16px;
    }

    .boot-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      animation: dotJump 900ms ease-in-out infinite;
      will-change: transform, opacity;
    }

    .boot-dot:nth-child(2) { animation-delay: 120ms; }
    .boot-dot:nth-child(3) { animation-delay: 240ms; }

    @keyframes dotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: .38; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 120);
      document.body.style.background = '#0A0A0D';
    }

    window.addEventListener('flutter-first-frame', removeSplashFromWeb, { once: true });

    // Never leave a second branded loading state sitting over Flutter.
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          removeSplashFromWeb();
        }
      }, 250);
    });

    // Failsafe only; normal removal happens on the first Flutter frame.
    setTimeout(removeSplashFromWeb, 10000);

    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
</head>
<body>
  <div id="boot" aria-label="Loading Swipess">
    <div class="boot-wordmark">S W I P E S S</div>
    <div class="boot-dots" aria-hidden="true">
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
