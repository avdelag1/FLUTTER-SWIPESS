<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swipess">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swipess">
  <meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="msapplication-navbutton-color" content="#0A0A0D">
  <meta name="color-scheme" content="dark light">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Swipess</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <script>
    // Do not force www/apex in client JavaScript. The hosting platform owns the
    // canonical-domain redirect. A second browser-side canonicalization can
    // create redirect loops and stop Flutter from booting.
    (function () {
      var params = new URLSearchParams(location.search);
      window.__swipessOAuthPopup =
        params.get('oauth_popup') === '1' && !!window.opener;
      if (params.has('code') || params.has('error') || params.has('error_code')) {
        document.documentElement.classList.add('oauth-return');
      }
    })();
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0A0A0D;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0A0A0D;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 120ms ease-out;
    }

    /* OAuth is already returning to Swipess; do not flash a second branded
       splash screen while the auth client exchanges the PKCE code. */
    html.oauth-return #boot {
      display: none !important;
    }

    .boot-wordmark {
      color: #fff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .boot-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 16px;
    }

    .boot-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      animation: dotJump 900ms ease-in-out infinite;
      will-change: transform, opacity;
    }

    .boot-dot:nth-child(2) { animation-delay: 120ms; }
    .boot-dot:nth-child(3) { animation-delay: 240ms; }

    @keyframes dotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: .38; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 120);
      document.body.style.background = '#0A0A0D';
    }

    function watchOAuthPopupCompletion() {
      if (!window.__swipessOAuthPopup) return;
      var sessionKey = 'sb-vplgtcguxujxwrgguxqq-auth-token';
      var deadline = Date.now() + 30000;
      var timer = setInterval(function () {
        if (Date.now() > deadline) {
          clearInterval(timer);
          return;
        }
        var raw = null;
        try { raw = localStorage.getItem(sessionKey); } catch (_) {}
        if (!raw || raw.indexOf('"access_token"') === -1) return;

        clearInterval(timer);
        try {
          window.opener.postMessage(
            { type: 'swipess-oauth-complete' },
            location.origin
          );
        } catch (_) {}
        setTimeout(function () {
          try { window.close(); } catch (_) {}
        }, 120);
      }, 150);
    }

    window.addEventListener('flutter-first-frame', removeSplashFromWeb, { once: true });

    window.addEventListener('load', function () {
      watchOAuthPopupCompletion();
      setTimeout(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          removeSplashFromWeb();
        }
      }, 250);
    });

    // Failsafe only; normal removal happens on the first Flutter frame.
    setTimeout(removeSplashFromWeb, 10000);

    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
</head>
<body>
  <div id="boot" aria-label="Loading Swipess">
    <div class="boot-wordmark">SWIPESS</div>
    <div class="boot-dots" aria-hidden="true">
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
    </div>
  </div>

  <!-- Vercel Speed Insights for Flutter Web / static HTML. -->
  <script>
    window.si = window.si || function () {
      (window.siq = window.siq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <script>
    // ── SwipessSpeech bridge ─────────────────────────────────────────────────
    // Speech recognition events are pushed into window.SwipessSpeechQueue.
    // Dart polls this array every 80ms — no allowInterop closures needed.
    (function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = null;
      var active = false;
      var intentionalStop = false;
      var finalText = '';
      var restartTimer = null;

      // Shared event queue. Dart drains this via polling.
      window.SwipessSpeechQueue = [];

      function push(type, payload) {
        window.SwipessSpeechQueue.push({ type: type, payload: payload || '' });
      }

      function join(a, b) {
        a = (a || '').trim();
        b = (b || '').trim();
        if (!a) return b;
        if (!b) return a;
        return a + ' ' + b;
      }

      function startRecognition() {
        if (!active || intentionalStop || !SR) return;
        try {
          recognition = new SR();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;
          try { recognition.lang = navigator.language || 'en-US'; } catch(e){}

          recognition.onstart = function () {
            if (!active || intentionalStop) return;
            push('listening', 'true');
          };

          recognition.onspeechstart = function () {
            if (!active || intentionalStop) return;
            push('listening', 'true');
          };

          recognition.onresult = function (event) {
            if (!active || intentionalStop) return;
            try {
              var interim = '';
              var results = event.results;
              var idx = event.resultIndex || 0;
              for (var i = idx; i < results.length; i++) {
                var r = results[i];
                var t = (r[0] && r[0].transcript) ? r[0].transcript.trim() : '';
                if (!t) continue;
                if (r.isFinal) {
                  finalText = join(finalText, t);
                } else {
                  interim = join(interim, t);
                }
              }
              var live = join(finalText, interim);
              if (live) push('text', live);
            } catch (e) {}
          };

          recognition.onerror = function (event) {
            if (!active || intentionalStop) return;
            var code = (event.error || '').toLowerCase();
            if (code.indexOf('not-allowed') >= 0 || code.indexOf('permission') >= 0) {
              active = false;
              intentionalStop = true;
              push('listening', 'false');
              push('error', 'Microphone permission is blocked. Allow microphone access and try again.');
              return;
            }
            if (code.indexOf('audio-capture') >= 0) {
              push('error', 'Chrome could not access a microphone on this device.');
              return;
            }
            // no-speech is normal — recognition auto-restarts via onend
          };

          recognition.onend = function () {
            if (!active || intentionalStop) {
              push('listening', 'false');
              return;
            }
            // Chrome closes sessions every ~60s. Restart invisibly.
            clearTimeout(restartTimer);
            restartTimer = setTimeout(function () {
              if (active && !intentionalStop) startRecognition();
            }, 100);
          };

          recognition.start();
        } catch (e) {
          active = false;
          push('listening', 'false');
          push('error', 'Speech recognition failed to start: ' + e);
        }
      }

      window.SwipessSpeech = {
        isSupported: function () {
          return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
        },
        start: function () {
          if (!SR) {
            push('error', 'Speech recognition not supported in this browser.');
            return;
          }
          intentionalStop = false;
          finalText = '';
          window.SwipessSpeechQueue = [];
          clearTimeout(restartTimer);
          if (recognition) {
            try { recognition.abort(); } catch(e) {}
            recognition = null;
          }
          active = true;
          startRecognition();
        },
        stop: function () {
          intentionalStop = true;
          active = false;
          clearTimeout(restartTimer);
          try { if (recognition) recognition.stop(); } catch(e) {}
          recognition = null;
          push('listening', 'false');
        },
        abort: function () {
          intentionalStop = true;
          active = false;
          clearTimeout(restartTimer);
          try { if (recognition) recognition.abort(); } catch(e) {}
          recognition = null;
          push('listening', 'false');
        }
      };
    })();
    // ── end SwipessSpeech bridge ─────────────────────────────────────────────
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
