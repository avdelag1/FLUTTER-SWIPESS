<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swipess">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swipess">
  <meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="msapplication-navbutton-color" content="#0A0A0D">
  <meta name="color-scheme" content="dark light">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Swipess</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <script>
    // Do not force www/apex in client JavaScript. The hosting platform owns the
    // canonical-domain redirect. A second browser-side canonicalization can
    // create redirect loops and stop Flutter from booting.
    (function () {
      var params = new URLSearchParams(location.search);
      var hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      var accessToken = hashParams.get('access_token');
      var refreshToken = hashParams.get('refresh_token');
      var hasOAuthTokens = !!accessToken && !!refreshToken;

      window.__swipessOAuthPopup =
        params.get('oauth_popup') === '1' && !!window.opener;
      window.__swipessAdminOAuthBridge = false;

      if (
        params.has('code') ||
        params.has('error') ||
        params.has('error_code') ||
        hasOAuthTokens
      ) {
        document.documentElement.classList.add('oauth-return');
      }

      // Admin and consumer web apps intentionally use different origins. If
      // Supabase returns an Admin OAuth popup to the canonical consumer SITE_URL,
      // hand only that popup's session back to the Admin opener. We never use a
      // wildcard target origin, and same-origin consumer OAuth is left untouched.
      if (hasOAuthTokens && window.opener) {
        var openerIsSameOrigin = false;
        try {
          openerIsSameOrigin = window.opener.location.origin === location.origin;
        } catch (_) {
          // Expected when the opener is admin.swipess.com.
        }

        if (!openerIsSameOrigin) {
          var adminSession = {
            type: 'swipess-admin-oauth-session',
            access_token: accessToken,
            refresh_token: refreshToken
          };
          var adminOrigins = [
            'https://admin.swipess.com',
            'https://admin-swipess.vercel.app'
          ];

          adminOrigins.forEach(function (origin) {
            try { window.opener.postMessage(adminSession, origin); } catch (_) {}
          });

          window.__swipessAdminOAuthBridge = true;
          try {
            history.replaceState(null, document.title, location.pathname + location.search);
          } catch (_) {}
          setTimeout(function () {
            try { window.close(); } catch (_) {}
          }, 120);
        }
      }
    })();
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0A0A0D;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0A0A0D;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 120ms ease-out;
    }

    /* OAuth is already returning to Swipess; do not flash a second branded
       splash screen while the auth client exchanges the PKCE code. */
    html.oauth-return #boot {
      display: none !important;
    }

    .boot-wordmark {
      color: #fff;
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      line-height: 1;
      white-space: nowrap;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .boot-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 16px;
    }

    .boot-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      animation: dotJump 900ms ease-in-out infinite;
      will-change: transform, opacity;
    }

    .boot-dot:nth-child(2) { animation-delay: 120ms; }
    .boot-dot:nth-child(3) { animation-delay: 240ms; }

    @keyframes dotJump {
      0%, 60%, 100% { transform: translateY(0); opacity: .38; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 120);
      document.body.style.background = '#0A0A0D';
    }

    function watchOAuthPopupCompletion() {
      if (!window.__swipessOAuthPopup) return;
      var sessionKey = 'sb-vplgtcguxujxwrgguxqq-auth-token';
      var deadline = Date.now() + 30000;
      var timer = setInterval(function () {
        if (Date.now() > deadline) {
          clearInterval(timer);
          return;
        }
        var raw = null;
        try { raw = localStorage.getItem(sessionKey); } catch (_) {}
        if (!raw || raw.indexOf('"access_token"') === -1) return;

        clearInterval(timer);
        try {
          window.opener.postMessage(
            { type: 'swipess-oauth-complete' },
            location.origin
          );
        } catch (_) {}
        setTimeout(function () {
          try { window.close(); } catch (_) {}
        }, 120);
      }, 150);
    }

    window.addEventListener('flutter-first-frame', removeSplashFromWeb, { once: true });

    window.addEventListener('load', function () {
      watchOAuthPopupCompletion();
      setTimeout(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          removeSplashFromWeb();
        }
      }, 250);
    });

    // Failsafe only; normal removal happens on the first Flutter frame.
    setTimeout(removeSplashFromWeb, 10000);

    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
</head>
<body>
  <div id="boot" aria-label="Loading Swipess">
    <div class="boot-wordmark">SWIPESS</div>
    <div class="boot-dots" aria-hidden="true">
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
      <span class="boot-dot"></span>
    </div>
  </div>

  <!-- Vercel Speed Insights for Flutter Web / static HTML. -->
  <script>
    window.si = window.si || function () {
      (window.siq = window.siq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <script>
    // ── SwipessSpeech bridge ─────────────────────────────────────────────────
    // Speech recognition events are pushed into window.SwipessSpeechQueue.
    // Dart polls this array every 80ms — no allowInterop closures needed.
    (function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = null;
      var active = false;
      var intentionalStop = false;
      var finalText = '';
      var restartTimer = null;
      var selectedLang = null;
      var restartAttempts = 0;
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || '');
      var restartDelay = isMobile ? 180 : 90;
      var maxRestartAttempts = 60;
      var segmentSilenceTimer = null;

      function scheduleSegmentSilence() {
        clearTimeout(segmentSilenceTimer);
        segmentSilenceTimer = setTimeout(function () {
          if (!active || intentionalStop) return;
          var captured = normalizeTranscript(finalText);
          if (!captured) return;
          push('text', captured);
          push('silence', captured);
        }, 1200);
      }

      // Shared event queue. Dart drains this via polling.
      window.SwipessSpeechQueue = [];

      function push(type, payload) {
        window.SwipessSpeechQueue.push({ type: type, payload: payload || '' });
      }

      function wordKey(word) {
        return (word || '').toLowerCase().replace(/[^\p{L}\p{N}']/gu, '');
      }

      function normalizeTranscript(value) {
        var clean = (value || '').replace(/\s+/g, ' ').trim();
        if (!clean) return '';
        var words = clean.split(' ');
        var output = [];
        words.forEach(function (word) {
          if (!output.length || wordKey(output[output.length - 1]) !== wordKey(word)) {
            output.push(word);
          }
        });
        for (var size = Math.floor(output.length / 2); size >= 2; size--) {
          var start = output.length - (size * 2);
          var first = output.slice(start, start + size).map(wordKey).join(' ');
          var second = output.slice(start + size).map(wordKey).join(' ');
          if (first === second) {
            output.splice(start + size);
            break;
          }
        }
        return output.join(' ');
      }

      function join(a, b) {
        a = normalizeTranscript(a);
        b = normalizeTranscript(b);
        if (!a) return b;
        if (!b) return a;
        var left = a.split(' ');
        var right = b.split(' ');
        var leftKey = left.map(wordKey).join(' ');
        var rightKey = right.map(wordKey).join(' ');
        if (leftKey === rightKey) return a;
        if (rightKey.indexOf(leftKey + ' ') === 0) return b;
        if (leftKey.indexOf(rightKey + ' ') === 0) return a;
        var max = Math.min(left.length, right.length);
        for (var overlap = max; overlap > 0; overlap--) {
          if (left.slice(left.length - overlap).map(wordKey).join(' ') ===
              right.slice(0, overlap).map(wordKey).join(' ')) {
            return normalizeTranscript(a + ' ' + right.slice(overlap).join(' '));
          }
        }
        return normalizeTranscript(a + ' ' + b);
      }

      function disposeRecognition() {
        if (!recognition) return;
        try { recognition.onstart = null; } catch(e) {}
        try { recognition.onsoundstart = null; } catch(e) {}
        try { recognition.onspeechstart = null; } catch(e) {}
        try { recognition.onspeechend = null; } catch(e) {}
        try { recognition.onresult = null; } catch(e) {}
        try { recognition.onerror = null; } catch(e) {}
        try { recognition.onend = null; } catch(e) {}
        try { recognition.abort(); } catch(e) {}
        recognition = null;
      }

      function scheduleRestart(delay) {
        if (!active || intentionalStop) return;
        clearTimeout(restartTimer);
        restartTimer = setTimeout(function () {
          if (active && !intentionalStop) startRecognition();
        }, delay);
      }

      function startRecognition() {
        if (!active || intentionalStop || !SR) return;
        disposeRecognition();
        try {
          recognition = new SR();
          recognition.continuous = true;
          recognition.interimResults = true;
          // More alternatives = browser picks the best transcript.
          recognition.maxAlternatives = 3;
          // Prefer selected language; fallback to OS language; fallback to en-US.
          try {
            var lang = selectedLang || 'en-US';
            // Normalize bare language codes; keep full locales like es-MX intact.
            if (lang.indexOf('-') === -1) {
              if (lang.toLowerCase() === 'en') lang = 'en-US';
              else if (lang.toLowerCase() === 'es') lang = 'es-MX';
              else if (lang.toLowerCase() === 'fr') lang = 'fr-FR';
              else if (lang.toLowerCase() === 'pt') lang = 'pt-BR';
              else if (lang.toLowerCase() === 'zh') lang = 'zh-CN';
              else lang = lang + '-' + lang.toUpperCase();
            }
            recognition.lang = lang;
          } catch(e){}

          recognition.onstart = function () {
            if (!active || intentionalStop) return;
            restartAttempts = 0;
            push('listening', 'true');
          };

          recognition.onsoundstart = function () {
            if (!active || intentionalStop) return;
            clearTimeout(segmentSilenceTimer);
          };

          recognition.onspeechstart = function () {
            if (!active || intentionalStop) return;
            clearTimeout(segmentSilenceTimer);
            push('listening', 'true');
            push('speech', 'start');
          };

          recognition.onspeechend = function () {
            if (!active || intentionalStop) return;
            scheduleSegmentSilence();
          };

          recognition.onresult = function (event) {
            if (!active || intentionalStop) return;
            clearTimeout(segmentSilenceTimer);
            try {
              var interim = '';
              var results = event.results;
              var idx = event.resultIndex || 0;
              for (var i = idx; i < results.length; i++) {
                var r = results[i];
                // Pick the alternative with highest confidence score.
                var best = '';
                var bestConf = -1;
                for (var j = 0; j < r.length; j++) {
                  var alt = r[j];
                  var conf = alt.confidence || 0;
                  var t = (alt.transcript || '').trim();
                  if (t && conf >= bestConf) { best = t; bestConf = conf; }
                }
                if (!best) continue;
                if (r.isFinal) {
                  finalText = join(finalText, best);
                  scheduleSegmentSilence();
                } else {
                  interim = join(interim, best);
                }
              }
              var live = join(finalText, interim);
              if (live) push('text', live);
            } catch (e) {}
          };

          recognition.onerror = function (event) {
            if (!active || intentionalStop) return;
            var code = (event.error || '').toLowerCase();
            if (code.indexOf('not-allowed') >= 0 || code.indexOf('permission') >= 0) {
              active = false;
              intentionalStop = true;
              push('listening', 'false');
              push('error', 'Microphone permission is blocked. Allow microphone access and try again.');
              return;
            }
            if (code.indexOf('audio-capture') >= 0) {
              push('error', 'Chrome could not access a microphone on this device.');
              return;
            }
            // PWA/mobile browsers end sessions quickly — restart instead of dying.
            if (code === 'no-speech' || code === 'aborted' || code === 'network') {
              scheduleRestart(restartDelay);
              return;
            }
          };

          recognition.onend = function () {
            if (!active || intentionalStop) {
              push('listening', 'false');
              return;
            }
            scheduleSegmentSilence();
            // Keep the mic session alive across short browser/PWA segment boundaries.
            scheduleRestart(restartDelay);
          };

          recognition.start();
        } catch (e) {
          restartAttempts++;
          if (active && !intentionalStop && restartAttempts < maxRestartAttempts) {
            scheduleRestart(Math.min(restartDelay * restartAttempts, 1400));
            return;
          }
          active = false;
          push('listening', 'false');
          push('error', 'Speech recognition failed to start: ' + e);
        }
      }

      window.SwipessSpeech = {
        setLanguage: function(lang) {
          selectedLang = (lang && lang !== 'auto') ? lang : 'en-US';
        },
        isSupported: function () {
          return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
        },
        start: function () {
          if (!SR) {
            push('error', 'Speech recognition not supported in this browser.');
            return;
          }
          intentionalStop = false;
          finalText = '';
          restartAttempts = 0;
          window.SwipessSpeechQueue = [];
          clearTimeout(restartTimer);
          clearTimeout(segmentSilenceTimer);
          disposeRecognition();
          active = true;
          startRecognition();
        },
        stop: function () {
          intentionalStop = true;
          active = false;
          restartAttempts = 0;
          clearTimeout(restartTimer);
          clearTimeout(segmentSilenceTimer);
          try { if (recognition) recognition.stop(); } catch(e) {}
          disposeRecognition();
          push('listening', 'false');
        },
        abort: function () {
          intentionalStop = true;
          active = false;
          restartAttempts = 0;
          clearTimeout(restartTimer);
          clearTimeout(segmentSilenceTimer);
          disposeRecognition();
          push('listening', 'false');
        }
      };
    })();
    // ── end SwipessSpeech bridge ─────────────────────────────────────────────
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
