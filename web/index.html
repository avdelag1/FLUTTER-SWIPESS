<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Swipess">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swipess">
  <meta name="theme-color" content="#0A0A0D" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="msapplication-navbutton-color" content="#0A0A0D">
  <meta name="color-scheme" content="dark light">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Swipess</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0A0A0D;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0A0A0D;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .boot-logo {
      font-size: 36px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.04em;
      color: #FFFFFF;
      margin-bottom: 24px;
      user-select: none;
    }
    .boot-loader {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .boot-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #FF4D00, #E4007C);
      border-radius: 999px;
      animation: bootProgress 1.5s ease-in-out infinite;
    }
    @keyframes bootProgress {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
  <script>
    function removeSplashFromWeb() {
      document.getElementById('boot')?.remove();
      document.body.style.background = '#0A0A0D';
    }
    window.addEventListener('flutter-first-frame', function () {
      removeSplashFromWeb();
    });
    // Failsafe: never trap user if engine stalls
    setTimeout(removeSplashFromWeb, 15000);
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    }
  </script>
  <script src="https://unpkg.com/@zxing/library@0.19.1"></script>
</head>
<body>
  <div id="boot">
    <div class="boot-logo">SWIPESS</div>
    <div class="boot-loader">
      <div class="boot-bar"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
